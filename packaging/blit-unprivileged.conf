# The unprivileged deployment profile (ADR 0065).
#
# Install it as a systemd drop-in to run the gateway as the `blit` system user
# the package already creates, instead of as root:
#
#   install -D -m 0644 \
#     /usr/share/doc/blit/examples/blit-unprivileged.conf \
#     /etc/systemd/system/blit.service.d/unprivileged.conf
#   systemctl daemon-reload && systemctl restart blit
#
# What it costs, and the reason it is not the default:
#
#  * A session request may name a `user` to run as, and dropping to another
#    user needs privilege. A non-root gateway refuses that request rather than
#    running the command as itself, so with this profile every session runs as
#    `blit`. For a Hibr desktop that is what you want; for a deployment that
#    relies on per-user sessions it is not.
#  * The gateway needs the device access its groups give it. video and render
#    cover DRM/KMS, input covers evdev, audio covers /dev/snd/controlC* for
#    the card mixers (issue #68). Whether that is sufficient depends on
#    the host's udev rules and on whether anything else holds DRM master.
#    Blit cannot know that from inside a package, and a gateway that comes up
#    unable to present has no way back in on an API-only deployment -- which
#    is why switching profiles is an operator action taken with access to the
#    machine, not a packaging default.
#
# Verify after restarting, before relying on it:
#
#   curl -H "Authorization: Bearer $TOKEN" .../v1/diagnostics | grep ready
#   curl -H "Authorization: Bearer $TOKEN" .../v1/input/devices | grep '"open":true'
#
[Service]
User=blit
Group=blit
SupplementaryGroups=video render input audio
# Nothing in this profile needs to gain privilege: the gateway cannot drop a
# session to another user anyway.
NoNewPrivileges=true
