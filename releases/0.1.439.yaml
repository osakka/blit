notes: >-
  Three gaps in 0.1.437's audio stage, each one the contract claiming
  something the code did not do.

  scan_audio_devices ran once, at boot. There was no inotify watch and no
  rescan, so a USB card plugged in after Blit started never appeared and one
  unplugged reported present forever -- and two of the live host's six cards
  are USB. The audio inventory now watches its device-node root exactly as the
  evdev scan watches /dev/input, with its own rescan flag serviced from the
  same place in the loop. The watch is on the device nodes rather than procfs
  because inotify does not report changes under /proc, so the trigger is
  controlC<N> and not the cardN tree.

  Nothing broadcast device_changed for an audio device. BLIT_STREAM_HARDWARE
  was OR'd into the input broadcast in 0.1.435 for exactly this reason and
  then nothing used it, so the schema's statement that device_changed reaches
  events=hardware subscribers was false for the whole audio class.
  broadcast_device_changed is now generic over the class, and audio announces
  discovery, absence and retirement.

  The export note. libasound reads ALSA_CARD as a card name or number and
  ALSA_PCM_CARD/ALSA_PCM_DEVICE as the numbers that override its default PCM,
  so an application honouring only ALSA_CARD lands on device 0 of the card --
  which, for a chosen HDMI output other than the first, is not the device that
  was chosen. All three are exported, and the schema now says what an
  application that ignores two of them gets rather than implying the choice is
  enforced.

  The audio gate gains the hotplug case: a card appearing under the scan roots
  is discovered, the collection revision moves, the card going away retires
  it, and both are announced on events=hardware. Teeth: without the watch the
  card is never discovered and the stream carries no audio event at all.

  Also #61's harness half. run_gate() reported only a failing gate's last
  line, which is how this session's one intermittent failure left nothing to
  diagnose. It writes the whole output to a named file now and prints the
  path. An intermittent gate makes every later suite run ambiguous; losing its
  message makes that permanent.

  Suite: 47 pass, 5 skip, 0 fail.
