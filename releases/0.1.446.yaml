notes: >-
  Two terminal tickets: XTGETTCAP (#4) and the left/right margin model (#3).

  #4. Every DCS + q request was answered with the failure status and the names
  echoed back, so TN, Co, colors, RGB and everything else reported
  *unsupported* on a server that advertises TERM=xterm-kitty and supports all
  of them. A client that trusts that string and then asks here to confirm
  truecolor was pushed onto its most conservative path -- a silent downgrade
  of exactly the fidelity the TERM string promised.

  Answered now: TN, Co, colors, RGB, cols, lines, and the booleans Tc and bce,
  one DCS reply per requested name, which is what xterm and kitty both do so a
  mixed request is answered rather than failing whole.

  Refused, deliberately: the arrow keys. kcuu1 is ESC O A in application
  cursor mode and ESC [ A outside it, so any single value would be wrong half
  the time, and a wrong answer is worse than an honest refusal. Co reports 256
  rather than 16777216 because that is what the terminfo entry for the
  advertised TERM says; truecolor is what RGB and Tc are for, and disagreeing
  with the entry the client already loaded would be its own defect.

  bce is reported because terminal_erase_cell applies the pen background, and
  the conformance suite now asserts that rather than taking the code read on
  trust.

  #3. DECLRMM did nothing and the DECSLRM that should follow it was swallowed
  by the SCOSC branch, so there were no horizontal margins at all.

  The change is one pair of accessors -- "which columns may this operation
  touch" -- and then every horizontal operation asking them instead of writing
  0 and width-1. The operations did not learn about margins; they stopped
  assuming the line is the width. With DECLRMM off the accessors return 0 and
  width-1, so every existing client is byte-identical, and the conformance
  suite at full width is the proof of that rather than an argument for it.

  Covered: IL, DL, ICH, DCH, SU, SD, autowrap, CR, LF under LNM, BS, HT and
  origin-mode CUP. CSI s is DECSLRM while DECLRMM is set and SCOSC while it is
  not; turning DECLRMM off restores the full width rather than remembering the
  columns, which is what makes CSI s unambiguous again. DECSLRM ignores an
  out-of-order or out-of-range pair rather than clamping, matching DECSTBM.
  Margins reset on RIS, DECSTR and resize.

  Two decisions named rather than left implicit. A cursor outside the
  horizontal margins makes an insert or delete a no-op -- the rule DEC states
  for the scroll margins, what ICH and DCH already do, and the vertical half
  of which was already here as scroll_bottom. The ticket's own repro expected
  a confined shift with the cursor at column 1; the behaviour shipped is the
  no-op, and the gate says so in those words. And a two-cell glyph whose
  second half would fall outside the right margin wraps before it is placed,
  rather than being split across the margin or silently narrowed.

  One defect found by these vectors before it shipped: enabling DECLRMM on a
  surface that had never run DECSLRM left right_margin at 0 -- the field was
  zero from the surface's own initialisation -- so every character wrapped at
  column 0. Fixed at the three places the scroll region is initialised, and
  defensively when the mode is enabled.

  Two of my own expectations were wrong and the vectors caught those too, not
  the product: ICH at the left margin pushes the character at the right margin
  out and loses it, and 256-colour index 4 is #0000ee here, not #000080.

  Sixteen new vectors across the two tickets. Teeth for #3: with the accessors
  reporting the full width whatever DECLRMM says -- the pre-change world
  exactly -- the insert-line vector reports the ticket's own symptom, a shift
  across the whole width. Teeth for #4: restored to the blanket refusal, the
  TN vector reports the old reply byte for byte.

  Suite: 49 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54, tools/probes/host_terminal_features.rb --
  both features exercised through a real session on the deployed build rather
  than only in the local fixture:

    margins 3..6, cursor at column 3, CSI 2L
      |AA          |   the two columns left of the margin are untouched
      |BB          |
      |CCAA1       |   and the shifted content stays inside 3..6
      |DDBB2       |
      |  CC3       |

    XTGETTCAP TN -> 1b50312b72353434453d373837343635373236443244364236393734373437391b5c
                    ESC P 1 + r TN=xterm-kitty ESC backslash

  The desktop came back with 32,400 printable cells at revision 859; errors
  and warnings both empty.
