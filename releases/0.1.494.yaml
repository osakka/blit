notes: >-
  0.1.494 addresses Blit issue #70. Render cadence, requested renderer,
  direct-KMS asynchronous pageflip policy, empty-output expectation, pane
  layout, and font profile/scale are API-owned settings. Environment values
  are boot defaults only when the document is silent. Pane layout remains
  live-owned by /v1/topology and is persisted through the settings document.
  BLIT_EVDEV_MOUSE remains a compatibility boot override and is deliberately
  not duplicated in the stable input-device API. A live 0.1.493 host accepted
  render_interval_ms=7, was supervised-updated with this exact artifact, and
  retained the setting across restart; the setting was then restored to the
  original empty server section. Hibr source was not modified.
