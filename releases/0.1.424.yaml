notes: >-
  Issue #15. Kitty graphics now implement the placement model and the delete
  targets (ADR 0060). x/y/w/h select a source rectangle rather than offsetting
  the destination, X/Y offset within the cell, p= numbers up to 8 placements
  per image, and a=d supports targets a i c p q x y z in both cases, where
  lowercase keeps image data and uppercase frees it. Keys not implemented
  (I P Q H V S O, t other than d, U other than 0) and unknown delete targets
  are refused with unsupported-key / unsupported-delete-target in
  graphics_diagnostics.last_error instead of being silently ignored. SDL and
  KMS draw from one z-sorted draw list.

  tools/tests/kitty_placement_gate.rb asserts framebuffer pixels for a crop,
  a cell offset, two numbered placements and z order; against the 0.1.421
  server it fails the crop, offset and placement assertions. The conformance
  vector kitty-placement-keys asserts state and refusals and fails on the
  previous release because the placements array is absent.

  Hibr's emitter sends only a=T (no x/y), d=I and d=A, so the changed meaning of
  x/y does not reach it.

  Not covered: t=f/t/s file and shared-memory transmission, unicode
  placeholders, animation, relative placements. The KMS path is covered by the
  shared draw list and local renderer tests; live-host screenshot evidence is
  recorded at deployment.
