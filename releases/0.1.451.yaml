notes: >-
  Epic #64 stage 1 (#65): the machine remembers its settings. ADR 0067 moves
  from proposed to accepted in this release.

  ADR 0064 held a device's configuration in memory deliberately and deferred
  the decision. #63 then measured the cost: a supervised update stops and
  starts the unit, so every pointer speed, keyboard layout and default audio
  device was lost on every release -- and the stated recovery, "a controller
  re-applies what it wants", assumes a control panel that is running,
  authenticated and there before anybody touches the machine. At boot none of
  that holds.

  The document is /var/lib/blit/settings.json, and the unit now owns it with
  StateDirectory=blit. That was measured as necessary rather than added for
  tidiness: the directory was root:root 0755 and the unprivileged profile's
  `blit` user is in group `blit` alone, so it could not have written there.

  A stored configuration is replayed through the function the previous commit
  separated out -- the one a PATCH goes through. The equality is the point: a
  parallel loader would drift, and the first symptom would be a stored setting
  the API refuses and the loader accepts. It also means ADR 0067's "a stored
  property the device contradicts lies dormant" rule is not implemented at
  all, because it is the same 422.

  Settings are applied where a device acquires its id, which turned out to be
  two places -- the direct probe and the opener thread's adoption -- and both
  do it. The first attempt wired only one, and the restart test caught it: a
  device opened off the thread came back at the defaults while one opened
  directly came back configured.

  Two ids are absent from the document by decision, both recorded in the item
  rather than left to be discovered. An `input-node-<basename>` id says in
  itself that it is not stable, so restoring against it could apply one
  device's settings to whatever took its place. A `route` names a session-N
  target, which does not survive a restart either.

  /v1/settings makes the document a resource -- GET, PUT with If-Match, DELETE
  -- so backup, restore and reset are API operations and the file stays an
  implementation detail behind its `version`. PUT replaces rather than merges,
  because a merge cannot express "this and nothing else", which is what
  restoring a backup means.

  Writes coalesce for 500 ms and flush unconditionally at teardown -- one
  place rather than three, because #63 made the exit paths converge. The write
  is temp-file, fsync, rename, for the document truncated by a power cut.

  Both failure shapes are handled and gated. An unparseable document never
  stops a boot: renamed aside, defaults applied,
  settings_document_unreadable in the enumerated warnings where #55 taught
  this host to look. A *valid* setting that locks the machine out --
  enabled:false on its only keyboard -- is undoable through DELETE
  /v1/settings and, when that is what has been lost, through a boot-only
  BLIT_SETTINGS=ignore that starts from the defaults and leaves the document
  intact. In that mode a PUT is refused -- a write that could not stick is
  worse than a refusal -- but a DELETE still clears the document, so recovery
  can be finished without a shell. That last distinction was not in the ADR as
  first written; it came out of running the recovery and finding it
  half-finished.

  One narrow test seam. A fabricated node is a regular file, so every identity
  ioctl fails and the device reports nothing -- precisely the unstable-id
  case. The gate could not otherwise have had a device with a *stable* id and
  so could not have tested the distinction that matters, so `<node>.identity`
  supplies what the ioctls would have, read only when BLIT_INPUT_ROOT is set.
  A real /dev/input has no such files and the seam is not looked for.

  The dormant-entry scenario carries a refused entry and an accepted one. With
  only the refused entry, "the refused value was not applied" is also true of
  a server that applies nothing at all, and the scenario would have passed
  against the very build it exists to catch -- which it did, on the first
  teeth run, until the second device was added.

  Teeth: with the loading, saving and the resource removed from this tree all
  eight scenarios fail, 28 individual failures, headline
  `the stable device kept its setting, got 100`.

  Also in this release, from the same stage: the audio `default` write was
  separated from its request the same way, and the OpenAPI contract is 37
  paths.

  Suite: 53 pass, 5 skip, 0 fail.
