notes: >-
  Epic #64 stage 4 (#68): a card's mixer belongs to the API.
  `configuration.default` was the entire writable surface of an audio device,
  so a control panel could not set a volume -- and the reason it could not is
  that Blit had never opened an ALSA *control* device, only the PCM nodes'
  presence.

  The mixer belongs to the **card**. ADR 0064's audio id is per PCM because
  that is what an application opens, and this host has four HDMI outputs on
  one card -- so a mixer held per PCM would be four copies of one thing and a
  write through one would leave three stale. It is its own resource, every PCM
  carries `card_controls`, and every card carries `shares_controls_with`,
  because a controller showing four outputs with four sliders would otherwise
  be surprised when they moved together.

  Raw SNDRV_CTL_IOCTL_* on /dev/snd/controlC<N> through <sound/asound.h> -- a
  kernel UAPI header, so no libasound and no new dependency, the same way this
  codebase already speaks to evdev and DRM.

  The listing was proved against all six of the host's cards with a read-only
  probe *before* the model was built around it, and that is why the resolution
  rule is shaped the way it is rather than guessed. The six cards between them
  report:

    controlC0   6 elements   PCM Playback Volume 0..255, the only one
    controlC1  28 elements   IEC958 Playback Switch x4, no volume at all
    controlC2  13 elements   Master Playback Volume 0..87 and a PCM one
    controlC3   3 elements   capture only
    controlC4   8 elements   Mic and Speaker Playback Volume, no Master
    controlC5   2 elements   capture only, range 0..9216

  So: Master if there is one; else the only "* Playback Volume" if there is
  exactly one; else nothing. Every branch exists on this hardware, including
  the ambiguous one, where the properties are *absent* and a write is refused
  with audio_control_ambiguous rather than guessing which of two elements the
  operator meant.

  mute is the inverse of the playback switch, because an ALSA switch is on
  when audible.

  The percentage property took three attempts to state correctly and the
  comment in blit_audio_control.h records all three. `percent -> raw ->
  percent` exact needs a span of at least 100; `raw -> percent -> raw` exact
  needs at most 100; they are complementary and neither holds everywhere,
  because 88 values cannot distinguish 101 percentages. What rounding both
  ways buys, on every range, is that the cycle *settles after one
  application*: read, show, write back, and you land where you started. A
  slider may snap once; it never drifts. Truncating breaks that, and that is
  the teeth -- 123 assertions fail with it.

  Not persisted, deliberately: control values are the card's own state and the
  card keeps them, so storing and re-applying would make Blit fight alsactl
  for ownership of something that already survives a reboot. A pointer's
  sensitivity exists only in Blit; a mixer level does not. The `default` flag
  on a PCM is Blit's own and stays persisted.

  The group, said exactly rather than ticked: /dev/snd/controlC* is root:audio
  and the unit granted video, render and input -- so this would have worked in
  the root profile and silently not in the unprivileged one, a difference that
  only appears after switching. `audio` is in both unit files now. What is
  **not** claimed is that the unprivileged profile can open the control
  device: the gate runs as the developer against fabricated files and the host
  runs root, so that measurement belongs to an operator who switches profiles
  (ADR 0065). state.control_accessible is reported separately from a PCM's
  accessible so the difference is visible either way.

  Out of scope and said so in docs/api.md: format and sample-rate selection.
  It is a PCM hw_params question rather than a mixer one and would mean Blit
  opening a PCM, which it does not do.

  Gates: audio_control_gate.c pins the arithmetic on six real ranges including
  a two-value one and a negative floor, plus the resolution rule in all five
  shapes the host has. audio_card_gate.rb, eight scenarios against three
  fabricated cards -- one with Master and two PCMs, one with four PCMs and no
  unambiguous volume, one whose control device cannot be read at all. Teeth:
  7 of 8 fail with 35 failures; the eighth asserts the If-Match and
  unknown-property discipline, a baseline the teeth build shares.

  Suite: 58 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54 with tools/probes/host_audio_controls.rb --
  the real SNDRV_CTL_IOCTL_* round-trip, which no gate can do:

    cards: 6                                    pcms: 12
      Device      6 elements  shares=2  volume=PCM Playback Volume
      Generic    28 elements  shares=4  volume=(none)
      Generic_1  13 elements  shares=2  volume=Master Playback Volume
      RC          3 elements  shares=1  volume=(none)
      QuadCast    8 elements  shares=2  volume=(none)
      Meet        2 elements  shares=1  volume=(none)

    the most shared mixer: Generic, 4 PCMs
      audio-generic-pcm3-p, -pcm7-p, -pcm8-p, -pcm9-p

  Four PCMs on one mixer is the case the card-owned model exists for, and it
  is on this hardware rather than hypothetical.

  The resolution rule in three of its shapes, all real: `Device` resolves to
  its sole PCM Playback Volume; `Generic_1` resolves to Master Playback
  Volume, beating the PCM Playback Volume it also has; `QuadCast` has two
  playback volumes and no Master and is refused with
  audio_control_ambiguous. Three cards have no playback volume at all.

  Both range classes measured, because the quantisation is only visible on
  one of them -- the probe exercises every resolved card rather than the
  first, which is a correction made after the first run measured only half
  the story:

    Device     PCM Playback Volume  0..255  1 channel
      asked  25% -> card holds [64]      -> reads back 25%
      asked  50% -> card holds [128]     -> reads back 50%
      asked  75% -> card holds [191]     -> reads back 75%

    Generic_1  Master Playback Volume  0..87  2 channels
      asked  25% -> card holds [22, 22]  -> reads back 25%
      asked  50% -> card holds [44, 44]  -> reads back 51%
      asked  75% -> card holds [65, 65]  -> reads back 75%

  A span of 255 holds every percentage; a span of 87 cannot, and 50% comes
  back as 51%. That is why what gets reported is the read-back. Writing the
  read-back settles rather than drifting, asserted on both.

  mute inverted the playback switch on both cards, two channels took the same
  value, an out-of-range named write was refused, an unknown element was a
  404, and every value the probe touched was restored -- [102] and [60, 60].

  Every control device was accessible, which is the root profile working; the
  unprivileged profile's access is still only a group in a unit file and not a
  measurement.

  The deployment was clean, #63 holding in a sixth release:

    14:50:12 Stopping blit.service ...
    14:50:12 blit: package installed; exiting for the unit restart
    14:50:12 Started blit.service ...

  The desktop came back with 32,400 printable cells at revision 859, errors
  and warnings both empty.
