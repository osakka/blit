notes: >-
  Issue #16, partly. The input-device scan walked 32 paths and opened each one
  once per device kind -- three open() calls and three EVIOCGBIT probes per
  path, 96 of each for 32 paths, whether or not anything was there -- and it
  runs inline on the event loop between select() and rendering. The live host
  recorded a single scan taking 3.456 seconds with max_loop_gap_ms 3460.284
  behind it: for that time nothing was presented, no input dispatched and no
  client serviced.

  Boot had the same shape through three separate per-kind functions. Both are
  now one scan that opens a path once to find out what it is. The probe fd
  becomes the fd of the first kind that matches, so an ordinary mouse or
  keyboard costs exactly one open and an absent path costs one failed open.

  A device that is two kinds at once -- a keyboard with a built-in trackpad --
  gets a second open rather than a dup, deliberately: each kind drains its own
  fd to exhaustion, and a shared open file description would let whichever read
  first consume the other's events.

  Measured at the syscall level with strace on an input-device-free host:

    pre-change   96 openat on /dev/input/event*
    this build   32 openat on /dev/input/event*

  /v1/diagnostics/runtime gains evdev_scan_opens, a lifetime count of the
  scan's open() calls, so the reduction is measured rather than asserted.
  tools/tests/evdev_scan_gate.rb asserts it stays at one probe per path plus at
  most one extra per registered kind, and that max_evdev_scan_ms fits the 16ms
  frame budget. Its teeth were checked against a build deliberately reopening
  each path: 64 opens for 32 paths, gate exits 1.

  What this release does NOT fix, stated plainly because the issue's first
  done-when asks for it: a single wedged open can still stall the loop for as
  long as the kernel takes. There is no asynchronous open() for a character
  device, so bounding that needs the open off the loop thread -- a worker
  process passing the fd back over SCM_RIGHTS, or a thread in a server that has
  none. A SIGALRM-interrupted open was considered and rejected: it would put
  signal-interrupted I/O into the event loop to fix a condition that cannot be
  reproduced or gated on any machine available here. Issue #16 stays open for
  that, with the three-times reduction and the counter landed.
