notes: >-
  Three defects that each cost a wrong diagnosis, and one found while fixing
  them. Issues #28, #46 and #48.

  #28. Gates bound hard-coded ports and ten ports were shared between gates,
  so running two back to back could have one reach listen() while the previous
  server still held the socket -- a sequencing failure reported as a failure
  of whatever the second gate asserts, and one that disappears when the gate
  is re-run alone. Every gate that spawns a server now takes a unique default
  and waits for it through a shared helper that names the port and its holder
  and says that a conflict is a conflict. Fourteen colliding defaults moved
  into 19200-19214; run-gates keeps its own 19400 base.

  run-gates.sh loses settle_gates, a pkill over the gates' port range plus a
  one second sleep, which hid conflicts behind the sleep and killed servers
  the script had not started. Its removal is the issue's own done-when, so the
  acceptance is two full suite runs back to back: 41 pass, 0 fail, twice.

  The helper's first act was to break two working gates, correctly:
  network_auth_gate.sh starts a server and hands its port to the two HTTP
  gates as clients, which need that port to be serving rather than free. They
  no longer go through the helper, and pixel_frame_gate waits only when it is
  binding its own server rather than using BLIT_TEST_SERVER.

  #46. Three parsers decoded one wire format. json_string handled the whole
  escape set; json_string_array and the value side of json_string_object
  handled only three simple escapes and for anything else kept the escape's
  letter and dropped the backslash, so a conforming encoder's escaped ESC
  arrived as the literal text u001b and a session argument could not carry a
  control character at all. They now share json_unescape, which decodes the
  full set including surrogate pairs and refuses what it cannot decode rather
  than mangling it.

  #48. A cell's colours belong under style, and the cell parser finds keys by
  search, so a cell carrying them at the top level was accepted with 200 and
  no style applied -- the schema calls that spelling invalid and the server
  took it anyway. The same request, before and after:

    old   200 {"revision":2,"accepted":true}   cell style=null
    new   400 invalid_cell_property            names the property it refused

  That silence is how render_state_agreement_gate came to assert that blank
  cells were black on a screen that was already black, for its whole life.
  Checked against the deployed adapter before making it an error:
  console-blit.c writes exactly x, y, text and style.

  Found while fixing #48: send_problem interpolated its detail raw, so a
  detail that quoted the thing it was refusing made the entire problem
  document invalid JSON, and a client reading why its request failed got a
  parse error instead of the reason. It escapes the detail now. The new
  conformance vector found it by failing to parse its own refusal.

  Unchanged: every pixel claim is measured on the SDL path, and
  src/blit_kms.c carries its changes unseen on a screen.
