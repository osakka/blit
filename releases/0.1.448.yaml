notes: >-
  The sixel group: #8, #9, #10 and #11, which are one function and were one
  story -- a stream a VT340 draws produced either nothing or something
  visibly wrong.

  #8. The bound was a literal 512 and overflow discarded the whole image
  instead of clipping. A terminal-width image on this host's 1920-pixel
  output was refused outright. Sixel has no reliable size declaration, so a
  decoder that aborts on the first out-of-range pixel throws away images it
  could have drawn. The bound is the graphics image bound now -- 4096 square,
  which at four bytes a pixel is exactly the 64 MiB graphics byte budget --
  and the canvas grows band by band, so an 80x40 picture does not pay for a
  full-size buffer.

  Two of #8's parts were separate bugs in the same place. The non-repeat band
  check was `y + 5 >= 512`, which refused a band whose first bit alone was in
  range. And `!` carried its own 512 cap, so `!1920~` would still have been
  refused after the buffer grew. The duplication that hid the first is gone
  too: a pixel is written in one place now, which is how the off-by-one came
  to exist in one of two inlined copies and not the other.

  #9. Pu=1 discarded the image. HLS is the VT340's own colour model and an
  approximate conversion is visibly fine, so rejecting was the worst
  available outcome. DEC puts blue at zero degrees, so the angle is rotated
  before the usual conversion: 120 is red and 240 is green, which is what the
  vectors pin. Components clamp; a colour space Blit does not model leaves
  the register alone rather than costing the picture.

  #10. Every colour register was white except index 0, so an image that
  defined some colours and defaulted the rest rendered partly correct and
  partly as white blocks -- harder to diagnose than a failure, because the
  image did appear. The first sixteen are the VT340's documented colours now
  and the rest come from the same 256-colour palette the text path uses,
  which also removed the duplicate cube-and-ramp arithmetic.
  terminal_indexed_colour is the one rule for what an index means. The
  palette belongs to the session, not to one DCS string; RIS and DECSTR drop
  it.

  #11. P2 was never read, so every image behaved as "transparent background"
  while a bare `DCS q` asks for the opposite. The cursor never moved, so text
  printed after an image was written over it and several images stacked at one
  origin. Modes 80 and 8452 did not exist.

  Mode 80's polarity is load-bearing and was checked against xterm's own
  ctlseqs before a line was written, not assumed from the ticket's wording.
  DECSDM *set* is display mode -- image homed, cursor untouched; reset, the
  power-up default, is sixel scrolling. xterm carried the inverse for years,
  which is exactly why DECRQM has to answer, and it does. Blit differs from
  DEC on one point and docs/terminal-engine.md says so: in display mode DEC
  clips to the graphics region, Blit clips to the screen.

  Recorded rather than fixed: an image sits at an absolute pixel offset and
  does not move when the text scrolls later. The scroll a sixel image causes
  is accounted for in that image's own origin, which is what #11 asked for;
  making previously placed images follow the text is a separate change and is
  filed as one.

  The gate reads the framebuffer, because state cannot tell these apart -- a
  rejected image and an image full of white blocks both leave the session
  document looking healthy. Ten scenarios, each in its own session, since
  BLIT_GRAPHICS_MAX_IMAGES is 8 and the scenario that scrolls the screen 249
  times should not share a surface with one about to read pixels.

  Teeth: against a binary built from this tree with the change reverted, all
  ten scenarios fail, 32 individual checks. Measured on both binaries rather
  than inferred -- XTSMGRAPHICS item 2 answered

    pre-change   ESC [ ? 2 ; 0 ; 512 ; 512 S
    post-change  ESC [ ? 2 ; 0 ; 4096 ; 4096 S

  and the DECRQM default-state vector answered 0, unrecognised, rather than 2.

  One gate-harness fix found while reading the teeth output: the PASS lines
  printed unconditionally after a block that could fail, so the gate read
  green above its own failures. A PASS line is earned now.

  Suite: 50 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54 with tools/probes/host_sixel.rb, and the
  colour half of it on the physical 1920x2160 output rather than through the
  state document -- the pixel scenario runs on display-1 while the supervised
  restart has the desktop down, which is the one window where the output is
  free. Measured there:

    published bounds   sixel 4096x4096, 256 registers, 67108864 bytes
    !1920~             width 1920, clipped to placement 480x6
    682 bands + W      height 4096, nothing rejected
    two images         origins y=0 and y=16, cursor {x:0, y:2}
    DECSET 8452        cursor {x:3, y:1}
    DECSET 80          image origin (0,0), cursor {x:9, y:3} untouched

    #1 undefined       [51, 51, 204]    VT340 blue
    #2 undefined       [204, 33, 33]    VT340 red
    #3 undefined       [51, 204, 51]    VT340 green
    HLS 120;50;100     [255, 0, 0]
    HLS 0;50;100       [0, 0, 255]      DEC's hue origin
    HLS 240;50;100     [0, 255, 0]
    P2=0 unset pixel   [0, 0, 255]      the current SGR background
    P2=0 set pixel     [255, 0, 0]

  Every one of those eight colours was white, or the image absent, before this
  release. One probe mechanic worth recording: create_session caps a single
  argument at 256 bytes, so the seven-image scenario arrives as positional
  parameters -- `sh -c SCRIPT sh A B C` -- rather than inside the script.

  The desktop came back with 32,400 printable cells at revision 859; errors
  and warnings both empty.
