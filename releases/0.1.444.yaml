notes: >-
  Issues #16 and #57, and two schema drifts the second one uncovered.

  #16. The live host recorded one evdev scan taking 3.456 seconds with
  max_loop_gap_ms 3460.284 behind it: for 3.46 s nothing was presented, no
  input was dispatched and no client was serviced. The inotify watch added in
  0.1.239 changed when the scan runs, not what it costs -- the open was still
  a synchronous call on the loop thread, and there is no asynchronous open()
  for a character device.

  So the open moved to a thread. It does all of the device I/O -- the open,
  the classifier's EVIOCGBIT probes, the identity ioctls -- and hands back a
  record plus the descriptors, which are valid in the main thread because a
  thread shares the descriptor table. Nothing in the record points at runtime
  state and the thread touches nothing but its two queues, so the boundary is
  a queue rather than a lock discipline spread through the server. The failure
  mode is the point: a device that wedges the opener stops hotplug working
  while the loop keeps presenting and serving, which is what moving the open
  buys over merely bounding it.

  Measured, the same fixture, eight nodes at 150 ms per open:

    opener thread   max_loop_gap_ms    16.3   max_evdev_scan_ms    0.025
    inline open     max_loop_gap_ms  4812.6   max_evdev_scan_ms 4824.677

  Two things about the gate are worth recording, because each one would have
  let it pass against the defect.

  BLIT_INPUT_OPEN_DELAY_US is a fixture hook -- the property cannot otherwise
  be produced, since O_NONBLOCK makes a FIFO open return immediately and a
  character device that blocks in open needs root. The first version put the
  hook inside the opener thread only, so the teeth build did fast opens and
  the gate passed. It lives in one shared evdev_open_node now, which is where
  it has to be for the comparison to mean anything.

  And the first version of the gate created all its nodes before starting the
  server. The boot scan runs before the event loop, so its opens never appear
  in max_loop_gap_ms at all. The gate hotplugs now, which is what the live
  event was.

  The asynchrony then broke the scan's own second half, and two existing gates
  caught it on the first full run: "did this scan see the device?" cannot be
  answered at the end of a scan that has not happened yet, and answering it
  there marked every device present forever. The sweep is its own function
  now, deferred until the opener has answered for every path it was asked
  about.

  #57. The per-device counters were slot-indexed arrays on the runtime, copied
  by hand every time the poll set compacted, and reported as
  evdev_mouse_devices / evdev_keyboard_devices keyed by a node path the
  inventory did not publish. They are fields on BlitInputDevice now, and the
  two arrays are gone along with input_device_slot and the compaction that
  carried them.

  Removing them from the schema turned up two older drifts in the same
  document. input_keys_dropped and input_reports_dropped have been emitted
  since #44 and were never described at all -- counters that exist so a
  dropped keystroke is distinguishable from one that was never pressed, which
  makes being undocumented worse than useless. last_sdl_present_ms and
  max_sdl_present_ms were described but left out of `required`, so a client
  would treat a field the server always sends as optional. Both fixed: 89
  required, 89 described, no difference either way.

  Since that is three drifts in one document, network_auth_gate.sh now
  compares the performance document a running server emits against the
  schema's required and properties lists in both directions. It is the only
  gate with a server and the schema both to hand. Teeth: with the two dropped
  counters taken out of required, it names them.

  New in /v1/diagnostics/runtime: evdev_open_requests,
  evdev_open_requests_dropped, evdev_open_queue_depth, evdev_opener_thread.

  Suite: 48 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54, which is where the 3.46 s stall was
  recorded:

    evdev_opener_thread        true
    evdev_open_requests        32
    evdev_open_requests_dropped 0
    evdev_open_queue_depth      0
    max_evdev_scan_ms          0.001      (worst recorded here: 3455.791)
    max_loop_gap_ms           12.756      (worst recorded here: 3460.284)

  28 devices and 7 polled, unchanged by the restructure, with the per-device
  counters on the items and the two diagnostics arrays gone. The device-kinds,
  keyboard-layout and routing probes all still pass against the host -- which
  matters here, because the registration path was rewritten end to end and
  those three probes are what exercise it. The desktop came back with 32,400
  printable cells at revision 859; errors and warnings both empty.
