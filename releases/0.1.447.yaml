notes: >-
  Two more terminal tickets: the VT500 rectangular area operations (#2) and
  DECRQSS (#5).

  #2. All seven were parsed to nothing, and two were worse than ignored: the
  CSI parser took sequence[strlen - 1] as the command and nothing looked at
  what came before it, so CSI 1;4$r (DECCARA) dispatched to the CSI 1;4r
  branch and silently redefined the scroll region. An application changing
  attributes in a rectangle got its scroll region changed instead.

  So the parser change came first and alone: an intermediate field for the
  0x20..0x2F byte between the parameters and the final byte, a params[16]
  array parsed once with first and second derived from it, and
  intermediate == 0 added to every existing branch whose final byte a VT500
  also uses with one -- r, s, t, x, z, @, P, L, M, S, T. The full suite ran at
  49 pass, 0 fail after that step with no operation added, which is the proof
  the dispatch is unchanged where it should be rather than an argument that it
  is.

  Then the seven: DECFRA $x, DECERA $z, DECSERA ${, DECCRA $v, DECCARA $r,
  DECRARA $t and DECSACE *x. Plus DECSCA "q, the only way to set the character
  protection DECSERA needs, and so BLIT_ATTR_PROTECTED -- terminal state
  rather than a style, deliberately not part of the cell style the API reports
  or accepts, because nothing draws differently because of it.

  A rectangle is page-relative, not margin-relative: #3's accessors confine the
  operations that shift a line and these shift nothing. Origin mode is the one
  exception and the only place margins enter. An inverted or empty rectangle is
  ignored rather than clamped, as DECSTBM and DECSLRM already are -- except for
  the stream extent, where DECSACE 2 with Pl past Pr is the run from one corner
  to the other and has no column ordering to break. That exception was found by
  the DECSACE vector failing: the rectangle check rejected the pair before the
  stream logic could see it.

  DECCRA copies through a buffer, so an overlapping copy is not smeared, and
  names one page: a copy naming any other is ignored rather than silently done
  on the page Blit does have. DECFRA ignores a Pc outside the printable ranges.
  DECCARA and DECRARA accept only the four VT500 attribute parameters and their
  clearing forms.

  Found while implementing #2: the same collision arrives through the private
  prefix. CSI ?2J (DECSED) and CSI ?0K (DECSEL) were executed as plain ED and
  EL, erasing the cells DECSCA had protected -- which could not have been
  noticed before, because protection did not exist. Both are selective now.

  #5. DECRQSS answered three settings and returned the invalid-request form for
  everything else, so a client that saves and restores settings around a mode
  switch -- the one workflow DECRQSS exists for -- could read back nothing but
  the scroll region, the cursor shape and the pen. It answers ten now:
  DECSLRM, DECSCA, DECSCL, DECSLPP, DECSCPP, DECSNLS and DECSACE joined the
  three. Three of those only became answerable in this release, which is why
  #5 was sequenced after #2 and #3 rather than answered twice.

  DECSCL reports the level DA1 reports. Blit does not select a conformance
  level -- there is one and it is fixed -- and reporting something DA1
  contradicts would be worse than refusing. Worth recording rather than
  quietly fixing: DA1 answers 62, the VT220 class, while the engine now
  implements the VT400/VT500 rectangular operations and margins. Raising DA1
  changes what clients then expect of everything else, so it is left alone and
  DECSCL agrees with it rather than with the documentation.

  DECSCPP and DECSLPP read the surface, so they agree with #4's cols and lines
  by construction rather than by coincidence.

  Twenty-four vectors across the two tickets. One of them caught #3 working:
  with margins at 3..9 the hex dump of a DECRQSS reply wrapped at column 9,
  because autowrap now happens at the right margin.

  Teeth: with the intermediate parse removed, DECFRA is parsed to nothing and
  CSI 1;4r and CSI 1;4$r produce identical screens -- #2's own measurement.
  With the seven new DECRQSS settings removed, the DECSLRM vector gets the
  invalid-request form.

  Suite: 49 pass, 5 skip, 0 fail.
