notes: >-
  Issue #55: an output with nothing on it says so.

  A Blit restart left the host with no desktop -- the session was gone,
  nothing relaunched it, and health was green throughout: ready true, backend
  sdl3, errors []. The screen was blank and nothing in the API said so. That
  is an unattended outage that no monitor could have caught.

  Of the ticket's two options, relaunching the desktop Blit was presenting
  needs memory across a restart of what it launched, and cannot be done with
  --resume anyway (#32). Reporting it can be done now, correctly, and is what
  makes the outage detectable.

  Two tiers, because Blit cannot know on its own whether a given output is
  supposed to be showing something -- an idle development server is not
  broken, and every gate in this repository runs one:

    warning, always: output_without_session whenever an output has nothing on
      it. A display server presenting nothing is worth saying out loud.

    error, only when the deployment set BLIT_EXPECT_DESKTOP=1, and only after
      30 seconds -- long enough for a desktop to start, which on the live host
      takes about twelve seconds from POST to the first painted cell.

  The idle clock lives in the event loop rather than in the diagnostics
  builder. A document is read on request and this is a clock: building it on
  demand would have measured the time since the last reader rather than the
  time since the output emptied, so a monitor that polled often would never
  have seen the fault.

  The packaged deployment sets BLIT_EXPECT_DESKTOP=1 -- in blit.env on a fresh
  install and appended on upgrade, the same way the auth token is -- because
  that package exists to present a desktop. A host that deliberately runs Blit
  with no session removes the line.

  Also: errors and warnings are enumerated in the schema now. Both were bare
  arrays of string, so a client had no way to know what either could contain.

  Gate: output_occupancy_gate.rb asserts the distinction in both directions,
  which is the part that could rot silently into "always an error" -- breaking
  every other gate's fixture -- or "never an error", which is the original
  defect. Teeth: with the two reports removed, the warning is absent and the
  declared deployment still reports nothing after 30 s.

  Suite: 49 pass, 5 skip, 0 fail.

  Not done, and still #55's other half if anyone wants it: Blit does not
  relaunch the desktop. It reports that it has an output with nothing on it,
  which is the part Blit can be right about; what to launch, and whether to,
  belongs to whatever owns the deployment.

  Host-accepted on 192.168.10.54, which is where the outage was observed. The
  sequence is the whole of what #55 asked for:

    just after the restart, no desktop   warnings [output_without_session]
                                         errors   []
    after 40 s with nothing on screen    errors   [output_without_session]
    desktop relaunched                   errors   []  warnings []

  BLIT_EXPECT_DESKTOP=1 reached the running service through the postinst's
  upgrade append -- confirmed by a session echoing that one variable, which is
  how it was checked without reading the file the auth token lives in.

  Before this release that middle line read `errors []` with a blank screen.
