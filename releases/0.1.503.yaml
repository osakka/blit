notes: >-
  0.1.503 executes Hibr's installed desktop session as its own script
  entrypoint for the native terminal-provider path. The previous live
  candidate sourced that script through Blit's wrapper, causing Hibr's $0
  relative import of desktop.hibr to resolve under /usr/share/blit/hibr;
  the authenticated child then exited cleanly after reporting missing
  desktop functions. This candidate changes no Hibr source or installation.
