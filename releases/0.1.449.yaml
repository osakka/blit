notes: >-
  #19's instrument: make "the producer sent no image" and "Blit decoded it and
  threw it away" distinguishable from Blit's own evidence. They were the same
  observation before -- zero images, no errors, a healthy session document.

  One `graphics_payload` trace entry per Kitty or sixel payload that reaches
  the terminal parser, written after the decode so it records both what
  arrived and what became of it:

    protocol=sixel session=session-3 bytes=1942 header=DCS0;1;0q
      images=0->1 rejected=0 reason=-
    protocol=kitty session=session-3 bytes=42 header=Ga=T,...,t=f,q=2
      images=0->0 rejected=1 reason=unsupported-key

  `terminal_apply_string` is the single funnel for both protocols -- APC for
  Kitty, DCS for sixel -- so one site covers both, and covers the rejected
  ones, because it sees the payload before any decoder can refuse it. That
  needed the runtime threaded through `terminal_consume_output`: two
  signatures, three call sites, no global. `header` is captured before the
  decode because the Kitty decoder writes into the buffer it parses, and the
  outcome is a delta over the session's image slots rather than a return
  value, because a graphics sequence can replace or delete an image rather
  than add one.

  These entries get their own ring. The critical ring exists so a busy
  external terminal cannot evict input and render evidence, and a graphics
  producer is as busy as a redrawing terminal -- sharing it would have traded
  one blind spot for another. Measured: 160 payloads in one session leave the
  graphics ring at its bound of 128 and the critical ring untouched.

  Four counters in the performance document survive eviction of any ring, so
  a zero there is the strongest available form of "nothing arrived". The
  performance document is 93 required / 93 described, both directions.

  The gate asserts the negative too, which is what makes zero readable as
  zero: DECRQSS, XTGETTCAP and OSC are not graphics payloads and do not
  appear.

  One thing the gate exposed while being written, worth keeping: the flood
  session's 160 payloads produced 154 rejections, all `image-store-full` past
  the eighth image. The trace says so. That is the facility doing its job on
  its first use.

  Ledger wording fixed in the same change, #19's fourth done-when. The 0.1.409
  entry said the capture "contained the Hibr menu bar, wallpaper, desktop
  icons, and status line" -- true of cell art, and easy to read as a picture
  having been presented. It says so explicitly now, with the three zero
  counters beside it.

  Teeth: against a binary built from this tree with the change reverted the
  counters are absent and the gate stops on them.

  Suite: 51 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54, and #19's boundary settled there rather than
  argued. The packaged desktop, owner registered, 32,400 printable cells at
  240x135, revision 860:

    graphics_payloads            0
    graphics_payloads_kitty      0
    graphics_payloads_sixel      0
    graphics_payloads_rejected   0
    graphics_texture_uploads     0
    pixel_frames_accepted        0
    surface-1.graphics_images    0
    terminal_bytes           33454
    trace?kind=graphics_payload  0 events

  Three independent arrival paths, all zero, while 33,454 bytes of terminal
  output did arrive. The captured 1920x2160 framebuffer holds 9 distinct
  colours, 4,030,905 of its pixels being #0d1b2a: complete, correct cell art
  and no bitmap at any point.

  The instrument was proven live in the same process rather than assumed -- a
  probe session emitting one sixel on the same host moved graphics_payloads
  from 0 to 1 with

    protocol=sixel session=session-2 bytes=21 header=DCS0;0;0q
      images=0->1 rejected=0 reason=-

  so the desktop's zero is a measurement and not a dead counter. The boundary
  is Hibr's side; Blit's decoders are not implicated, and the sixel and Kitty
  gaps fixed in 0.1.446-0.1.448 were real but are not the cause of this
  symptom.
