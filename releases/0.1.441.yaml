notes: >-
  ADR 0064 stage 4, issue #35. The last input stage, and the last of the
  global-state defects the per-device work kept uncovering.

  A keyboard's layout and its modifier state were one global set each. The
  layout being global made every keyboard US, which is what #35 asked about.
  The modifier state being global meant Shift held on a keyboard routed to one
  session modified another keyboard's keys on their way to a different
  session -- a defect that predated routing, since there was one evdev_shift
  and one evdev_key_held for every keyboard, and that routing only made
  reachable.

  configuration.keymap is a sparse override on the built-in table, by evdev
  code, with four levels: plain, shift, altgr, shift+altgr. Sparse because a
  request is bounded at BLIT_REQUEST_SIZE and a complete table does not fit --
  and a parser that accepted the prefix of one that did not would hand a
  controller a keyboard it believed it had configured. A layout difference is
  a few dozen keys; the cap is 128 codes and more is a 400, so a client cannot
  fill the bound and have a prefix accepted.

  An empty level means "not defined here", so AltGr on a key with no third
  level falls back to the unmodified one. That is what AltGr does on a US
  keyboard, where it selects nothing, and what the built-in table does because
  it has no third level at all -- one rule rather than one per table. The
  override is also the only way to reach the third level, which is what
  finally makes evdev_altgr mean something: it has been tracked, and done
  nothing, since AltGr stopped being treated as Alt.

  The modifier flags, the held set and both locks moved into BlitInputDevice,
  resolved through runtime->input_source. One exception, stated rather than
  discovered later: the modifiers a mouse report carries are OR'd across every
  present keyboard. Per-device state is right for a key, because a key belongs
  to the keyboard that produced it, and wrong for a click, because there is one
  cursor -- so a shift-click still means "shift held anywhere".

  Two things deliberately not built, named so neither looks like an oversight.
  There is no named-keymap resource: a keymaps collection is a second resource
  with its own identity, lifecycle and persistence question, and the per-device
  object already fits the bound, so holding a layout is the control panel's
  job. And reading the kernel console keymap through KDGKBENT on /dev/tty0 --
  which would give every layout loadkeys has configured, with no new
  dependency -- is deferred because there is no tty where the gates run, so it
  could only be exercised on the host. A host-only path is exactly what let a
  gate spend seven releases testing a stale binary (#59). Dead keys and
  compose sequences are out of scope: a table of characters cannot express
  them.

  The key-encoding gate gains two fabricated keyboards, which is what makes
  any of this testable. A QWERTZ override on one types its layout -- Z and Y
  exchanged, ß where the hyphen is, @ and Ω on AltGr and shift+AltGr over Q --
  while the same codes on the other keyboard type US. That second half is the
  assertion that a layout belongs to a device and not to the server. Plus the
  AltGr fallback, Shift held on one keyboard not modifying the other's key,
  and CapsLock likewise.

  Teeth, and the two halves are caught separately: with the translator reading
  one global state the layout assertions fail and AltGr types the plain
  character; with the held set pooled across devices but the layout still per
  device, exactly the cross-keyboard Shift and CapsLock assertions fail and
  nothing else does.

  Suite: 47 pass, 5 skip, 0 fail.

  One thing shipped untested, recorded rather than implied: audio
  state.accessible is always true on this host and in the fixture, because
  Blit runs as root and the fixture's nodes are ordinary files. The field
  exists so that a device Blit cannot open reads as a permission problem
  rather than as a missing device; the false case has never been exercised.

  Host-accepted on 192.168.10.54, tools/probes/host_keyboard_layout.rb against
  two of its real keyboards:

    A code 21        -> "z"      the Y key, under a QWERTZ override
    A code 44        -> "y"
    A code 12        -> "ß"      where US has the hyphen
    A code 16+altgr  -> "@"      the third level
    A code 16+altgr+shift -> "Ω" the fourth, and two bytes of UTF-8
    B code 21        -> "y"      the other keyboard is still US
    B code 44        -> "z"
    B code 12        -> "-"
    shift on A, "a" on B -> "a"  the modifier did not cross

  The probe restores both keyboards; the host carries no configuration
  afterwards. The desktop came back with 32,400 printable cells at revision
  866 and an empty errors array.

  Two notes from running it, both measured rather than assumed:

  The probe routes both keyboards to its own session, and it has to. Without
  that it only works when no desktop is running: a Hibr desktop owns the
  focused surface and ADR 0057 refuses PTY writes to an owner-authored
  surface, so every key types nothing. Measured that way once -- 112 presses,
  18 delivered, 94 undelivered -- which is
  evdev_keyboard_keys_undelivered doing exactly the job it exists for rather
  than a key being lost. Per-device routing is what lets a live input probe be
  independent of what is on screen.

  One HTTP request to /v1/input/inject timed out at 25 s on the first live
  run and did not reproduce in three later runs. Not filed as a stall, because
  the server's own measurement rules it out: max_loop_gap_ms stayed at 23.4 ms
  and max_evdev_scan_ms at 0.042, so the event loop never blocked for
  anything like that long. Recorded because an unexplained pause on the input
  path is worth writing down even when the metric says it was not the server.
