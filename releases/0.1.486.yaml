notes: >-
  0.1.486 keeps the 0.1.485 root-owned login manager and adds the explicit
  Blit-owned login entrypoint required by Hibr's strict root path. The shim
  loads Hibr's sys module, sources the installed Hibr login.hibr, and calls
  its existing lg_main. This removes the reproduced SYS_MOD undeclared
  startup failure without copying or modifying Hibr source. Hibr #79 remains
  the external VM/real-host PAM and logind acceptance ticket.
