notes: >-
  This release corrects one Hibr provider boundary without modifying Hibr.
  Pane ownership, stacking, clipping, watched application descriptors,
  UTF-8 width, shadows, input coordinates, button identity, wheel events,
  function keys and resolved keymap text now follow released Hibr 0.99.191.
  The adapter also replaces a synchronous geometry request after every input
  wait with SIGWINCH-driven resize detection, and OpenGLES full-content
  rebuild mode retains a complete scene snapshot for pointer-only frames.

  The exact package is now deployed on the supplied host. API evidence proves
  one primary owner, 32,400 populated cells, a complete screenshot, accepted
  pointer/button/key traces, and zero missed deadlines during the probe. The
  user also confirmed physical mouse and keyboard operation. Physical movement
  cadence under sustained motion, application wakeup under a real workload,
  input hotplug, and additional physical outputs remain separate acceptance
  items; no issue is closed from API injection alone.
