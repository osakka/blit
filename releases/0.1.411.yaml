notes: >-
  Closes the ADR 0055 gap where a configured BLIT_AUTH_TOKEN made the Hibr
  desktop unstartable. The local suite was run with tools/run-gates.sh,
  introduced in 3504df0; its result for this build is pass=29 skip=3 with the
  package gate deferred until this manifest and package existed. The
  authenticated Hibr desktop is the gate that proves the fix and requires
  Hibr. The package was deployed to 192.168.10.54, which reports 0.1.411, and
  the unauthenticated Hibr path is unchanged by this release: a fresh
  packaged launch registered its owner and reached 32,400 printable cells at
  240x135 with the menu bar, wallpaper, icons and status line present.
  The authenticated case is now proven on the same host without mutating
  the production service: a second server was started on port 19600 with
  BLIT_AUTH_TOKEN set and the dummy video backend, leaving blit.service and
  its desktop untouched. Against that instance the packaged
  blit-session.hibr entrypoint reached state=running with
  owner_registered=true, owner_matches=1, unresolved=false and 6,144
  printable cells at 128x48, and the captured framebuffer showed the menu
  bar, wallpaper, desktop icons and status line. The runtime log recorded
  hibr_resize_discovery matches=1 on the first attempt with no
  hibr_attach_unresolved entry and no errors.

  The same launch against 0.1.410 reported matches=0 for all 32 attempts and
  then hibr_attach_unresolved with zero printable cells, so this is the
  before/after pair for ADR 0055. The deployed blit.service still runs
  unauthenticated; turning that on is an operator action and is not claimed
  here.

  Operational note recorded while deploying: a supervised restart leaves the
  Hibr hold running, so the next packaged launch refuses with "blit is
  already running -- add --resume to reattach". That message reaches only the
  surface, never the API, so the session reports state=running with 127
  printable cells. Reattaching with --resume produced a broken surface that
  wrote "-1" on all 134 rows. Retiring the detached hold and launching fresh
  recovered it. This is the restore step that issue #27 asks the deploy tool
  to own.
