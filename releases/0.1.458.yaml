notes: >-
  Issue #72, the second half. 0.1.457 made the incremental clear cover the rows
  its repaint covers, and measured on the host's own GPU that took the residue
  from 8407 cells to **2 of 1800**. Two is not zero, and the remaining two were
  in rows the damage rectangle did not cover -- so the column mismatch was real
  but it was not the whole story.

  The rest is structural, and it is the invariant rather than another special
  case: **damage is cleared only for a surface this pass actually painted.** It
  used to be cleared for every surface that *targets* an output in the mask,
  which is a different question. The per-output loop has several paths that
  skip drawing -- a held synchronized frame, an output with nothing on it, a
  session whose display_id names a display with no output, and (new in 0.1.456)
  a display powered down -- and each one discarded damage that had never
  reached a pixel. Those cells were then never repainted, whatever the damage
  rectangle went on to be, which is why widening the clear could not finish the
  job on its own.

  The renderer now records which surfaces it painted and the tail consults that
  record. Every skip path is covered by construction rather than one at a time,
  including skips added later.

  Checked for the obvious cost: a surface whose damage is now *kept* could in
  principle keep the render loop awake. frame_rate_gate reports 59.999 Hz with
  0 missed deadlines and window_max_render_ms 16.478, unchanged, and
  sync_output_gate -- which has always held damage for a synchronized surface
  -- still passes.

  Still no teeth locally: the container has no GPU and the local reproduction
  does not fail against the pre-change binary. The live measurement is what
  carries both halves of this fix.
