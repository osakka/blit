notes: >-
  This release corrects the Blit-owned Hibr provider adapter's drag action.
  Hibr requires the held button in `mouse drag left row column`; omitting it
  shifted the row/column arguments and made horizontal movement appear
  vertical-only. Plain and modifier-prefixed drags now include the
  deterministic lowest-numbered held button. Hibr source and desktop
  configuration remain unchanged. Live deployment and physical drag
  acceptance remain pending.
