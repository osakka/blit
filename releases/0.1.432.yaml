notes: >-
  ADR 0064 stage 1, issue #51: one input device table, derived identities, and
  an inventory that is a view rather than a scan. Closes #17.

  The device surface had two models. GET /v1/input/devices opened all 32
  /dev/input/event* nodes on every request and classified them with its own
  heuristics (KEY_A || KEY_ENTER for a keyboard); evdev_register_path held the
  fds the poll loop actually reads, keyed by path, using stricter predicates
  (KEY_A && KEY_ENTER). So the inventory listed devices the server never read
  -- on 192.168.10.54, event-6, the consumer-control node of the remote -- and
  could not say whether anything in it was live. The GET also ran the scan
  issue #16 measured at 3.46 s with the event loop stalled behind it, so a
  control panel that polled the inventory periodically froze the server it was
  controlling.

  The runtime now owns one table, populated by the scan that already runs, and
  the route serialises it. One classifier, and it is the poll loop's: a device
  listed as a keyboard is a device read as a keyboard. A node the server
  probes but reads under no kind is listed as "other" with an empty route
  list, rather than described as input that never arrives.

  An id is derived from what the device reports about itself, not from its node
  number -- which is assigned in discovery order and renumbers on replug, so
  configuration a controller saved against event-5 could land on a different
  device after a restart. It is
  input-<bustype>-<vendor>-<product>[-<slug>][-<ordinal>], slug from the
  device serial when there is one and from the bus position otherwise. The bus
  position is the part that matters in practice: the live host's remote
  presents three event nodes that share one input_id and differ only in the
  interface suffix of their phys string. Built without it, the identity gate's
  three-node case collapses to one id -- which is the teeth for that
  assertion.

  Per-device counters move from a diagnostics array keyed by a path the
  inventory did not publish into the device's own state (#17). The collection
  revision counts discoveries and losses instead of being a hardcoded 1, and a
  change is announced on the stream as device_changed. New: GET
  /v1/input/devices/{id}, resources.input_devices, and BLIT_INPUT_ROOT, which
  the gate needs because this environment has no /dev/input at all.

  Two new gates, each with its teeth shown: input_identity_gate.c for the
  derivation as a pure function, and input_device_api_gate.rb for the
  envelope, the item route, the real revision, the count agreeing with the
  runtime's own, and zero evdev_scan_opens across a collection GET. A build
  that rescans before serving fails that last one with 32 opens; a build that
  emits the old item shape fails the envelope, the id and the revision.

  Also in: the device serialiser drops a device only when it does not fit and
  reports the count it dropped. Every other *_json helper in the server breaks
  out of its loop on overflow and emits a truncated-but-closed object, which a
  client cannot distinguish from a host with fewer devices.

  Not in: any configuration write. configuration reports {enabled:true} and
  nothing accepts a PATCH yet -- that is stage 2 (#52), with per-device
  routing and the keyboard layout (#35). Stage 3 is audio (#53), stage 4
  displays (#54). Moving the scan off the event-loop thread remains #16; this
  removes the stall from the request path, not from the scan.

  Unchanged: physical input devices are still untested -- the encoders are
  gated through /v1/input/inject, which shares their code path but not their
  hardware -- and src/blit_kms.c carries its changes unseen on a screen.
