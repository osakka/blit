notes: >-
  Input robustness, after the user said the feature work was not making the
  server usable and asked for this first.

  Two defects, both found by asking what happens after the fiftieth hotplug
  cycle rather than the first, and both of which leave a device permanently
  unusable. They are #74.

  **Retiring an absent device only ever happened on a filesystem event.** A
  rescan is the only caller of retire_absent_input_devices and inotify is the
  only thing that arms one. The flag coalesces, so a hub dropping thirteen
  nodes at once produces one scan; if it runs mid-burst it marks the nodes
  that still exist as seen, and nothing arms another. Measured: a device whose
  node was deleted stayed present for 56 seconds and counting. A watch event
  now also sets a one-second resettle deadline, and the select wait is clamped
  to it -- a hotplug is exactly when the loop has no other reason to wake,
  which is the same shape as ADR 0067's settings flush.

  **A probe that learned nothing erased what the device was.** Opening a node
  being torn down succeeds while every EVIOC* ioctl fails, so kinds came back
  zero and that zero was written over a known device. A pointer was measured
  demoted to `other` with empty capabilities; a keyboard in that state is
  never claimed by the poll loop again, even once the hardware is back. An
  existing device now keeps what it was until a probe contradicts it.

  **input_device_missing fired only at zero.** On the live host a microphone's
  remote-control interface counted as both a keyboard and a pointer, so while
  a USB hub had taken the real ones away /v1/diagnostics reported
  `warnings: []` and the operator had no usable input. It now fires below the
  peak this process has seen, and resources carries keyboards_peak,
  pointers_peak and gamepads_peak so the warning can be acted on. The peak is
  per-process: a restart is the deliberate way to say the smaller number is
  the new normal.

  tools/tests/input_hotplug_cycle_gate.rb is the first gate in this stretch
  with teeth. It cycles two fabricated devices thirty times and asserts both
  halves of the table's real contract -- a configured device stays listed with
  present false and returns with its configuration, an unconfigured one is
  dropped and returns under the same identity-derived id (ADR 0064) -- plus a
  bounded table, no descriptor growth and a fast inventory. Three runs pass on
  the fixed build; three runs fail on the pre-change build, at cycles 15, 0
  and 4, always as `unplugging left keyboard=false pointer_present=true`.

  What it does not cover: a fabricated node is a regular file and is never
  opened as a keyboard, so state.open stays false and the poll set is
  untested. The host was measured directly instead -- 19 descriptors, 2 on
  event nodes, zero deleted.

  Also in this release, the last of #72: terminal_clear_wide_overlap blanks a
  wide glyph's partner cell and only the caller's own target was marked
  damaged, so that neighbour was emptied with nothing telling the renderer to
  repaint it.

  Suite: 62 pass, 5 skip, 0 fail.
