notes: >-
  Two things, found together, because building the routing gate needed a second
  letter and the second letter did not work. Issues #58 and #56.

  #58. The keyboard typed garbage. send_evdev_key computed a letter as
  'a' + code - KEY_A, and evdev numbers keys by physical position rather than
  alphabetically: KEY_A is 30, KEY_S is 31, KEY_D is 32, and KEY_Z is 44 with
  semicolon, apostrophe, grave, left shift and backslash sitting inside the
  range. Measured by injecting each main-block key into a cat session and
  reading the surface back:

    key          typed   verdict
    Q..P         ""      nothing, 10 keys
    A            "a"     ok
    S            "b"     wrong
    D            "c"     wrong
    ;            "j"     wrong
    \            "n"     wrong
    Z            "o"     wrong
    X,C,V,B,N,M  ""      nothing, 6 keys

  Of thirty main-block keys exactly one typed the right character; sixteen
  typed the wrong one and thirteen typed nothing. Ctrl plus a letter was wrong
  the same way. Fixed with a real evdev-code-indexed table for the US main
  block, and Ctrl+letter taken from the character the key types rather than
  from its code. All 31 measured correct after.

  No gate caught it because key_encoding_gate.rb tested exactly one letter --
  'a', the one letter for which the broken arithmetic is correct. Its other 24
  cases are arrows, function keys, the keypad and modifier combinations, which
  have their own tables and were fine. The fixture's choice of sample was the
  whole gap. The gate now covers the main block unshifted and shifted: 119
  cases, 58 of which fail against the old arithmetic.

  This is not #35. #35 asks for a keymap that is not hard-coded US and stays
  open; a hard-coded layout that is wrong about its own layout is a different
  defect.

  #56, ADR 0064 stage 3. A device's configuration.route names a
  target_session_id and an enabled flag and wins over the aggregate route for
  its kind, so one keyboard can feed one session while another feeds a
  different one -- the headline thing a control panel wants, and the thing the
  three aggregate pseudo-devices could not express for a host with four
  keyboards and three pointers. Resolution is the device's own route, then the
  aggregate route, then the caller's fallback. A disabled route falls through
  rather than blocking, so disabling it restores the previous behaviour
  instead of dropping the device's input; a route whose target session ends is
  disabled and keeps its target so a panel can still show what it pointed at.

  The decision is carried by runtime->input_source, set at the top of each
  service_evdev_* drain and cleared at the bottom, rather than threaded
  through keyboard_target and seven input_route_target call sites that SDL
  also reaches and would all pass nothing. The input path is single-threaded
  and synchronous, so a field is honest here; the discipline that makes it
  safe is that it is also set and cleared around the inject body, including on
  every refusal path inside it.

  json_object_scalars, because the route gate found the next layer of the bug
  0.1.434 fixed: json_bool finds a key at any depth, so reading "enabled" from
  {"route":{...,"enabled":false}} found the route's and disabled the device.
  The configuration's own scalars are now read from a copy with nested objects
  dropped.

  input_device_route_gate.rb is the first input test that runs without
  hardware at all: two shells, two devices, each routed to one shell, a letter
  injected through each with its device_id and read back from that shell's own
  surface. Teeth: with the per-device resolution removed, both letters land in
  the same session.

  Folded in: device_changed broadcasts on the hardware mask as well as input,
  because ADR 0064 stages 5 and 6 fire the same event for audio and display
  devices which are not input; and /v1/server advertises
  input-device-configuration, which is how a control panel feature-detects the
  PATCH.

  Recorded as known, not fixed: modifier state is global across keyboards, so
  Shift held on a keyboard routed to one session modifies another keyboard's
  keys on their way to a different session. It predates routing -- one
  evdev_shift and one evdev_key_held for every keyboard -- and routing only
  made it observable. It belongs with #35.

  Host-accepted on 192.168.10.54, both halves measured there and not only
  locally.

  The key table, through a cat session on the host: 94 of 94 main-block cases
  correct, unshifted and shifted. Before this release the same host would have
  typed one of them right.

  Per-device routing, through tools/probes/host_device_routing.rb against two
  of the host's real keyboards:

    keyboard A  input-0003-25a7-0124-usb-0000-e6-00.4-1.1.4-input2
                ZYSD.Ltd HCY MIC RC          -> session 1
    keyboard B  input-0003-062a-4101-usb-0000-e6-00.4-1.1.3.1-input0
                MOSART Semi. 2.4G Keyboard Mouse -> session 2

    session 1   "GOT[a]"
    session 2   "GOT[b]"

  Each keyboard's key landed in its own session and in neither of the other's.
  The probe clears the routes and removes its sessions, so the host is left as
  it was found. The desktop came back with 32,400 printable cells at revision
  859 and an empty errors array.

  Unchanged: the per-device counters still read zero on the host, because
  nobody is at the keyboard and an injection is attributed to the aggregate
  route. src/blit_kms.c carries its changes unseen on a screen.
