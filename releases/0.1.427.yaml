notes: >-
  One defect, found by the capture witness from 0.1.426 doing its job on the
  live host. Issue #49.

  Bold overstrikes a glyph one pixel to the right at the full cell width, so a
  glyph reaching its own right edge wrote a pixel into the cell beside it. A
  blank neighbour showed a sliver of it; because that sliver survives until
  the neighbour is repainted and returns when the bold cell is redrawn, it is
  indistinguishable from a rendering trail -- and is a candidate explanation
  for the "screensaver leaves part of the shape drawn" report that #29 was
  filed to make testable.

  The overstrike now gives up its rightmost column: the same fraction is
  dropped from the source and the destination, so the glyph keeps its scale
  and simply is not doubled in its last column, which at an eight-pixel cell
  is not visible. Both renderers.

  How it was found, because the method is the point. With the capture fixed in
  0.1.426, a renderer-versus-state comparison was run against the real Hibr
  desktop on 192.168.10.54 -- the first one the project could trust rather
  than dismiss as skew. The sample was coherent (presented=true, capture
  revision 869, state revision 869, zero discarded) and of 197 blank cells
  with a background of their own, exactly one disagreed:

    cell(2,0) text="✎" bold=true   cell(3,0) blank, 4 pixels not its background
    row  8   left .#######          here #.......
    row  9   left ..######          here #.......
    row 10   left ...#####          here #.......
    row 12   left ......##          here #.......

  The pencil glyph reaches its own rightmost column on those rows and the
  overstrike shifted a copy one pixel right. Three earlier attempts at this
  comparison on this host produced three findings that were all skew; this one
  named a cause and the cause was real.

  It is not the italic slant from 0.1.425: those cells report italic=false, so
  no shear was applied.

  cell_paint_gate.rb writes a bold box-drawing glyph beside a blank cell and
  asserts the blank cell is entirely its background; the pre-change binary
  puts one white pixel there.

  Unchanged: every pixel claim is measured on the SDL path, and
  src/blit_kms.c carries the same change unseen on a screen.
