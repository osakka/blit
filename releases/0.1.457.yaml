notes: >-
  Issue #72: the desktop screensaver was leaving a solid trail of itself.

  Reported from the screen, and the cell snapshot and the panel disagreed by
  8407 cells -- the owner was authoring correctly (ADR 0063) and the renderer
  was keeping old pixels. A forced full redraw dropped the painted cells from
  8706 to 333, matching the data, and the trail then rebuilt at about 96 cells
  a second. So the full-redraw path was right and the incremental one was not.

  The defect, found in the code rather than guessed: the incremental path
  clears the damage *rectangle* but repaints whole *rows* -- the repaint walks
  `column = 0` to `surface->width` for each damaged row. The two disagreed
  about columns, and the disagreement is invisible until a cell goes from ink
  to blank outside the damage rectangle's columns, because a blank cell with
  the default background draws nothing at all and its old pixels simply stay.
  That is exactly a sprite moving diagonally: the rows overlap, the columns do
  not.

  The clear now covers the full width of the damaged rows, which is the safe
  direction of the two -- it can only erase pixels the repaint is about to
  write, and it makes the path correct whatever the damage rectangle's columns
  happen to be. The wallpaper restore clip was widened with it, because a clip
  narrower than the clear would leave black holes exactly where the fix
  widened it.

  Honest about what this does not settle: on the live host the damage
  rectangle was also measured *narrower in rows* than the sprite's previous
  position, which this change does not address. Whether that is a second
  defect or a consequence of the same one is not yet known, and the live
  accumulation rate after this release is the measurement that decides it.

  `tools/tests/deferred_damage_gate.rb` is new and asserts the invariant --
  what the cells say and what the panel shows must agree, under a deferred
  batch interrupted by a frame scheduled elsewhere. It has **no teeth**: it
  passes against the pre-change binary too, because the container has no GPU
  and the local reproduction never produced a damage rectangle narrower than
  the rows it repainted. That is stated rather than papered over; the gate
  guards the invariant going forward and the live measurement is what
  currently carries the fix.

  `motion_trail_gate.rb` asserts the same property and passes either way: it
  writes immediate, and its erase-plus-draw fits one chunk, so it never has an
  open frame for a frame to interrupt and its damage is always the full width.

  Renderer group: 36 pass, 0 fail.
