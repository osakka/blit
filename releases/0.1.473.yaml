notes: >-
  This release fixes logical pane partitioning for odd terminal grids. The
  previous floor-based split left one unowned row or column; boundary-based
  partitioning assigns the remainder to the final pane, so a 1x2 80x45 grid
  is 80x22 above and 80x23 below. The lower pane remains the explicit primary
  target. The live primary paints correctly in the lower pane; the live Hibr
  0.99.191 join probe registers on the upper pane but produces zero cell
  writes, so the auxiliary join remains an explicit integration blocker.
  Hibr source is unchanged.
