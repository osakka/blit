notes: >-
  0.1.487 fixes the Blit Kitty parser's handling of Hibr's conforming
  multi-chunk wallpaper uploads. Hibr names the opening chunk and omits the
  image id from q=2 continuations; Blit now keeps that id per terminal stream
  until the complete image is decoded. Hibr source was not modified. The
  live host must receive this package before its graphics trace can be
  accepted.
