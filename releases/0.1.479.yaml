notes: >-
  This release maps Blit's authoritative logical pane coordinates into Hibr's
  hold union. The Blit-owned launcher moves Hibr's existing primary client to
  the primary pane origin before attaching each join at its own origin, so a
  stacked 1x2 topology is a real vertical desktop union rather than Hibr's
  default right-edge placement. Hibr source is unchanged. The exact QEMU
  oracle and physical host still need to validate the final stacked screenshot
  and reconnect behavior.
