notes: >-
  Two pieces of the same deployment-and-trust boundary, plus the ADR #14 asked
  for.

  #63, found while host-accepting 0.1.449 and the reason that acceptance had
  to be redone. Two mechanisms restarted the service after a package install
  and neither knew about the other: the privileged helper runs `systemctl
  daemon-reload` and `systemctl restart --no-block blit.service` -- correct,
  and its own comment says why, since the package may have changed the unit
  and credentials come from the unit -- while `finish_update_upload` also set
  `blit_restart_requested` and `main` re-exec'd.

  systemd sends its one SIGTERM to the main pid. A process that execs instead
  of exiting consumes that signal and keeps running, so the unit waits out
  TimeoutStopSec -- 90 seconds -- and is then SIGKILLed along with every
  process in its cgroup. From the host journal:

    04:24:42 Stopping blit.service ...
    04:24:43 blit[14145]: blit gateway listening ...   <- same pid, re-exec'd
    04:26:12 State 'stop-sigterm' timed out. Killing.
    04:26:12 Killing process 14446 (hibr [attached:) with signal SIGKILL
    04:26:12 Killing process 14449 (desktop [blit-0) with signal SIGKILL
    04:26:13 Main process exited, code=killed, status=9/KILL
    04:26:13 Failed with result 'timeout'

  Two `listening` lines from one pid is the tell. Every supervised update left
  a 90-second window where the service answered normally and was already
  doomed; update-live.sh reported success against that process, and anything
  started in the window died with it. The helper's restart counter was at 25,
  so this had been happening for a long time with nothing able to report it:
  the in-process log ring dies with the process.

  How it was found is worth keeping. The host has no SSH, so the journal came
  back through the API -- a terminal session running journalctl with a 200x60
  surface, read off GET /v1/surfaces/{id}/cells. Before that, all Blit could
  say was that uptime was 5.7 minutes and there were no sessions.

  The install path now exits, non-zero, and does not exec. Non-zero so that
  Restart=on-failure stays a safety net if the helper dies before reaching
  systemctl -- the package must never be installed with the service down.
  POST /v1/control/restart keeps its re-exec, because nothing else is going to
  restart it, and restart_gate.sh still reports same_binary=1.

  A 20-minute watch of the clean process before the fix was written: 118
  readable samples, zero uptime resets, one session throughout. So the kill
  was the race and not a crash, which is the distinction that decided what to
  fix.

  tools/tests/update_restart_gate.sh asserts the two intents stay
  distinguishable, which nothing did before. It drives the real install path
  with a stub helper, which needed the helper socket to become overridable --
  the same testing-hook shape as BLIT_INPUT_ROOT and BLIT_ASOUND_ROOT. Teeth:
  the pre-change binary keeps serving after the install and prints the same
  double-listening signature as the host journal.

  #14 and ADR 0066. The ticket's premise -- `t` never parsed -- had already
  been fixed by ADR 0060's work: anything but t=d is refused with a typed
  unsupported-key and an EINVAL reply. What was missing is the decision, which
  #14 asked for explicitly. ADR 0066 records it as a property of the channel
  rather than of the key: no path or shared-memory object name arriving over a
  terminal channel is opened, read, created, deleted or unlinked.

  A terminal escape sequence is not an authenticated request -- anything that
  can write to a PTY can emit an APC sequence, and under ADR 0065 this process
  may be root. t=f would turn "whatever can print here" into "whatever can
  make a root process read an arbitrary path", and t=t and t=s add a delete.
  The real motivation, large payloads without pushing megabytes through a PTY,
  is already served by /v1/graphics over authenticated HTTP.

  The vector: t=f, t=t and t=s carrying the base64 of a real readable path are
  refused and create no image, with the EINVAL reply read back off the
  session's own tty. Measured on the host under 0.1.449:

    t=f with a readable path  images=0 last_error="unsupported-key"
    t=t with a readable path  images=0 last_error="unsupported-key"
    t=s with a readable path  images=0 last_error="unsupported-key"

  Teeth: with the `t` check removed the diagnosis becomes incomplete-data --
  Blit reporting the wrong thing about a path it was handed, which is the
  shape #14 named.

  Suite: 52 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54, and #63 measured on both sides of its own
  fix. The 0.1.450 package was deployed twice: the first deployment is
  performed by the running 0.1.449, which still carries the race, and the
  second by the fixed 0.1.450.

  Before, 04:55:17 to 04:56:48 -- 91 seconds:

    04:55:17 Stopping blit.service ...
    04:55:17 blit[14469]: blit gateway listening ...   <- same pid, re-exec'd
    04:56:48 (the 90s TimeoutStopSec expires; SIGKILL; unit restarted)

  After, 04:57:30 to 04:57:30 -- under one second:

    04:57:30 Stopping blit.service ...
    04:57:30 blit[14788]: blit: package installed; exiting for the unit restart
    04:57:30 blit.service: Main process exited, code=exited, status=1/FAILURE
    04:57:30 blit.service: Stopped blit.service
    04:57:30 blit.service: Started blit.service
    04:57:30 blit[15012]: blit gateway listening ...

  No stop-sigterm timeout, no SIGKILL, no child killed, and one `listening`
  line from one pid instead of two.

  The non-zero exit was the deliberate choice and the cost of it was measured
  rather than assumed, because the ticket itself complained about a noisy unit
  result. It is not sticky: after the restart the host reports

    systemctl is-active blit   -> active
    systemctl is-failed blit   -> active
    Result=success  NRestarts=0  ActiveState=active  SubState=running

  So the whole trace is one journal line, immediately preceded by Blit's own
  `package installed; exiting for the unit restart`, which makes it
  self-explanatory. The old behaviour left `Failed with result 'timeout'` and
  killed the desktop.

  The desktop launched right after the clean deployment: 32,400 printable
  cells at revision 859, and 30 samples over five minutes with zero uptime
  resets, one session throughout, errors and warnings empty every time. Under
  the old behaviour a desktop launched in that window was SIGKILLed.

  Separately, a 20-minute watch of the pre-fix clean process -- 118 readable
  samples, zero uptime resets -- is what established that the kill was the
  race and not a crash, and so what to fix.

  #14's media were measured on 0.1.449 before the bump and carried: t=f, t=t
  and t=s with a readable path all answer images=0 last_error=unsupported-key,
  each with a graphics_payload trace entry naming the reason.
