notes: >-
  Accepts parameterised sixel introducers (DCS P1;P2;P3 q) and Kitty f=100
  PNG transmissions. ADR 0056 records linking the system zlib for DEFLATE
  rather than carrying an in-tree inflate, so Depends becomes
  libc6, libdrm2, zlib1g.

  The same 2x2 image transmitted as raw RGBA and as PNG produces a
  byte-identical framebuffer (sha256 b01d4618dca32830), and an 8x8
  four-quadrant image decodes to exactly the colours it was encoded with.
  Four conformance vectors cover the introducer forms, DECRQSS not being
  captured as sixel, the PNG transmission matching its raw equivalent, and
  malformed or truncated containers creating no image.
  tools/run-gates.sh all reports pass=29 skip=4 fail=0 for this source.
