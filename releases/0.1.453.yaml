notes: >-
  Epic #64 stage 2 (#66): a keyboard's repeat, locks and modifier roles belong
  to the API. Blit read keyboards and translated keys but owned none of the
  settings a person actually changes about one.

  Two facts were measured on the host before any of it was written, because
  they decided the shape rather than merely confirming it.

  EVIOCGREP *and* EVIOCSREP work on the O_RDONLY descriptor the opener already
  uses:

    /dev/input/event4 O_RDONLY GET=(250, 33) SET=ok
    /dev/input/event8 O_RDONLY GET=(250, 33) SET=ok

  So owning the repeat rate needs no change to how a device is opened, and the
  "Blit only reads from an input descriptor" posture holds for that half. The
  LED is the other half and does need a writable descriptor, which was also
  measured, with the lamp restored afterwards:

    /dev/input/event4 numlock before=0 set->1 (write ok) now=1
                              restored=write ok now=0

  So the LED is written through a momentary O_WRONLY open -- bounded to the
  write, skipped for a fabricated node, and worth it because a Num Lock lamp
  that disagrees with what the keypad types is worse than no lamp.

  The rate is in hertz because that is what a person adjusts and the kernel
  takes a whole-millisecond period, so the conversion is lossy and what gets
  reported is the read-back. 30 Hz is 33 ms and reads back as 30; 7 Hz is
  142.857, which the kernel keeps as 142. repeat_period_ms is reported beside
  the rate so a controller sees the quantisation rather than deducing it.
  Repeat applies only where capabilities includes the new `repeat` bit: a
  device the kernel does not autorepeat for has no rate to set, so asking is a
  422 and not a stored number that changes nothing.

  `modifiers` exists because #58's keymap maps a code to the characters it
  types, and a modifier is not a character -- so Caps-Lock-as-Control, the
  commonest keyboard customisation there is, was not expressible at all. The
  remap decides what a code *is*, the keymap decides what it *types*, and a
  code with a role never reaches the keymap.

  A remapped code deliberately does not *become* the code it was mapped to.
  The first design rewrote it, and that made a real Control and a remapped
  CapsLock share one held bit, so releasing either reported Control released
  while the other was still physically down. The held set stays keyed by the
  physical code. The gate asserts that, with the premise checked first so it
  cannot pass against a server with no remap at all -- which it did, on the
  first teeth run, until the precondition was added.

  Lock states are applied *after* evdev_sync_modifiers rather than before: the
  sync adopts the kernel's LED and is the authority when nothing has been
  configured, so applying first was silently undone.

  Two bugs found rather than introduced.

  The fabrication sidecar's `:`-separated format mangled any phys containing
  colons, which is every USB phys -- stage 1's gate device was quietly
  `input-0003-046d-c52b-usb-0000` with its name swallowed. It is key=value
  lines now, and carries kinds and capabilities, which makes ADR 0064's 422
  "this property does not apply to this device" rule locally testable for the
  first time: until now every fabricated device was kind-less and kind-less
  accepts everything.

  Making that rule real locally immediately found a stage-1 ordering bug.
  Stored settings were applied at the moment a device entry was allocated,
  before its kinds and capabilities were known -- so a stored keyboard
  property gated on EV_REP was refused by the same 422 that protects a live
  PATCH. Stage 1 could not see it because stage 1 had no capability-gated
  property.

  And a second stage-1 correctness fix, from the same source: a stored
  property that is refused was kept at boot, as ADR 0067 promises, and then
  deleted by the next save, because the document was regenerated from the live
  devices alone. "Dormant until something else is written" is not dormant. The
  document is merged now rather than regenerated, which also delivers the
  ADR's promise that an older release does not eat a newer one's keys.

  Gates: keyboard_settings_gate.rb, seven scenarios, the remap and the boot
  locks measured by their *effect* -- keys injected through the same dispatch
  a real device uses, the session echoing what reached its PTY -- so a setting
  that is stored but changes no byte fails. Teeth: with the properties removed
  from the writable list and the remap defeated, all seven fail with 33
  individual failures. What the gate cannot do is in its header: a fabricated
  node fails every ioctl, so the sidecar's `repeat=` stands in for the kernel
  and the gate tests that stand-in; the real round-trip is the host probe's.

  Suite: 54 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54. The real kernel round-trip, which is the
  half no local gate can do, on four real keyboards:

    keyboards reporting EV_REP: 4 of 28 devices
      input-0003-25a7-0124-...-input2     delay=250 period=33 rate=30
      input-0003-062a-4101-...-input0     delay=250 period=33 rate=30
      input-0003-0c45-fefe-...-input0     delay=250 period=33 rate=30
      input-0003-0c45-fefe-...-2.4g-dongle-keyboard  delay=250 period=33 rate=30

    set delay=400 rate=20  ->  kernel delay=400 period= 50 rate=20
    set delay=250 rate= 7  ->  kernel delay=250 period=142 rate= 7
    set delay=180 rate=30  ->  kernel delay=180 period= 33 rate=30

    a device without EV_REP            422 device_property_not_applicable
    lock states                        caps_lock_boot false, num_lock_boot true
    stored                             {"repeat_delay_ms":180,
                                        "repeat_rate_hz":30,
                                        "caps_lock_boot":false,
                                        "num_lock_boot":true}
    restored                           delay=250 rate=30

  The quantisation is measured rather than argued: 7 Hz is 142.857 ms and the
  kernel keeps 142, which reads back as 7 Hz. 20 Hz is 50 ms exactly. That is
  why the read-back is what gets reported.

  The probe restores every keyboard it touched, because a test box whose keys
  repeat at 3 Hz afterwards is a test box somebody has to fix by hand.

  The deployment was clean -- #63 holding in a fourth release:

    11:59:36 Stopping blit.service ...
    11:59:37 blit: package installed; exiting for the unit restart
    11:59:37 Started blit.service ...

  No stop-sigterm timeout, no SIGKILL, one `listening` line. The desktop came
  back with 32,400 printable cells at revision 859, errors and warnings both
  empty, on the first launch this time.
