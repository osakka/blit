notes: >-
  Three things the operator asked for, after saying the feature work was not
  making the server usable.

  **A chord that stops the server from the keyboard.** Ctrl+Alt+Backspace,
  enabled by default, programmable at GET/PUT /v1/control/shutdown-key. It
  exists for the case they were actually in: the screen is wrong or input is
  not reaching anything, and the only other control channel is an API they may
  not be able to get to. It performs the same orderly stop as
  POST /v1/control/shutdown and exits 0, so a unit with Restart=on-failure
  leaves it stopped.

  The gate asserts the ways it could be useless or dangerous rather than
  merely absent: a bare Backspace is inert, near misses are inert, it fires on
  press and not on release or autorepeat, every modifier must be held on the
  keyboard the key came from, it is programmable, a reprogrammed chord
  survives a restart, disabling works, and the exit status is 0.

  Persistence had the ordering bug stage 1 had: the default was assigned
  *after* the stored document was applied, so it silently overwrote it.
  Invisible until the first restart; the gate caught it.

  **The adapter translated a key release into a keystroke.** Blit publishes
  press, autorepeat and release, and says which is which with `pressed` and
  `repeat` -- verified on the live stream. console-blit.c emitted a key for
  every one of them, so a single tap of Escape arrived as two keystrokes:
  anything the desktop toggles went on and straight back off, and whether it
  landed on depended on how many autorepeats fitted inside the hold. That is
  exactly the reported "on/off/on/off and I don't know which way it ends".

  Autorepeat deliberately still produces a keystroke. Holding a key repeating
  it is what a terminal does, and dropping repeats would break held cursor
  keys for every application.

  **The Hibr version pin was wrong, and had been for every release since
  0.1.437.** packaging/HIBR_VERSION said 0.99.100; the host runs 0.99.127.
  build-deb.sh does not rebuild the adapter, so every release shipped a
  console-blit.so built against headers two dozen point versions behind the
  runtime loading it. The ABI happens to be 16 in both, which is why it
  worked, but nothing was checking that.

  The adapter is now built against v0.99.127 extracted read-only from the Hibr
  repository -- its hibr.h matches the host's byte for byte once the version
  line is removed -- and the pin records what it was built against.

  Not settled here: the mouse not clicking. The adapter drops pointer_button
  while `mouse_mode == 0`, which is correct -- an application that has not
  asked for mouse reporting should not receive clicks -- so the question is
  whether the desktop enables it, and that is answered by
  BLIT_ADAPTER_TRACE=1, which logs into the session's own output and was not
  turned on against a live desktop.

  Suite: 63 pass, 5 skip, 0 fail. Adapter gate passes against 0.99.127.
