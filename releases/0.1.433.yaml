notes: >-
  The id correction that live data forced, one release after the table it
  belongs to. Issue #51.

  0.1.432 derived a device id from EVIOCGID plus the device's serial, falling
  back to its physical bus position, and appended a scan-order ordinal when two
  devices still collided. Deployed, 192.168.10.54 reported 28 input nodes and
  only 14 distinct (identity, phys) pairs. One HID interface commonly presents
  several event nodes -- a keyboard, a consumer-control and a system-control
  collection -- and they report the same bus id and the same phys, differing
  only in their name. So half the host's device ids were pure scan order, and
  unplugging one node would renumber the rest. One of them was "2.4G Dongle
  Keyboard", which the server actually reads.

  That is the exact instability the derivation exists to avoid, and it was
  invisible locally: this environment has no /dev/input, and the identity gate
  asserted over fabricated devices whose phys strings were, by construction,
  distinct. The live inventory was the first fixture with a device that
  reports its name as its only distinguishing field.

  The device's own name is now the first discriminator and the scan-order
  ordinal only the last. 27 of the host's 28 devices become stable. The
  remaining pair reports an identical bus id, an identical phys and an
  identical name; nothing in evdev separates them, so they take the ordinal and
  the contract says so rather than implying stability it cannot deliver. The
  composed id is bounded at 112 bytes, inside ResourceId's 128; the longest the
  gate composes is 73.

  The identity gate's fixtures are now devices the live host actually
  presents: the three-node remote, the five-node dongle sharing one phys, the
  identical pair, a device with a serial moved between ports, and a
  kernel-synthesised device with no identity at all. Teeth: with the name
  discriminator removed the shared-phys case collapses to one id and the
  ordinal becomes the first resort; with the phys disambiguator removed the
  three-node case collapses. Suite: 43 pass, 5 skip, 0 fail.

  Also corrected: 0.1.432's manifest recorded server_binary_sha256 and
  hibr_adapter_sha256 from build/blit-desktop-current, which build-deb.sh only
  checks and never rebuilds -- it was eighteen hours stale. The deb ships
  build/blit/blit-server, and both hashes now name what was actually released.
  The deployment itself was verified by the update helper against
  package_sha256, which was correct, so nothing shipped unverified.

  Host-accepted on 192.168.10.54. 28 input devices, 28 distinct ids, nothing
  dropped. The ids are identical -- same set and same order -- across a
  POST /v1/control/restart, which is the stability claim measured rather than
  argued. All seven polled devices carry a name- or position-derived id,
  including 2.4G Dongle Keyboard, which under 0.1.432 was
  ...-input2-2 and is now ...-input2-2.4g-dongle-keyboard. Two
  collection GETs added no evdev_scan_opens there either: 32 before, 32 after.
  The item route answers, and an unknown id is a 404. The desktop came back
  with 32,400 printable cells at revision 859 and an empty errors array.

  Still open: physical input remains untested. The per-device counters in each
  item's state read zero on the host because nobody is at the keyboard, and
  /v1/input/inject attributes to the aggregate route rather than to a physical
  device, so it cannot exercise them. src/blit_kms.c carries its changes unseen
  on a screen.
