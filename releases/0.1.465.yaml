notes: >-
  Issue #75 was found before launching the next Hibr acceptance run. A
  revision-matched PATCH enabled the live host's sole keyboard and opened its
  evdev descriptor, but the coalesced settings document retained
  enabled:false and would restore it after restart. The serializer treated a
  known property omitted because it returned to its default as though it were
  an unknown future property.

  Validation and persistence now share one input-property vocabulary. A known
  property applicable to the live device is removed when its non-default
  serialisation omits it; a known but presently inapplicable property remains
  dormant; and an unknown property remains preserved for downgrade safety.
  The new gate fails twice against 0.1.464 and passes against this source.

  The live 0.1.464 settings document was repaired through PUT /v1/settings so
  a restart cannot re-disable the keyboard while this candidate is being
  packaged. That operational correction is not deployment evidence for this
  release. No Hibr source was modified.
