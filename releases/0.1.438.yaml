notes: >-
  One defect, found by reading 0.1.437's own deployed inventory rather than by
  a gate.

  The live host's HyperX QuadCast publishes

    Rates: 8000, 11025, 16000, 22050, 32000, 44100, 48000

  and atoi of that line reported sample_rates: [8000] -- a claim that the
  device supports 8 kHz and nothing else. Every integer on the line is now
  reported, bounded at sixteen.

  The gate could not have caught it: its fixture had a single rate, which is
  the one shape where taking the first integer is correct. That is the same
  shape of gap as #58, where key_encoding_gate tested exactly the one letter
  the broken arithmetic got right. Two fixtures in this session have now
  sampled precisely the case that works, which is worth saying out loud: a
  fixture with one of something does not test a list.

  A driver may also publish a range -- "44100 - 48000" -- and
  sample_rates_continuous now says so, rather than letting a client read two
  endpoints as a two-element list. No card on this host uses that form; the
  flag exists because the format allows it and misreporting it silently would
  look identical to the bug above.

  The gate's fixture now carries the QuadCast's seven rates. Teeth: taking
  atoi of the line reports [8000]. Suite: 47 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54, tools/probes/host_audio_config.rb:

    12 PCMs, 7 playback, 5 capture, 12 distinct ids
    card Generic: ["HDMI 0", "HDMI 1", "HDMI 2", "HDMI 3"]
    audio-quadcast-pcm0-p [8000, 11025, 16000, 22050, 32000, 44100, 48000]
    audio-quadcast-pcm0-c [8000, 11025, 16000, 22050, 32000, 44100, 48000]
    session saw "A=QuadCast/0"

  Twelve PCMs where the old inventory showed six cards, four HDMI outputs a
  controller can now tell apart, the QuadCast's seven rates where 0.1.437
  reported one, and the chosen default reaching a session launched after the
  write. The probe restores the default it found -- the host carries none, and
  carries none afterwards.

  The display item reports the envelope on the host too, with an empty
  configuration and 1920x2160 at 60 Hz active. The desktop came back with
  32,400 printable cells at revision 859 and an empty errors array.
