notes: >-
  This release supersedes the 0.1.476 mirror candidate. Hibr desktop --join
  clients are independent hold-client PTY viewports of one logical desktop;
  the primary alone loads the Blit provider, joined surfaces are parsed from
  their own PTYs, direct joined-surface cell writes are rejected, and joined
  input is routed to the primary owner. Hibr source is unchanged. The exact
  QEMU oracle and physical host still need to validate wallpaper, protocol
  graphics, context menus, window placement, and reconnect behavior.
