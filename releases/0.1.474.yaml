notes: >-
  This release makes the complete-cell display grid the sole geometry rule.
  Font-scaled cells are quantized by floor division, the usable pixel
  rectangle is centred, and the API publishes its dimensions, origin, and
  excluded remainder under topology outputs[].cell_grid. Pane partitioning
  continues to assign every complete cell to exactly one pane. Hibr source is
  unchanged. The live joined Hibr client remains an integration blocker when
  no desktop content is placed on its Hibr display; this release does not
  invent or mirror Hibr desktop semantics.
