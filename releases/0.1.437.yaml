notes: >-
  ADR 0064 stages 5 and 6: audio and displays. Issues #53 and #54.

  /v1/audio listed one item per *card*, with direction "duplex" when the card
  had both, formats hardcoded to ["s16le"], no channels, no sample rates, a
  literal "revision":1, and 32 x 32 x 2 access() calls on the event-loop
  thread per request -- the same stall shape as #16. The live host has six
  cards and nine PCMs, four of them HDMI outputs on one card. Choosing
  between "HDMI 0" and "HDMI 3" is the whole of choosing an output, and
  per-card granularity cannot express it.

  Now one item per PCM per direction, built by a scan and served from memory.
  The id is audio-<card-id>-pcm<device>-<p|c>, with the card component taken
  from /proc/asound/card<N>/id, which ALSA keeps stable across reboots --
  unlike the card number, which is assignment order and moves when a USB card
  is plugged in earlier. Formats, channels and rates are read per direction
  from the card's stream description: a USB card's stream0 carries separate
  Playback and Capture blocks whose formats differ, so taking the first match
  in the file gives a capture device the playback format. A card that
  publishes no stream description -- an HDA card describes itself through
  codec#N instead -- reports none, rather than the s16le the old inventory
  asserted for every device.

  PATCH /v1/audio/{id} writes configuration.default: one default per
  direction, playback and capture chosen independently. Blit has no audio
  engine, so the only way it can honour the choice is to export ALSA_CARD,
  ALSA_PCM_CARD, ALSA_PCM_DEVICE and BLIT_AUDIO_PLAYBACK/CAPTURE into the
  environment of sessions launched after the write. execve means it cannot
  reach a session already running, and the schema and the ADR say so rather
  than leaving a controller to discover it. No volume, no mute, nothing else a
  mixer does: that needs libasound, which changes tools/build-tcc.sh and the
  packaging/build-deb.sh dependencies and is a decision of its own.

  Displays get GET /v1/displays/{id}, a real collection revision and the
  ADR 0064 envelope. configuration is empty, and that is the decision rather
  than an omission: selecting a mode changes the render output size and
  therefore every surface on the display, and a Hibr desktop's cells come
  from its owner (ADR 0063), so Blit cannot repaint one at a new size by
  itself. It needs a resize protocol with the owner, filed as #60 with the
  operational reason attached -- a mode change on an unattended screen that
  fails to come back is unrecoverable over the API. The modes are reported so
  a controller can show them; a mode property that accepted a value and did
  nothing would be worse than its absence.

  Also: json_rejected_property(object, writable, count), written before audio
  would have made it the third copy of the same fifty lines, with stage 2's
  teeth re-run against the shared function to prove it still bites. And a dead
  seventh argument the display serialiser passed to a six-specifier format
  string, one format change away from reporting a height as a width.

  Gates: audio_device_api_gate.rb against a fabricated /proc/asound and
  /dev/snd under BLIT_ASOUND_ROOT and BLIT_SND_ROOT -- this environment has
  neither -- with a three-PCM card whose Playback and Capture sections
  disagree, and a check that the chosen default reaches a session launched
  afterwards, read out of that session's own surface.
  display_device_api_gate.rb for the envelope, the item agreeing with the
  collection, and a PATCH being refused rather than quietly accepted. Teeth,
  each shown: reading the format from the Playback section regardless of
  direction gives the capture device the playback format; one default across
  both directions makes choosing a microphone clear the chosen output; the
  pre-change display item fails the envelope.

  Suite: 47 pass, 5 skip, 0 fail.

  One honest caveat, filed as #61. An earlier full run of the same suite had
  pointer_damage_atomic_gate.rb fail once. It then passed standalone, passed
  in its group, and passed in a second full run. The message was lost, because
  run_gate() keeps only a gate's last line -- so what is recorded is a
  reproduction rate and a plausible mechanism (the gate stands two fixed 200ms
  sleeps in for "a frame was rendered", and its fixture child is sleep 3), not
  a diagnosis. An intermittent gate makes every later suite run ambiguous,
  which is why it is a ticket rather than a shrug.
