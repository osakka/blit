notes: >-
  0.1.495 addresses Blit issue #80. The frame-rate gate now supports an
  authenticated remote endpoint, configurable full-surface dimensions, and an
  explicit maximum render budget. On 192.168.10.54, a 240x135 workload at
  60 Hz measured 59.916 Hz, zero missed deadlines, and 16.789 ms worst render
  against a 17 ms threshold; a 14 ms threshold failed at 16.848 ms. The
  OpenGLES2 scene cache remains disabled because render-target persistence is
  not proven. Hibr source was not modified.
