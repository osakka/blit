notes: >-
  This release makes the per-output refresh deadline authoritative for pending
  terminal, pointer, overlay, and API pixel work. It retains pointer damage
  independently across affected outputs and re-phases only after a genuinely
  stale idle interval. The live pre-fix trace showed full GLES2 redraws about
  every 5 ms during Hibr window movement; live trace and physical motion
  acceptance remain deliberately pending until the exact package is deployed.
