notes: >-
  0.1.483 adds a bounded one-refresh presentation barrier for the primary and
  joined PTYs of one logical Hibr desktop. The focused gate deliberately
  staggers the PTY redraws and proves no render occurs between barrier open and
  release. This fixes the Blit-side partial-frame presentation boundary but
  does not synthesize a Kitty/Sixel image that Hibr did not send. Live 0.1.482
  still reports zero decoded graphics images and Hibr issues #240 and #238
  remain the blockers for complete vertical-join desktop and spanning-picture
  acceptance. The broad local suite also exposed an existing fractional-font
  gate failure at scale 1.1; this release does not claim that unrelated gate
  is fixed.
