notes: >-
  A desktop's cells come from its owner. Issue #32's Blit half, with
  ADR 0063; the remainder is itdlabs/hibr#176.

  A desktop reattached with --resume came back blank and reported itself
  healthy: 32,400 cells, owner registered, every status check green, screen
  black. The revision arithmetic in that report identified it -- a revision
  counts one accepted cell request and the request bound admits about 43
  cells, so ten revisions cannot carry 32,400 cells. The content arrived
  through the session PTY, where `hold attach` had replayed the held
  session's terminal stream into a surface that already had a registered
  owner: the two-writer collision ADR 0057 closed for physical input,
  arriving from the output side.

  A session with a Hibr desktop role no longer authors its cells from its
  PTY. The gate is the desktop role rather than owner registration, the same
  choice ADR 0057 made, so the startup window closes too. The bytes still
  reach the terminal_output stream, so a client that wants the replay can
  have it; they stop becoming cells.

  That alone would leave a resumed desktop blank without saying why, so
  hibr_attachment gains owner_writes and owner_painted, and a desktop holding
  a registered owner for ten seconds with no accepted cell request is
  reported as hibr_desktop_unpainted in the runtime log and in
  /v1/diagnostics errors. Deliberately not fatal, unlike an owner that never
  registers at all: a slow desktop is still a desktop. health.ready is
  untouched, because it describes the display backend.

  --resume is also now recorded for the launcher that is actually deployed.
  hibr_resume_requested was parsed only when the command was literally
  `desktop`, while the deployed launcher is blit-session.hibr, so a resumed
  desktop could not report that it was one -- the single fact a blank
  reattachment most needed to state.

  What this does not do: make a reattached desktop appear. A resumed desktop
  is now blank and says so, which is the whole of what Blit can decide alone.
  `hold attach` hands an attaching client the held session's terminal stream,
  and a client whose display is a provider has no frame to send and cannot
  turn a byte stream into one, while the held session's own provider is still
  pointed at a surface that no longer exists. That is itdlabs/hibr#176. The
  supported recovery after a restart remains a fresh --session, which draws
  correctly.

  desktop_repaint_gate.rb needs no Hibr: a fixture named blit-session.hibr,
  which is how Blit recognises a desktop, emits a reattachment-shaped replay
  while a stub owner registers and draws nothing. ADR 0057 declined a stub
  owner for its own evidence because what mattered there was the absence of
  echo on a surface an owner is actively drawing; here the stub is the
  subject. Against the previous binary the gate reports the PTY authoring 231
  cells of an owned surface, no --resume record, no owner_painted field, and
  no report of the unpainted desktop anywhere.

  Unchanged: every pixel claim is measured on the SDL path, and
  src/blit_kms.c carries its changes unseen on a screen.
