notes: >-
  The settings document carries its own revision, found by reading the live
  host after 0.1.451 went out: the revision came back at 0 in the fresh
  process, because it was an in-memory counter like every other revision in
  Blit.

  For the device revisions that is deliberate -- ADR 0064 made a restart
  observable through them and a controller is meant to notice. For this one it
  is wrong: it is the If-Match a controller writes the *whole document*
  against, and a counter that restarts at zero lets a stale write composed
  before the restart match by accident. The device revisions at least refuse
  such a write, because they restart at 1 rather than 0.

  So the revision is stored with the document and read back at boot, and the
  gate asserts it survives the restart alongside the setting it belongs to.

  Measured on 192.168.10.54 before this fix, which is how it was found:

    after the supervised update to 0.1.451
      GET /v1/settings -> revision 0, persisted true
      the document on disk carried the pointer and the audio default

  0.1.451's own acceptance stands and is the headline for stage 1: a pointer
  at 215% with natural scroll, and an audio playback default, both survived a
  real supervised update on the live host -- the first time any device setting
  has. Before this stage they were lost on every release.

    before the update  input-0003-25a7-0124-...-input3  215%  natural_scroll
                       audio-device-pcm0-p              default
    after the update   input-0003-25a7-0124-...-input3  215%  natural_scroll
                       audio-device-pcm0-p              default
    errors []          warnings ['output_without_session']

  And the deployment itself was clean, which is #63 holding in a second
  release: 09:51:25 stop, exit, start, one `listening` line, no stop-sigterm
  timeout and no SIGKILL.

  Suite: 53 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54. Stage 1's headline, which is the first time
  any device setting has survived a release on this host:

    PATCH a pointer                 sensitivity_percent 215, natural_scroll
    PATCH an audio playback device  default true
    /var/lib/blit/settings.json     -rw-r----- root root 191 bytes
      {"version":1,"input_devices":{"input-0003-25a7-0124-...-input3":
       {"sensitivity_percent":215,"natural_scroll":true}},
       "audio_devices":{"audio-device-pcm0-p":{"default":true}}}

    supervised update to 0.1.452    both still applied afterwards
    POST /v1/control/restart        both still applied, settings revision 1

  The stored revision was measured both ways: a document written by 0.1.451
  carries none and loads as 0, which is the correct answer for an older
  document; a write then records 1 and the restart reads it back as 1.

  The deployment itself was clean, #63 holding in a third release: stop, exit,
  start inside one second, one `listening` line, no stop-sigterm timeout.

  Recorded rather than smoothed over: the **first** desktop launch after this
  deployment did not take. Blit created session 1, logged
  `hibr_resize_discovery session=1 attempt=1 matches=1` and then `matches=0`
  for attempts 2 through 4, and retired the surface -- while Hibr's own
  `[attached: blit-0-1-452]` and `[hold: blit-0-1-452]` processes stayed alive
  as orphans. A second launch with a different session name reached 32,400
  printable cells in about ten seconds and has stayed healthy with errors and
  warnings both empty. The orphans were killed by hand afterwards. That is the
  fail-closed `hibr_attach_unresolved` shape and it is adjacent to #32; it is
  noted on that ticket rather than claimed as understood here, because this
  release did not touch the attach path and one occurrence is not a diagnosis.
