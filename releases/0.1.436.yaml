notes: >-
  Three gaps in 0.1.435's routing, two of them things the gate had not been
  asked.

  A route could be set and disabled but never removed, so a controller could
  not put a device back the way it found it -- and the live probe, which claims
  to leave the host as it found it, did not quite. A route object carrying
  enabled:false and no target_session_id now removes the route; an enabled
  route with no target is a 400. Removal is expressed by omitting the key
  rather than by sending an empty string because json_string returns 0 for an
  empty value, which makes "" indistinguishable from absent.

  The route gate now asserts that an injection with no device_id does not
  inherit the previous routed device. The routing decision is carried by a
  runtime field set at the top of a drain or an injection and cleared at the
  bottom, and if it ever survived a request boundary an unrouted event would
  land wherever the last routed device pointed. The test uses the second
  device deliberately: with no device the fallback is the focused session,
  which is the first one, so routing through the first device could not tell a
  leak from the fallback working. That distinction was the whole content of the
  test -- the first attempt asserted against the first session and failed for
  the wrong reason, which is how the fallback's own behaviour got confirmed.
  Teeth: with the clear removed from the inject body, the unrouted letter
  lands in the previous device's target.

  Two things documented rather than changed, both pre-existing and both now
  reachable per device:

  The cell coordinates in a routed pointer report are those of the surface
  under the cursor, clamped to the first cell when the cursor is over nothing.
  So a routed pointer reports its target's buttons with the geometry of
  wherever the cursor happens to be. The aggregate routes have always done
  this, and changing it would change their meaning, so ADR 0064 and the schema
  state it instead.

  A device's revision counts its state.present as well as its configuration,
  so a PATCH written against a device that has since been unplugged conflicts
  rather than being applied to a device that is no longer there. The schema
  said "description and configuration"; it now says what it counts.

  Filed, not fixed: #59. run-gates runs network_auth_gate.sh against
  build/blit-desktop-current/bin/blit-server, which build-deb.sh checks but
  never refreshes -- the released deb ships build/blit/blit-server. The bundle
  binary was eighteen hours stale when 0.1.432's manifest was corrected, so the
  one gate covering authentication, the command allowlist and BLIT_API_TOKEN
  injection has been passing against a binary that is not the one under review.
