notes: >-
  Rendering and input correctness, from a whole-server review: issues #33,
  #34, #36, #37, #38, #39, #40, #41, #42 and #44 closed, #35 half done, and
  #45, #46 and #47 filed from what the work turned up. ADR 0061 records the
  one surface-origin rule.

  Presentation. A surface holding a DEC 2026 batch was dropped from the
  renderer's target/view count, which moves the count, which forces a full
  redraw, which clears the scene -- so the frame the mode exists to hold was
  the one thing guaranteed to be erased. Both paths now keep it counted and
  simply do not draw it. The block cursor was a solid rectangle drawn after
  the glyph layer, erasing the character the user was about to overwrite; it
  is now an inverse cell. Italic was a second bold strike one pixel over and
  so pixel-identical to bold; it is now a slant, and text blink is documented
  as presented steadily rather than silently dropped. A session's DT_INK and
  DT_FACE reached only the OSC 10/11 answer, so an application was told one
  colour and shown another; both renderers now paint unstyled cells with the
  session pair, and OSC 10/11 are accepted as sets.

  Geometry. Three pieces of code computed a surface's origin and disagreed.
  The hit test omitted the four-pixel inset both renderers draw with, so every
  click inside a pane was computed from half a cell left and a quarter of a
  row up. A pane-less surface was placed three ways; with one pane session
  present the SDL path drew it at y=776 on a 768-pixel display, off the
  screen, while the hit test still believed it was at the corner.

  Input. Modifiers reached the application only for letters and punctuation:
  Ctrl+Right was Right, Shift+Tab was a tab, Shift+F1 was F1, and Alt+Left
  lost the Alt entirely. Modifier state was the last event seen rather than
  what is held, so releasing one of two Shift keys said Shift was up. CapsLock
  and NumLock were untracked, AltGr aliased Alt, and F11/F12 indexed a
  twelve-entry table with 28 and 29 -- past its end. DEC 1002 reported hover
  motion with no button held, both tracking modes reported per pointer sample
  rather than per cell, and the legacy wheel byte was 64 where xterm defines
  96. Input the PTY refused was lost in silence and is now counted.

  POST /v1/input/inject gains a key kind, and the key path a physical device
  takes is factored so an injected key cannot diverge from a real one. That is
  what makes the encoder testable in a container with no /dev/uinput.

  Rendering starvation, found by the soak gate failing only inside a full
  suite run. The window that coalesces a clear and its redraw was pushed to
  now+8ms on every batched chunk, and the flag causing the push is cleared
  only by a frame being presented, so sessions clearing faster than the window
  is wide pushed the deadline forever and nothing was presented. Four sessions
  clearing every 10ms over 20 seconds on an idle host:

    0.1.424          frames=302   longest stagnant run=29  missed=1088
    this build       frames=1251  longest stagnant run=1   missed=138

  The soak gate trips at 50, so the shipped server was within a factor of two
  while idle. The deferral predates 0.1.424 (e4b442d), so it is not a
  regression from this work; this work shifted the timing enough to expose it.

  Host-accepted on 192.168.10.54 at 1920x2160 through SDL3/opengles2 -- real
  GPU rendering, not the dummy driver the gates use. The block cursor's cell
  reads 108 pixels of cursor colour with the glyph's own 20 pixels inverted
  inside it; bold, italic and plain occupy 38, 20 and 20 pixels in three
  different shapes; a DT_INK session's glyph is ff0000; and a surface holding
  a DEC 2026 batch keeps its 116 lit pixels through the batch and shows the
  new 80 only after release. The Hibr desktop was relaunched afterwards and
  reached 32,400 printable cells with its owner registered and its revision
  stable; 20 seconds idle with it up produced one frame (a screenshot
  request) and no missed deadlines, so bounding the coalescing window did not
  cost the idle-frame contract.

  What this release does NOT establish. Every pixel claim is measured on the
  SDL path. src/blit_kms.c carries the same changes for synchronized output,
  the cursor glyph, italic and the session default pair, and none of it has
  been seen on a screen: there is no DRM device in the build container, the
  live host presents through SDL3/opengles2 rather than the direct KMS path,
  and reaching that path needs BLIT_DISPLAY_BACKEND=kms in the server's
  environment, which the API cannot set. The QEMU oracle needs an initroot
  that no longer exists. Physical keyboard and pointer hardware is likewise
  unexercised: the encoders are gated through the injection endpoint, which
  shares their code path but not their devices.

  Also open: #45, the screenshot diagnostic answers from three different
  sources and a fresh request invalidates the output it inspects, which is why
  the first #33 measurements contradicted each other -- every pixel gate in
  the tree rests on that witness. #46, json_string_array decodes only \n, \r
  and \t, so a conforming client's \u001b arrives as the literal text u001b
  and a session argument cannot carry a control character. #35, keyboard
  layout is still US-only and wants a keymap source and an ADR.
