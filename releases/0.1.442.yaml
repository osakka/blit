notes: >-
  Stage 4 left two rules for where a device property applies, and they
  disagreed in a way a control-panel author would have hit.

  `keymap` was accepted on any device, justified by POST /v1/input/inject
  delivering a key through any device id. `sensitivity_percent` was refused
  with 422 on a non-pointer. So a pointer_relative injection naming a keyboard
  went through scale_pointer_delta using that keyboard's sensitivity -- a
  configuration path the PATCH would not let anyone write. Two defensible
  rules, one inconsistency between them.

  input_device_supports is now the one rule. A device of no known kind -- one
  Blit probed and reads under no kind at all -- accepts any property and any
  injected event, because Blit has made no claim about what it is. A device of
  a known kind refuses what contradicts its kinds, with a 422. The same rule
  governs an injection's device_id, so an injection can deliver only what that
  device could have delivered. And a property is reported wherever it can be
  written: a controller can set exactly what it can see.

  The local gate can only produce devices of no known kind -- a fabricated
  node answers no evdev ioctl -- so it asserts the accepting half and names
  where the refusing half is checked: tools/probes/host_device_kinds.rb,
  against the live host's keyboard-only and pointer-only devices.

  Also in: the AltGr fallback assertion now states the choice it pins rather
  than only the value it expects. AltGr on a key with no third level types the
  unmodified character, which is US-keyboard behaviour where AltGr selects
  nothing -- not X11's, where it types nothing at all. Both are defensible, so
  the gate should say which one Blit picked; otherwise a later change reads as
  a test broken rather than as a decision reversed.

  Two things recorded as unexercised rather than left to imply they are
  tested: default_keyboard_state, the fallback a key uses when its device has
  no table entry, which needs 33 devices to reach; and audio's
  state.accessible, which is always true here and on the host because Blit
  runs as root and the fixture's nodes are ordinary files.

  Suite: 47 pass, 5 skip, 0 fail.

  Host-accepted on 192.168.10.54, tools/probes/host_device_kinds.rb against
  its keyboard-only, pointer-only and no-kind devices -- the two interfaces of
  one remote and a power button:

    pointer property on a keyboard                 -> 422
    keymap on a pointer                            -> 422
    pointer_relative through a keyboard            -> 422
    key through a pointer                          -> 422
    pointer property on a device of no known kind  -> 200

  and a keyboard does not report the property it refuses while a pointer does.
  The keyboard-layout probe still passes against the same host with the
  desktop up, and no device is left configured. The desktop came back with
  32,400 printable cells at revision 859 and an empty errors array.
