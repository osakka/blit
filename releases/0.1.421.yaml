notes: >-
  ADR 0058. A surface revision counts accepted writes, not observed changes.
  The server rule is unchanged and now written down in the schema; the Hibr
  adapter is where it is honoured, by keeping a shadow of the acknowledged
  cells and sending only each frame's delta. An idle desktop sends nothing.

  Measured before this release on the live host at 0.1.419: an idle desktop
  advanced surface-9 (240x135, 32,400 cells) by 1618, 1362 and 1274
  revisions in consecutive five-second windows, i.e. 254 to 323 per second
  with nothing visibly changing.

  Two server changes fall out of coalescing. A coalesced frame usually fits
  in one request, which must be presentation=immediate because Blit answers
  409 frame_not_open to a commit with no preceding defer; and immediate now
  closes an open frame, because otherwise one frame abandoned after its
  first defer would withhold the surface from the renderer permanently.
  frame_open is now reported by GET /v1/surfaces/{id}/summary so that state
  is observable at all.

  A third fix is adapter-side: Blit clears the cell to the right of a
  double-width glyph when a narrow glyph replaces the leader, so the blank
  that repaints that cell is exactly what coalescing drops. Multi-byte text
  on either side of a write now invalidates the neighbour in the shadow.

  tools/tests/adapter_coalesce_gate.sh compiles the shipped adapter into a
  harness and drives it against a real server with no Hibr process. On
  64x24: first frame 41 requests, identical frame 0, one changed cell 1,
  cursor-only move 1, empty flush 0, twenty idle frames 0. Both assertions
  that could have been vacuous were verified against deliberately broken
  builds: the frame_open check exits 1 against the previous server rule, and
  the wide-glyph check reports 1535 painted cells of 1536 without the
  neighbour invalidation.

  Deployed and measured. A fresh desktop draws its 32,400 cells in 869 cell
  requests where 0.1.419 took 46,474. Idle read 0 revisions across three
  consecutive fifteen-second windows; over a following seventy seconds the
  revision advanced once and a cell-by-cell diff found exactly one changed
  cell, (224,0) '3' to '4', the minute digit in the bar. Sampling the centre
  of all 32,026 visible cells in a live screenshot finds the wallpaper and bar
  backgrounds the state reports, so the screen is drawing rather than quiet.

  The lead-byte test for a possibly-wide glyph is 0xe0 rather than 0x80
  because a wallpaper is 32,104 cells of U+00B7: treating two-byte glyphs as
  possibly wide left one invalidated cell per frame and measured one request
  per second against a screen where no cell changed at all. Blit's width table
  has no double-width range below U+1100, so 0xe0 covers every wide glyph.

  Deploying also found blit#32: nothing on the host relaunches the Hibr
  desktop after the supervised restart, and reattaching with --resume comes
  back blank while reporting owner_registered and 32,400 cells. Ten accepted
  requests cannot carry 32,400 cells, so that content arrived through the
  session PTY rather than the adapter. Filed separately; a fresh --session
  draws correctly.
