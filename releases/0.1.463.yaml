notes: >-
  The root cause of #72, found by testing the renderer's assumption instead of
  guessing at a sixth reproduction.

  The incremental scene cache rests on a precondition: that the backend
  preserves a render target's contents between passes, so repainting only the
  damaged rows leaves the rest of the previous frame intact. Measured A/B on
  the live host, same machine, same screensaver:

    cache on    stale 170 of 329 cells drawn; 740 earlier under a busier saver
    cache off   stale 0 across six samples, on a harder workload -- 10875
                cells drawn and 1015 changing between the bracketing reads

  The precondition is false on this host's opengles2 path.

  That is why five reproductions were all clean: every one ran against SDL's
  software renderer, where the precondition does hold. The development
  container has no GPU, so no gate in this repository can see this class of
  fault, and the suite's agreement that the renderer is correct was true only
  of the renderer the suite can run.

  The cache is now enabled only where it is known sound -- the software
  renderer the gates exercise -- and every other backend draws whole frames.
  The cost was measured on the same host before the default was chosen: 3.3ms
  to render and 0.6ms to present against a 16ms budget, with no missed
  deadlines.

  BLIT_SDL_SCENE_CACHE overrides in both directions, so the next person can
  repeat the measurement on their own backend rather than trust this record.

  Locally the gates run the software renderer, so the default is unchanged
  there and the gates that assert cache behaviour -- pointer_cache_hits in
  external_pointer_composition_gate -- still exercise it. Suite: 63 pass, 5
  skip, 0 fail.
