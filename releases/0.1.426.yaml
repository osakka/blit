notes: >-
  The capture witness, and the two gates that depend on it. Issues #29 and
  #45 closed; #48 filed.

  A diagnostic screenshot could answer with pixels that were never on a
  screen, and every pixel gate in the tree rests on that witness. Inspecting
  a display no longer changes it: the non-cached form cleared the output's
  initialized flag, forcing a full redraw, so the capture showed a frame the
  request itself had caused -- and on a surface holding a DEC 2026 batch it
  showed the content the renderer was deliberately withholding, which is how
  the first measurements for #33 came to contradict each other. Both forms now
  answer from the next presented frame and ?cached=1 has no remaining effect.
  The unreachable back-buffer readback fallback is removed.

  The identity headers are recorded when the pixels are read rather than when
  the response is written, since a slow client collects a capture several
  frames later. X-Blit-Capture-Presented reports whether that frame's present
  returned. X-Blit-Capture-Revisions now carries each surface's presented
  revision rather than its current one: a surface whose frame is held is ahead
  of what is on screen, so the old header named a state the pixels did not
  show. docs/diagnostic-capture.md states the contract.

  render_state_agreement_gate.rb had been passing without checking anything.
  It wrote its fixture cells with foreground and background at the top level;
  the API carries them under style, the spec says so and the parser requires
  the key, so the colours were silently dropped and its "blank cells with a
  non-default background" were ordinary unstyled cells. It then defaulted a
  missing background to black and asserted those cells were black, on a screen
  that was already black. It now checks thirty genuinely blue cells. The
  silent drop is #48: a misplaced property should be a 400, and the schema
  already says additionalProperties is false.

  motion_trail_gate.rb answers the question behind #29 -- when content moves,
  does the renderer leave pixels the state does not account for? The live
  screensaver could not settle it, because a desktop advancing ~470 revisions
  a second is never the same frame as a twelve-megabyte capture. So the motion
  is reproduced and then stopped: with nothing writing, the pixels and the
  state describe the same frame by construction, and the capture's headers are
  checked to confirm that rather than assumed. 799 blank cells, none keeping a
  pixel the state does not account for. The renderer does not leave trails.

  That gate asserts an absence, so its teeth are load-bearing: a build that
  under-paints the damage rectangle by one row leaves 242 trailing cells and
  the gate reports them. An earlier fault injection -- removing the damage
  clear entirely -- was not caught and should not have been, because the
  background quads repaint those cells anyway.

  A note on method, since it cost a suite run. terminal_soak_gate.rb is
  sensitive to load on the build host: it failed inside a full run while gates
  and builds were running alongside it, and passed 38/0 when the suite had the
  machine to itself. Do not interpret a soak failure without knowing what else
  was running.

  Unchanged from 0.1.425: every pixel claim is measured on the SDL path.
  src/blit_kms.c carries the synchronized-output, cursor-glyph, italic and
  session-default changes and none of it has been seen on a screen -- the live
  host presents through SDL3/opengles2, and reaching the direct KMS path needs
  BLIT_DISPLAY_BACKEND=kms in the server's environment, which the API cannot
  set.
