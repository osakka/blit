notes: >-
  ADR 0064 stage 2, issue #52: per-device input configuration.

  PATCH /v1/input/devices/{id} writes a device's `configuration` and nothing
  else, with the concurrency rule the rest of Blit uses -- an optional
  `revision` in the body, an If-Match header, or both, each answered 409 when
  it does not identify the current revision. Writable: `enabled`, and for a
  device read as a pointer `sensitivity_percent` (10 to 1000) and
  `natural_scroll`.

  Disabling a device releases every file descriptor the poll set holds for its
  node and stops later scans re-claiming it, so the device is let go rather
  than merely ignored; it stays in the inventory, keeps its configuration and
  can be re-enabled. A property that is not writable is refused with 400 and
  named in the detail; a pointer-only property on a device of another kind
  with 422. Accepting either silently is how a controller comes to believe it
  has set something it has not, which is exactly #48.

  Three defects caught in review before they shipped, each one a thing the
  design implies but the code did not do:

  An absent device kept nothing. The retire sweep memset an unplugged device,
  so unplug and replug would have returned it with defaults -- and a stable id
  is worthless if what is attached to it evaporates while the device is out of
  the machine, which is exactly when a control panel most wants to still show
  it. A configured absent device now stays with state.present false; an
  unconfigured one is still retired.

  There were still two classifiers. record_input_device probed the device, and
  then evdev_register_path asked evdev_has_rel_xy/has_keyboard/has_gamepad
  again for the claim decision: the same predicates reached by two paths,
  which is the drift the table was built to remove even while they agreed. The
  claim now uses the table's kinds, and the predicates remain only as the
  fallback for a full table.

  `configuration` was read by forward search. The request parsers here find
  keys by scanning ahead, so a search started inside a sub-object finds a key
  that comes after it closes: {"configuration":{},"enabled":true} would have
  re-enabled the device. json_object_slice copies the balanced object,
  honouring strings so a brace inside one cannot end it early.

  POST /v1/input/inject gained an optional device_id and a pointer_relative
  kind, so an injected event travels the path a real event from that device
  travels, including its configuration: a relative motion is scaled by its
  sensitivity and a wheel event honours its scroll direction. Injecting
  through a disabled device is 409. Without this there is no way to exercise
  per-device configuration at all -- the gate environment has no /dev/input,
  and a host with nobody at the keyboard has nothing to turn the knob on.

  input_device_config_gate.rb drives hotplug by creating and deleting files
  under BLIT_INPUT_ROOT, which gates the inotify rescan, the device_changed
  stream event and the configuration-survives-absence rule in one fixture.
  Teeth, each shown: retiring a configured absent device loses the
  configuration and the replug comes back enabled; reading configuration by
  forward search lets an `enabled` outside the object re-enable the device;
  accepting an unknown property answers 200. Suite: 44 pass, 5 skip, 0 fail.

  Not in: per-device routing. `configuration.route` threads a device through
  keyboard_target and the seven input_route_target call sites, and the
  aggregate evdev-keyboard/evdev-pointer/evdev-gamepad strings are also a
  stream contract -- larger than the rest of the configuration put together,
  so it is its own stage. The keyboard layout stays #35.

  Stated rather than left implicit: configuration is held in memory, so a Blit
  restart resets it and a controller re-applies what it wants, with the
  collection revision dropping back toward 1 as the signal. Persisting it is a
  separate decision, worth weighing against #55 -- a restart already loses the
  desktop.

  Host-accepted on 192.168.10.54, including the two effects no local gate can
  reach. tools/probes/host_pointer_config.rb, against
  "ZYSD.Ltd HCY MIC RC Mouse" (/dev/input/event5):

    sensitivity 100%   dx=40  ->  pointer x 400.0 -> 440.0   moved 40.0
    sensitivity 200%   dx=40  ->  pointer x 400.0 -> 480.0   moved 80.0

  and disabling it released the device rather than merely stopping the reads:
  resources.pointers 3 -> 2, the item reporting state.open false, and an
  injection through it answering 409. Re-enabling brought it back, 2 -> 3,
  open true, and the probe restored the device to the configuration it found.

  The desktop came back with 32,400 printable cells at revision 859 and an
  empty errors array.

  Unchanged: the per-device counters in each item's state still read zero on
  the host, because nobody is at the keyboard and an injection is attributed
  to the aggregate route rather than to a physical device. src/blit_kms.c
  carries its changes unseen on a screen.
