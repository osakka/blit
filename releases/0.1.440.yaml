notes: >-
  Four problems with the evidence rather than with the product, and the defect
  that fixing one of them immediately found. Issues #59 and #61.

  #59. network_auth_gate.sh defaulted to build/blit-desktop-current/bin/blit-server,
  a staging copy that build-deb.sh checks for existence and never refreshes.
  Measured here, it was seven releases old. So the one gate covering
  authentication, the command allowlist and BLIT_API_TOKEN injection had been
  passing against a binary nobody was releasing -- it was green, and it was
  not testing the change under review. It takes the canonical binary now,
  run-gates passes it explicitly, and build-deb refreshes the staging copy so
  the directory cannot be a second, stale answer to "which server is this".

  #59's other half: package_artifact_gate.sh now checks that
  server_binary_sha256, update_helper_sha256 and hibr_adapter_sha256 are the
  hashes of what is actually inside the package. 0.1.432's manifest named a
  server binary that was never released. package_sha256 was correct, so the
  deployment itself was verified against the right artifact -- but a manifest
  that records a different binary than it shipped cannot be used to answer
  what ran. Teeth: with 0.1.432's stale value restored, the gate names both
  the recorded hash and the packaged one.

  The package was also not byte-reproducible. dpkg-deb stamps the ar container
  with the build time, so two builds of an identical tree differed -- which
  makes a recorded package_sha256 unverifiable the moment the artifact is
  gone. That happened during this very release: rebuilding to check the
  manifest produced a different hash, and 0.1.439's deb had to be discarded
  rather than its manifest edited, because editing it would have recorded an
  artifact that was never deployed. build-deb.sh pins SOURCE_DATE_EPOCH now;
  two builds two seconds apart produce identical bytes, and the gate will
  rebuild and compare under BLIT_GATE_REBUILD=1. Releases up to and including
  0.1.439 predate this and cannot be re-verified by rebuilding; from here they
  can.

  #61. run_gate() reported only a failing gate's last line, which is how this
  session's one intermittent failure left nothing to diagnose. It writes the
  whole output to a named file now and prints the path. The gate's own
  fragility is fixed too: its fixture child was `sleep 3`, which expires in
  the middle of an eight-attempt loop on a loaded machine, and two fixed 0.2s
  sleeps stood in for "a frame was rendered". One became a wait on the render
  frame counter. The other is simply gone, because measuring showed there is
  no later frame to wait for -- the renderer is event-driven and the counter
  sits at four or five for the full timeout. The trace that proves the overlap
  already proves the frame was presented, so the sleep was waiting for
  something that had already happened. Three consecutive runs pass.

  And then the harness fix earned itself on its first suite run. The audio
  gate failed with "an unplugged audio device was never retired", and the
  saved output said why: presence was tested on the /proc/asound entry while
  the hotplug watch observes /dev/snd, because nothing under /proc reports to
  inotify. A rescan triggered by a node disappearing would still find the
  /proc tree, keep the device present, and no later event could ever correct
  it -- the only thing left to change was under /proc. The PCM device node is
  the authority now. The nodes under /dev/snd on the live host are exactly the
  twelve PCMs /proc describes, so nothing is lost; and a node the server
  cannot open is still listed with state.accessible false, so a permission
  problem reads as a permission problem rather than as a missing device.
  Teeth: with presence back on procfs, the device is never retired and the
  stream carries no removal.

  That failure is also the honest answer to #61's question. One gate failed
  once in three suite runs and could not be diagnosed; the next unexplained
  suite failure was a real defect, found in one run, because the message was
  kept.

  Separately: the audio rescan was being measured inside
  diagnostic_last_evdev_scan_ms, which the evdev scan gate bounds at one
  frame. Suite: 47 pass, 5 skip, 0 fail.
