notes: >-
  0.1.485 adds Blit's first-class root-owned Hibr login manager. `/v1/login`
  starts, observes, and stops one login boundary; an exited login process is
  replaced after a bounded delay. The package enables BLIT_LOGIN_AUTOSTART=1
  and carries the Blit-owned LG_SESSIONCMD hook. The focused root gate uses a
  controlled command and proves lifecycle behavior, but does not claim PAM,
  logind, or a real authenticated Hibr desktop. Hibr #79 is the external
  root-path acceptance ticket. Hibr source was not modified.
