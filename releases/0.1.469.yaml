notes: >-
  This release makes historical evdev source identity explicit after KVM or
  USB re-enumeration. Existing event paths remain for kernel correlation, but
  runtime diagnostics now pair each last mouse/keyboard event with its input
  resource ID and current presence. Hibr source and input ownership are
  unchanged. Live deployment is intentionally not claimed until the
  supervised package update and post-KVM API capture complete.
