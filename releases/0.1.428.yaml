notes: >-
  Wide characters render as themselves. Issue #23, with ADR 0062; #24 closed
  alongside it because a stale font is how the symptom hides.

  CJK, Hiragana, Hangul and fullwidth forms reached the framebuffer as '?'
  while the canonical state was already correct -- the width table gave them
  two cells and the API reported width 2. That combination is the dangerous
  one: every API-level check passed and the screen showed two big question
  marks, which is how it was reported from this host.

  A wide character occupies two 8-pixel cells, so its glyph needs a 16x16
  bitmap, and PSF2 carries one cell size per file. So this is a second font
  rather than more glyphs in the existing one, which is the part that made it
  a decision rather than a rebuild. assets/fonts/Blit-Hibr-Unifont16.psf holds
  49,899 glyphs covering every wide block of the BMP completely: CJK Unified
  20,992, Hangul Syllables 11,172, CJK Extension A, CJK Compatibility, Hangul
  Jamo, Hiragana, Katakana, CJK Symbols, Fullwidth forms. Generated from GNU
  Unifont 15.1.05 and redistributed under the SIL OFL 1.1, checked in so an
  installation still needs no font tooling.

  The SDL wide atlas is filled on demand. Up front it would be a 2304x7020
  texture, about 65 MB uploaded at startup for glyphs most sessions never
  show; instead it is a fixed 2048x2048 populated one glyph at a time with a
  codepoint-indexed slot table, and wide glyphs batch separately because a
  batch submits with one texture. KMS needs no atlas and takes the other font.
  A wide codepoint the wide font does not map stays on the primary font, whose
  substitute is then the marker for genuinely uncovered codepoints rather than
  standing in for all of CJK. Failing to load the wide font is not fatal.

  Measured cost: startup 77ms to 307ms, resident set 12.4 to 20.4 MiB, package
  plus 1.71 MiB. The atlas's 16 MiB is allocated only when a wide glyph first
  appears.

  Also in this release, from #24: two different files were named
  Blit-Hibr-Terminus16.psf, the checked-in 929-glyph artifact and a 540-glyph
  copy in the build tree. The package was always correct, so the divergence
  only appeared in local runs -- in the direction that hides a fault, since the
  missing glyphs render as '?' exactly where a coverage defect would, and it
  had already produced one wrong measurement. GET /v1/fonts now reports the
  loaded font's glyph and mapping counts, font_identity_gate.rb asserts they
  match the checked-in artifact and that the codepoints ADR 0020 guarantees
  reach the framebuffer as themselves, and it fails if anything under build/
  shares a name with a checked-in font while holding different bytes.
  docs/terminal-engine.md pointed at the build tree and now names assets/fonts.

  Not covered, and still showing '?': emoji. unifont.bdf is a BMP font and
  plane one is a separate artifact; a monochrome PSF2 bitmap is also a partial
  answer to a colour-emoji question. That is the one place the original report
  remains accurate.

  Unchanged: every pixel claim is measured on the SDL path, and
  src/blit_kms.c carries the same changes unseen on a screen.
