notes: >-
  This release keeps the primary Hibr client at logical union slot zero and
  projects additional Blit panes into deterministic horizontal Hibr slots.
  Blit still presents each local PTY viewport in its authoritative physical
  pane, so a stacked 1x2 topology keeps the desktop bar on the lower primary
  without mirroring. Hibr source is unchanged. The exact QEMU oracle and
  physical host still need to validate final multi-display and reconnect
  behavior.
