notes: >-
  This release translates mouse motion, buttons, wheel, pointer state, and
  evdev pointer input from a physical joined pane into the single Hibr
  desktop's projected logical union column. The regression gate proves the
  upper-pane event is not interpreted at the primary pane's local coordinate.
  This is a Blit-side correctness fix, not full vertical-join acceptance. The
  live photograph and fresh capture still show incomplete upper viewport
  content, broken scene/picture propagation, and visual coordinate symptoms.
  Hibr source is unchanged. Full physical 2-D joins remain blocked on Hibr
  issues #240 and #238; prior visual acceptance based only on distinct PTYs,
  60Hz presentation, and a pointer trace is revoked.
