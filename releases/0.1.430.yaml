notes: >-
  A correction to 0.1.429, found on the live host within minutes of
  deploying it.

  0.1.429's unpainted-desktop report never fired there. The check sat inside
  service_attach_reasserts, whose body only runs while the owner-rediscovery
  window is re-armed, and that window retires after 32 attempts. On a host
  where the owner group is found immediately the retry interval is 250ms, so
  the window closes in about eight seconds -- before the ten second threshold
  -- and the check was dead by the time it would have fired. The host showed
  the state the report exists for (owner_writes 0, owner_painted false, zero
  printable cells, black screen) with an empty errors array.

  It had passed its gate on timing luck. The gate's fixture kept carrying
  BLIT_SESSION_TOKEN in the environment of its surviving process, so owner
  rediscovery kept matching, the retry interval stayed at two seconds, and
  the window was still open at ten. A gate whose fixture differs from the
  deployment in a timing-relevant way can assert a behaviour the deployment
  does not have, which is the part worth remembering.

  The check is now its own pass over the session table, independent of the
  reassert machinery. The gate's fixture execs without the session token so
  rediscovery stops matching and the window retires early, which reproduces
  the host; it also says when a run did not exercise that case rather than
  passing quietly. Against a build with the check coupled to the window again
  the gate reports that the unpainted desktop was never reported, in
  diagnostics or in the runtime log.

  Everything else in 0.1.429 stands: a desktop's PTY no longer authors its
  surface, owner_writes and owner_painted are reported, and --resume is
  recorded for the deployed launcher.

  Also measured on the host while verifying this, and worth recording because
  it is not what #32 described: a --resume reattachment to a held session can
  work. The first attempt drew the desktop through the attaching client's
  provider -- 858 accepted owner writes, 32,400 printable cells -- while a
  second attempt to the same held session after the first was deleted drew
  nothing. So the blank reattachment is real and reproducible, but it is a
  state the held session can be in rather than something --resume always
  does, and the surface is now honestly empty instead of being filled with
  32,400 blank cells by the replayed stream. The repaint half remains
  itdlabs/hibr#176.

  Unchanged: every pixel claim is measured on the SDL path, and
  src/blit_kms.c carries its changes unseen on a screen.
