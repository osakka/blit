notes: >-
  Epic #64 stage 3 (#67): a pointer's buttons, scroll step and acceleration
  curve. `sensitivity_percent` and `natural_scroll` were the whole of a
  pointer's configuration, and `sensitivity_percent` is linear -- so there was
  exactly one acceleration curve and it was the identity.

  The interesting part of `buttons` is what it refuses. The terminal mouse
  report holds one state per button, so two codes aliased onto one of them
  means pressing both and releasing one reports released while the other is
  still down -- the same defect #66's modifier remap avoids by keying its held
  set on the physical code, except here the state belongs to the protocol and
  cannot be re-derived. So an aliasing map is refused, and the check is on the
  *effective* map with the defaults included: mapping 272 to right and leaving
  273 alone is refused, because 273 still produces right. The 400 names both
  codes and says what to do instead.

  A code that is neither a default nor mapped is not a button. The event
  filter deliberately does not widen to all of EV_KEY, or a pointer that also
  reports keyboard keys would dispatch letters as clicks.

  `flat` is the default and is exactly what this did before, because changing
  what an existing property means is not an upgrade. `adaptive` multiplies it
  again by a factor rising with the delta's magnitude -- untouched at or below
  2 counts, tripled at or above 20, linear between -- and that choice of input
  is a deliberate trade stated in docs/api.md: it makes the curve exact and
  therefore testable, at the cost of depending on the device's report rate, so
  adaptive feels different on a 1000 Hz mouse than on a 125 Hz one.

  The curve lives in src/blit_input_pointer.h as a pure function, like
  blit_input_identity.h, because it cannot be measured through the API in a
  gate environment at all: a fabricated node is a regular file, nothing opens
  it as a pointer, and update_evdev_pointer deliberately publishes nothing
  when no pointer is open. Issue #52's gate records the same limitation about
  sensitivity_percent.

  POST /v1/input/inject also took a logical button 0..2, which bypasses the
  map -- so the map could have been set and never exercised. It now takes an
  evdev `code` too, which goes through the device's map exactly as a real
  press does; the `key` injection already had that shape, and ADR 0064's rule
  is that an injection delivers what the device could have delivered.

  Gamepads get `deadzone_percent`, as a percentage of the axis's own reported
  range so one setting means the same thing on a 0..255 stick and a
  -32768..32767 one, and `invert_axes`. Applied to a copy of the event before
  the broadcast and to EV_ABS only: a button is not an axis, and a deadzone on
  one would silently swallow presses.

  Middle-button emulation is #71 rather than this release. It needs a deferred
  press and so a time-driven obligation in a loop that is otherwise entirely
  event-driven; the design is written down in the ticket. It is absent rather
  than present-and-off, which is the shape ADR 0064 chose for an unimplemented
  display property.

  A real bug found while gating this, and fixed: a settings write that was
  still coalescing could sit in memory indefinitely on a quiet server, because
  the loop is event-driven and nothing woke it. Found by a gate that configured
  a device, stopped talking to the server and waited for the document. The
  select wait is clamped to the remaining flush window now -- a deadline, the
  same shape the attach reassert already used -- and a write that cannot reach
  the disk says so once instead of failing in silence.

  The pointer gate asserts through GET /v1/settings rather than the document's
  path. ADR 0067 makes it a resource precisely so that where it is kept is an
  implementation detail, and the restart is what proves the bytes reached the
  disk.

  Gates: pointer_curve_gate.c pins the curve at its boundaries, its sign, its
  monotonicity, that it never brakes, and that flat is byte-for-byte what
  sensitivity_percent always did -- teeth, 5 assertions fail with adaptive
  flattened. pointer_settings_gate.rb, nine scenarios, every one measured by
  effect: the swap read off the pointer_button trace, the step counted on the
  pointer_wheel trace, a disabled button dispatching nothing -- teeth, 8 of 9
  fail with 35 individual failures, the ninth asserting the default state that
  the teeth build shares by construction.

  Suite: 56 pass, 5 skip, 0 fail.
