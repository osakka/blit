notes: >-
  Issues #13 and #1, both gaps in how the terminal parser answers a graphics
  client, both closed with conformance vectors checked against a build that
  does not have the fix.

  #13: Kitty o=z, the protocol's zlib compression, is implemented. The o key
  was never parsed, so a compressed payload was interpreted as raw pixels,
  failed the size check and was rejected. Measured against the previous
  build: f=32,s=2,v=2,o=z gave images=0 with last_error invalid-data.

  A compressed payload now stages the zlib stream against the same bound a
  PNG container uses and is inflated when the final chunk arrives. For f=24
  and f=32 the inflated length is fixed by s and v, so it is both the bound
  and an assertion: a stream that inflates to a different size is a typed
  reject rather than a resize. o=z composes with f=100, which is a deflated
  PNG: inflate, then decode. An o value other than z is a typed
  unsupported-compression reject rather than silent raw use.

  GraphicsImage gains pixel_crc32, a CRC-32 of the decoded samples. Asserting
  that two transmissions produced the same picture was not possible through
  the API before: dimensions and byte counts agree for images that differ,
  which is exactly the case a compression or placement change must be checked
  against. zlib's crc32 is already linked under ADR 0056, and the field is
  named for what it is -- a checksum for comparison, not a digest for trust.

  #6 / ADR 0059: CSI > u, CSI < u, CSI = ... u and CSI ? u are the Kitty
  keyboard protocol's flag sequences, and Blit implemented the first two as
  cursor save/restore and the last as cursor restore. Under the advertised
  TERM=xterm-kitty a client performing the standard handshake had its cursor
  dragged back to wherever it was when it enabled the protocol, and CSI ? u
  was never answered. Measured across both builds: push at row 10 col 20, move
  to row 2 col 2, pop -- the previous build reports cursor (19,9), this one
  reports (1,1).

  The sequences now mean what the protocol says and move no cursor. No
  keyboard enhancement flag is honoured, so CSI ? u answers CSI ? 0 u and no
  flag stack is kept: a stack would report a flag back and then not honour it,
  which is a worse failure than the cursor jump because it is invisible.
  Answering zero is the protocol's feedback loop working -- the client falls
  back at once rather than waiting for a reply that never came. ADR 0059
  records why honouring flag 1 is deferred: the only key encoder is
  send_evdev_key, reachable only from a physical evdev keyboard, and the build
  machine has no /dev/uinput, so the change could be written but not gated.

  Three session fields that existed only for the removed behaviour are
  deleted, and docs/terminal-engine.md stops calling the old behaviour
  Kitty-compatible in both places it said so.

  #1: XTSMGRAPHICS (CSI ? Pi ; Pa ; Pv S) was dispatched without checking the
  private-parameter prefix, so it fell through to SU and scrolled the screen
  instead of replying. That made corrupting a line of output the first thing a
  sixel-capable application did to Blit, followed by a timeout waiting for the
  answer. CSI ? Ps ; Ps T had the mirror fault and scrolled down.

  Both now answer. Item 1 reports 256 colour registers, item 2 reports 512x512
  sixel geometry, an unknown item is Ps=1 and an unknown action is Ps=2. Those
  limits are named in src/blit_graphics.h as BLIT_SIXEL_COLOR_REGISTERS and
  BLIT_SIXEL_MAX_DIMENSION and the decoder enforces the same constants, so the
  advertised limit cannot drift from the enforced one -- a client sizes its
  image to what it was told.

  Twenty-one conformance vectors. For #13: the same 2x2 image as raw, as zlib of
  the raw samples, and as zlib of the PNG container, all three asserted equal
  by pixel_crc32; an uninflatable stream, a stream inflating to the wrong size
  for the declared s and v, and an unknown o value each creating no image. For
  #1: five private-prefix forms leaving the grid byte-identical, CSI 1 S still
  scrolling, and the three reply forms asserted as exact bytes read back off
  /dev/tty. Against the pre-change build the first grid assertion fails with
  expected "AAAA1BBBB2CCCC3DDDD4", got "BBBB2CCCC3DDDD4". For #6: a push/pop
  pair and a set/deep-pop pair leaving the cursor where the motion put it,
  leaving no text on the grid, and CSI ? u answering CSI ? 0 u both before and
  after a push. Measured across both builds: push at row 10 col 20, move to row
  2 col 2, pop -- the previous build reports cursor (19,9), this one (1,1).

  One existing vector had to be inverted rather than kept: kitty-cursor-restore
  asserted the behaviour ADR 0059 removes. The full suite catching that is how
  a second defect was found. Answering the query writes CSI ? 0 u to the PTY,
  and with the tty echoing that comes straight back as input, so answering the
  parameterised CSI ? Ps u form would have answered the echo of its own answer
  without end. Only the parameterless query is answered, and a vector asserts
  that with echo deliberately left on.
