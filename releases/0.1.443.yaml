notes: >-
  ADR 0065, issue #25: a default install is no longer a remote root shell.

  The vulnerable combination was never one decision. The session API execve's
  a client-supplied command by design -- an API-driven display server whose
  purpose is presenting PTY-backed programs has to be able to start one. The
  service runs as root, because a session request may name a user to run as
  and dropping to one needs privilege. And authentication defaulted to off
  while the listener defaulted to 0.0.0.0. Put together, a default install was
  a network-reachable API that would run anything as root.

  That was confirmed on the live host rather than theorised: a /bin/sh session
  created over plain HTTP rendered a "#" prompt, and its output was readable
  back through GET /v1/surfaces/{id}/cells -- a complete
  read-write-execute loop with no credential. And it was not an operator
  mistake: the package's own postinst wrote BLIT_BIND_ADDRESS=0.0.0.0 into
  /etc/blit/blit.env and generated an update token but no API token, so the
  open posture was the shipped default.

  The listener's posture now depends on whether a network bind was asked for.
  No token and no BLIT_BIND_ADDRESS binds 127.0.0.1 and says so: a developer
  gets a working server, and nobody gets a network listener by omission. No
  token and an explicitly requested non-loopback address refuses to start,
  naming the three ways out, because that combination cannot be an accident
  worth obeying. BLIT_ALLOW_UNAUTHENTICATED_NETWORK=1 turns the refusal back
  into a warning for a fixture that genuinely has no network -- it has to be
  asked for by name, and while it holds /v1/diagnostics reports
  unauthenticated_network_listener among its warnings, so the posture is
  visible where health is read and not only in a startup line nobody
  re-reads.

  Refusing to start was considered as the only rule and rejected: on an
  API-only deployment, a host that will not come up cannot be fixed over the
  API.

  /v1/server now carries listener {bind, port, authentication,
  command_allowlist}. The posture was previously knowable only from stderr,
  which is to say not knowable by a control panel at all.

  The postinst generates a random BLIT_AUTH_TOKEN into /etc/blit/blit.env, the
  same way it already generates the update token, and appends one to an
  existing configuration that has none. On an upgrade that turns a previously
  open deployment into one whose clients get 401 until they are told the new
  token. A deliberate break, recorded rather than discovered: the
  alternatives are a host that refuses to start, or one that is knowingly
  open.

  packaging/blit-unprivileged.conf ships the unprivileged profile as a
  drop-in an operator installs, with the exact systemctl steps and the two
  reasons it is not the default. A non-root gateway refuses a session request
  that names a user, since dropping to one needs privilege, so every session
  would run as blit -- which is what a Hibr desktop wants and not what a
  per-user deployment wants. And Blit cannot know from inside a package
  whether that user can reach this host's DRM device: that depends on udev
  rules and on whether anything else holds DRM master, and a gateway that
  comes up unable to present has no way back in on an API-only deployment.
  Switching profiles is an operator action taken with access to the machine.

  Recorded rather than softened: with User=root still the default, an
  authenticated caller can run a command as root. That is the API's purpose
  and not a defect, but it means the token is a root credential and the
  allowlist and the unprivileged profile are how a deployment narrows it. An
  allowlist containing a shell, which a desktop deployment wants, is not a
  boundary.

  Gate: network_auth_gate.sh grows three postures beside the one it had.
  Teeth: restored to warn-and-continue, the default-posture case reads
  bind=0.0.0.0 authentication=none. The postinst token path was exercised
  against a staged /etc/blit -- one 64-character token line on a fresh
  install, no second line on a re-run, and a server started with that
  environment binds 0.0.0.0 with authentication required and answers 401
  without a credential.

  Suite: 47 pass, 5 skip, 0 fail.

  One check made before deploying, and the reason this was safe to ship to a
  host reachable only by API: an unauthenticated request to 192.168.10.54
  returned 401 both before and after a clean POST /v1/control/restart, so that
  host's token is persisted in its unit environment rather than set
  transiently. A fail-safe build therefore cannot strand it. 401 alone would
  not have proved that.
