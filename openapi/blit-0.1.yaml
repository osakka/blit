openapi: 3.1.0
info:
  title: blit network API
  version: 0.1.0
  description: >-
    Network control, discovery, terminal-session, display, input, and
    diagnostic API for the blit terminal and display service.
servers:
  - url: http://localhost:8080
    description: Development HTTP over TCP
  - url: https://blit.example.invalid
    description: Production HTTPS placeholder
tags:
  - name: server
  - name: hardware
  - name: topology
  - name: terminals
  - name: frames
  - name: effects
  - name: diagnostics
  - name: control
paths:
  /v1/server:
    get:
      tags: [server]
      operationId: getServerDetails
      summary: Get server identity and capabilities
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetails'
        default:
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      tags: [diagnostics]
      operationId: getVersion
      summary: Get the running Blit and API versions
      responses:
        '200':
          description: Version identity
          content:
            application/json:
              schema:
                type: object
                required: [server_version, api_version]
                properties:
                  server_version: {type: string}
                  api_version: {type: string}
                additionalProperties: false
        default:
          $ref: '#/components/responses/Problem'
  /v1/fonts:
    get:
      tags: [terminals]
      operationId: getFontProfiles
      summary: List selectable fonts and the active logical cell size
      responses:
        '200':
          description: Active font configuration and installed profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontProfiles'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [terminals]
      operationId: replaceFontConfiguration
      summary: Select a font profile and/or logical font scale
      description: >-
        Blit recomputes pane geometry and resizes attached PTYs. Hibr is not
        modified. Scale is bounded to 1 through 3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FontConfiguration'
      responses:
        '200':
          description: Applied font configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontProfiles'
        default:
          $ref: '#/components/responses/Problem'
  /v1/graphics:
    get:
      tags: [hardware]
      operationId: listGraphicsCards
      summary: List graphics cards and render capabilities
      responses:
        '200':
          description: Graphics inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, graphics_cards]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  graphics_cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphicsCard'
        default:
          $ref: '#/components/responses/Problem'
  /v1/displays:
    get:
      tags: [hardware]
      operationId: listDisplays
      summary: List displays, modes, and presentation state
      responses:
        '200':
          description: Display inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, displays]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  displays:
                    type: array
                    items:
                      $ref: '#/components/schemas/Display'
        default:
          $ref: '#/components/responses/Problem'
  /v1/audio:
    get:
      tags: [hardware]
      operationId: listAudioDevices
      summary: List audio devices and capabilities
      responses:
        '200':
          description: Audio inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, devices]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudioDevice'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics:
    get:
      tags: [diagnostics]
      operationId: getDiagnostics
      summary: Get current backend, resource, render, and input diagnostics
      responses:
        '200':
          description: Current diagnostic snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics/runtime:
    get:
      tags: [diagnostics]
      operationId: getRuntimeDiagnostics
      summary: Get diagnostics, performance counters, and bounded runtime logs
      responses:
        '200':
          description: Current diagnostic snapshot and recent runtime events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDiagnostics'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics/trace:
    get:
      tags: [diagnostics]
      operationId: getDiagnosticTrace
      summary: Get the bounded input, surface, and render-path trace
      parameters:
        - in: query
          name: kind
          required: false
          description: Return only events of this kind when supplied.
          schema:
            type: string
            enum: [pointer_button, pointer_motion, keyboard_key, surface_update, render_path]
        - in: query
          name: limit
          required: false
          description: Maximum number of newest matching events to return; defaults to 32 and is capped at 128.
          schema:
            type: integer
            minimum: 1
            maximum: 128
            default: 32
      responses:
        '200':
          description: Recent trace events in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [revision, events]
                properties:
                  revision: {type: integer, minimum: 0}
                  events:
                    type: array
                    items:
                      type: object
                      required: [sequence, time_us, kind, detail]
                      properties:
                        sequence: {type: integer, minimum: 1}
                        time_us: {type: integer, minimum: 0}
                        kind: {type: string}
                        detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics/screenshots/{display_id}:
    get:
      tags: [diagnostics]
      operationId: captureDisplayScreenshot
      summary: Capture the current framebuffer for one display
      parameters:
        - $ref: '#/components/parameters/DisplayId'
        - in: query
          name: cached
          required: false
          description: >-
            Observe the already-composed scene without forcing a full redraw.
            Omit this parameter when a deliberate fresh scene rebuild is
            required.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: >-
            Current SDL3 or direct-KMS framebuffer encoded as a BMP image.
            Direct-KMS captures are 32-bit bottom-up BMP images. The response
            carries the state identity the pixels correspond to, sampled at
            the moment the framebuffer is read, so a client can tell a
            rendering fault from a capture whose surface moved underneath it.
          headers:
            X-Blit-Capture-Frame:
              description: Frame counter at the moment the framebuffer was read.
              schema: {type: integer, minimum: 0}
            X-Blit-Capture-Revisions:
              description: >-
                Comma-separated surface-id=revision pairs for every live
                surface, sampled with the pixels. A comparison against a
                surface snapshot is only meaningful while these still match.
              schema: {type: string}
          content:
            image/bmp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update:
    put:
      tags: [control]
      operationId: uploadUpdatePackage
      summary: Upload, verify, install, and restart from a Blit Debian package
      parameters:
        - in: header
          name: X-Blit-Update-Token
          required: true
          schema: {type: string, minLength: 1}
        - in: header
          name: X-Blit-SHA256
          required: true
          schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      requestBody:
        required: true
        content:
          application/vnd.debian.binary-package:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Package installed and restart accepted
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: restarting}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update/status:
    get:
      tags: [control]
      operationId: getUpdateStatus
      summary: Get package update state and transfer progress
      responses:
        '200':
          description: Current update state
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string}
                  detail: {type: string}
                  upload:
                    $ref: '#/components/schemas/UpdateUpload'
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update/cancel:
    post:
      tags: [control]
      operationId: cancelUpdateUpload
      summary: Cancel an in-progress package upload
      parameters:
        - in: header
          name: X-Blit-Update-Token
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '202':
          description: Package upload cancelled
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: cancelled}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update/reset:
    post:
      tags: [control]
      operationId: resetUpdateState
      summary: Clear a failed update state when no upload is active
      parameters:
        - in: header
          name: X-Blit-Update-Token
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '202':
          description: Update state reset and ready for a new upload
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: ready}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/shutdown:
    post:
      tags: [control]
      operationId: requestShutdown
      summary: Stop Blit and cleanly release its child processes and outputs
      description: >-
        Accepts an asynchronous shutdown request. The response is sent before
        the event loop exits; the process then terminates PTY process groups,
        destroys SDL/KMS outputs, and exits. Authentication applies when the
        server has BLIT_AUTH_TOKEN configured.
      responses:
        '202':
          description: Shutdown accepted
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: stopping}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/restart:
    post:
      tags: [control]
      operationId: restartServer
      summary: Request an orderly in-process server restart
      responses:
        '202':
          description: Restart accepted
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: restarting}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/effects:
    get:
      tags: [effects]
      operationId: getEffects
      summary: Get the bounded renderer effect state
      responses:
        '200':
          description: Current effect state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectState'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [effects]
      operationId: updateEffects
      summary: Set the bounded renderer effect state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffectUpdate'
      responses:
        '200':
          description: Updated effect state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectState'
        default:
          $ref: '#/components/responses/Problem'
  /v1/overlays:
    get:
      tags: [effects]
      operationId: listOverlays
      summary: List bounded graphic overlays
      responses:
        '200':
          description: Current overlays
          content:
            application/json:
              schema:
                type: object
                required: [revision, backend, overlays]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  backend:
                    type: string
                    enum: [sdl3, drm-kms, unavailable]
                  overlays:
                    type: array
                    items: {$ref: '#/components/schemas/Overlay'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [effects]
      operationId: createOverlay
      summary: Create a bounded solid-color graphic overlay
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverlay'
      responses:
        '201':
          description: Created overlay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overlay'}
        default:
          $ref: '#/components/responses/Problem'
  /v1/overlays/{overlay_id}:
    parameters:
      - name: overlay_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    delete:
      tags: [effects]
      operationId: deleteOverlay
      summary: Delete a graphic overlay
      responses:
        '204': {description: Overlay deleted}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/devices:
    get:
      tags: [hardware]
      operationId: listInputDevices
      summary: List keyboard, pointer, and other input devices
      responses:
        '200':
          description: Input inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, devices]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/InputDevice'
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/inject:
    post:
      tags: [hardware]
      operationId: injectPointerInput
      summary: Inject a deterministic pointer event through the normal input path
      description: >-
        Test and API clients may inject pointer motion, button, or wheel events.
        The event is routed and rendered by the same canonical path as evdev;
        this endpoint is explicitly synthetic and does not emulate a physical
        device descriptor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectedPointerEvent'
      responses:
        '202':
          description: Event accepted for routing and presentation
          content:
            application/json:
              schema:
                type: object
                required: [accepted, kind]
                properties:
                  accepted: {type: boolean}
                  kind: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/routes:
    get:
      tags: [hardware]
      operationId: listInputRoutes
      summary: List configured input routes
      responses:
        '200':
          description: Input-route inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, routes]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  routes:
                    type: array
                    items: {$ref: '#/components/schemas/InputRoute'}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/routes/{route_id}:
    parameters:
      - name: route_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    put:
      tags: [hardware]
      operationId: replaceInputRoute
      summary: Bind an input device source to a terminal session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInputRoute'
      responses:
        '200':
          description: Updated input routes
          content:
            application/json:
              schema:
                type: object
                required: [revision, routes]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  routes:
                    type: array
                    items: {$ref: '#/components/schemas/InputRoute'}
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [hardware]
      operationId: deleteInputRoute
      summary: Remove an input-device route
      responses:
        '204':
          description: Input route deleted
        default:
          $ref: '#/components/responses/Problem'
  /v1/topology:
    get:
      tags: [topology]
      operationId: getTopology
      summary: Get the logical multi-display topology
      responses:
        '200':
          description: Current topology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [topology]
      operationId: replaceTopology
      summary: Replace the desired display topology
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopologyUpdate'
      responses:
        '200':
          description: Applied topology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions:
    post:
      tags: [terminals]
      operationId: createTerminalSession
      summary: Create a PTY-backed terminal session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerminalSession'
      responses:
        '201':
          description: Created terminal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        '403':
          description: The executable is not permitted by the server policy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >-
            The request would create a duplicate Hibr primary or an orphan
            `--join` client.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [terminals]
      operationId: getTerminalSession
      summary: Get terminal-session state
      responses:
        '200':
          description: Terminal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [terminals]
      operationId: updateTerminalSession
      summary: Update terminal placement and input policy
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTerminalSession'
      responses:
        '200':
          description: Updated terminal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [terminals]
      operationId: deleteTerminalSession
      summary: Stop and release a terminal session and its surface
      responses:
        '204':
          description: Terminal session released
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions/{session_id}/input:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [terminals]
      operationId: sendTerminalInput
      summary: Send bounded raw or bracketed-paste input to a terminal PTY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalInput'
      responses:
        '202':
          description: Input accepted by the PTY write path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalInputReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions/{session_id}/hibr-owner:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [terminals]
      operationId: registerHibrOwner
      summary: Register the Blit-owned Hibr process for geometry reassertion
      description: >-
        Internal adapter handshake. The Blit-launched Hibr adapter submits its
        live PID and the per-session token supplied in its environment. Blit
        validates the token and uses the registered process, plus its bounded
        descendants, as the sole resize/signalling target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HibrOwnerRegistration'
      responses:
        '202':
          description: Hibr owner accepted for resize reassertion
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: registered}
                  detail: {type: string}
                additionalProperties: false
        default:
          $ref: '#/components/responses/Problem'
  /v1/surfaces/{surface_id}/cells:
    parameters:
      - $ref: '#/components/parameters/SurfaceId'
    put:
      tags: [terminals]
      operationId: replaceSurfaceCells
      summary: Apply a revisioned text-cell update
      description: >-
        Applies cells and, if present, cursor state, then advances the
        surface revision by one. The revision advances for every accepted
        request, including a deferred chunk and a request whose cells are
        identical to the cells they replace, so a client is responsible for
        not sending writes that change nothing (ADR 0058). `cells` may be
        empty when `cursor` is present: a cursor move with no cell change is
        a legitimate update. A request whose `base_revision` does not match
        the surface is a 409 with the current revision.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellUpdate'
      responses:
        '200':
          description: Accepted surface revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationReceipt'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [terminals]
      operationId: getSurfaceSnapshot
      summary: Read the current revisioned surface snapshot
      responses:
        '200':
          description: Current text surface state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurfaceSnapshot'
        default:
          $ref: '#/components/responses/Problem'
  /v1/surfaces/{surface_id}/summary:
    parameters:
      - $ref: '#/components/parameters/SurfaceId'
    get:
      tags: [terminals]
      operationId: getSurfaceSummary
      summary: Read compact revision and rendering state for a surface
      description: >-
        Returns bounded diagnostic state without transferring the full cell
        snapshot. Use the cells endpoint for authoritative repair.
      responses:
        '200':
          description: Compact current surface state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurfaceSummary'
        default:
          $ref: '#/components/responses/Problem'
  /v1/surfaces/{surface_id}/scrollback:
    parameters:
      - $ref: '#/components/parameters/SurfaceId'
    get:
      tags: [terminals]
      operationId: getSurfaceScrollback
      summary: Read retained main-screen scrollback lines
      description: >-
        Returns oldest-first lines retained when the main screen scrolls.
        Alternate-screen output is never retained. `view` is the number of
        retained lines viewed back from the live screen; PATCH changes it and
        the same historical view is rendered on the display.
      responses:
        '200':
          description: Retained scrollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollbackSnapshot'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [terminals]
      operationId: setSurfaceScrollbackView
      summary: Set the retained terminal view position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view]
              properties:
                view: {type: integer, minimum: 0, maximum: 1000}
              additionalProperties: false
      responses:
        '200':
          description: Updated scrollback view and retained lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollbackSnapshot'
        default:
          $ref: '#/components/responses/Problem'
  /v1/frames:
    post:
      tags: [frames]
      operationId: presentFrame
      summary: Request presentation of a coherent frame
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameRequest'
      responses:
        '202':
          description: Frame accepted for presentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v1/stream:
    get:
      tags: [diagnostics]
      operationId: openEventStream
      parameters:
        - name: since
          in: query
          required: false
          description: Replay retained broadcast events after this sequence.
          schema: {$ref: '#/components/schemas/Revision'}
      summary: Open the bidirectional blit WebSocket stream
      description: >-
        Clients upgrade this HTTP request to WebSocket. Stream messages use
        the schemas declared in x-blit-stream and components.schemas.
      responses:
        '101':
          description: WebSocket upgrade accepted
        default:
          $ref: '#/components/responses/Problem'
      x-blit-stream:
        protocol: websocket
        direction: bidirectional
        messages:
          - $ref: '#/components/schemas/StreamSubscribe'
          - $ref: '#/components/schemas/StreamInputEvent'
          - $ref: '#/components/schemas/StreamTerminalOutput'
          - $ref: '#/components/schemas/StreamSurfaceDelta'
          - $ref: '#/components/schemas/StreamFrameEvent'
          - $ref: '#/components/schemas/StreamPixelFrameBegin'
          - description: >-
              After pixel_frame_begin is accepted, the client sends one or
              more masked binary WebSocket messages containing tightly packed
              RGB or RGBA pixels. The final message completes the frame.
          - $ref: '#/components/schemas/StreamDiagnosticEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Required when the server is configured with BLIT_AUTH_TOKEN.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Optional expected current resource revision. When supplied, a stale value is rejected with 409.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    SurfaceId:
      name: surface_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
  responses:
    Problem:
      description: Typed API or hardware failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UpdateUpload:
      type: object
      required: [active, received_bytes, expected_bytes]
      properties:
        active: {type: boolean}
        received_bytes: {type: integer, minimum: 0}
        expected_bytes: {type: integer, minimum: 0}
      additionalProperties: false
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
    Revision:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Monotonic counter identifying a resource's state. For a surface it
        counts accepted writes, not observed changes: one accepted cell
        request advances it by exactly one whatever `presentation` was and
        whether or not the cells carried differ from the cells they replace.
        A client that wants the revision to track visible change must not
        send writes that change nothing. See ADR 0058.
    Bounds:
      type: object
      required: [x, y, width, height]
      properties:
        x: {type: integer}
        y: {type: integer}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
      additionalProperties: false
    FontProfile:
      type: object
      required: [id, path, available]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        path: {type: string}
        available: {type: boolean}
      additionalProperties: false
    FontConfiguration:
      type: object
      minProperties: 1
      properties:
        font_id: {$ref: '#/components/schemas/ResourceId'}
        scale: {type: integer, minimum: 1, maximum: 3}
      additionalProperties: false
    FontProfiles:
      type: object
      required: [revision, active, profiles]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        active:
          type: object
          required: [id, path, scale, cell_pixels]
          properties:
            id: {$ref: '#/components/schemas/ResourceId'}
            path: {type: string}
            scale: {type: integer, minimum: 1, maximum: 3}
            cell_pixels:
              type: object
              required: [width, height]
              properties:
                width: {type: integer, minimum: 1}
                height: {type: integer, minimum: 1}
              additionalProperties: false
          additionalProperties: false
        profiles:
          type: array
          items: {$ref: '#/components/schemas/FontProfile'}
      additionalProperties: false
    ServerDetails:
      type: object
      required: [id, name, api_version, revision, capabilities, display_count, display_backend, resources]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
        api_version: {type: string, const: '0.1'}
        revision: {$ref: '#/components/schemas/Revision'}
        capabilities:
          type: array
          items: {type: string}
        display_count: {type: integer, minimum: 0}
        display_backend:
          type: object
          required: [name, ready, error]
          properties:
            name: {type: string, enum: [drm-kms, sdl3, unavailable]}
            ready: {type: boolean}
            error: {type: string}
          additionalProperties: false
        resources:
          type: object
          required: [graphics, displays, audio, input_devices, input_routes, topology, fonts, diagnostics, runtime_diagnostics]
          properties:
            graphics: {type: string}
            displays: {type: string}
            audio: {type: string}
            input_devices: {type: string}
            input_routes: {type: string}
            topology: {type: string}
            fonts: {type: string}
            diagnostics: {type: string}
            runtime_diagnostics: {type: string}
          additionalProperties: false
      additionalProperties: false
    GraphicsCard:
      type: object
      required: [id, vendor, device, render_apis, formats]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        vendor: {type: string}
        device: {type: string}
        render_apis:
          type: array
          items: {type: string}
        formats:
          type: array
          items: {type: string}
        capabilities:
          type: object
          additionalProperties: {type: [string, number, boolean]}
      additionalProperties: false
    DisplayMode:
      type: object
      required: [width, height, refresh_hz]
      properties:
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        refresh_hz: {type: number, exclusiveMinimum: 0}
      additionalProperties: false
    Display:
      type: object
      required: [id, name, bounds, modes, presentation_state]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
        bounds: {$ref: '#/components/schemas/Bounds'}
        modes:
          type: array
          items: {$ref: '#/components/schemas/DisplayMode'}
        active_mode: {$ref: '#/components/schemas/DisplayMode'}
        presentation_state:
          type: string
          enum: [available, unavailable, presenting, recovering, failed]
      additionalProperties: false
    AudioDevice:
      type: object
      required: [id, name, direction, formats]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
        direction:
          type: string
          enum: [playback, capture, duplex]
        formats:
          type: array
          items: {type: string}
        channels: {type: integer, minimum: 1}
        sample_rates:
          type: array
          items: {type: integer, minimum: 1}
      additionalProperties: false
    Diagnostics:
      type: object
      required: [revision, health, resources, render, errors, warnings]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        health:
          type: object
          required: [ready, backend, error]
          properties:
            ready: {type: boolean}
            backend: {type: string, enum: [drm-kms, sdl3, unavailable]}
            error: {type: string}
          additionalProperties: false
        resources:
          type: object
          required: [displays, outputs, sessions, surfaces, streams, input_routes, keyboards, pointers, gamepads]
          properties:
            displays: {type: integer, minimum: 0}
            outputs: {type: integer, minimum: 0}
            sessions: {type: integer, minimum: 0}
            surfaces: {type: integer, minimum: 0}
            streams: {type: integer, minimum: 0}
            input_routes: {type: integer, minimum: 0}
            keyboards: {type: integer, minimum: 0}
            pointers: {type: integer, minimum: 0}
            gamepads: {type: integer, minimum: 0}
          additionalProperties: false
        render:
          type: object
          required: [pending, interval_ms, effective_interval_ms, mode, outputs, font_scale, direct_kms, renderer, presentation_sync, pointer]
          properties:
            pending: {type: boolean}
            interval_ms: {type: integer, minimum: 1}
            effective_interval_ms: {type: integer, minimum: 1}
            mode: {type: string, enum: [refresh-aware]}
            outputs:
              type: array
              items:
                type: object
                required: [display_id, refresh_hz, refresh_source, effective_interval_ms, target_interval_us, target_interval_ms, missed_deadlines, last_present_ms, max_present_ms, present_calls, render_width, render_height]
                properties:
                  display_id: {type: string}
                  refresh_hz: {type: number, minimum: 1}
                  refresh_source: {type: string, enum: [display-mode, test-override]}
                  effective_interval_ms: {type: integer, minimum: 1}
                  target_interval_us: {type: integer, minimum: 1}
                  target_interval_ms: {type: number, minimum: 0}
                  missed_deadlines: {type: integer, minimum: 0}
                  last_present_ms: {type: number, minimum: 0}
                  max_present_ms: {type: number, minimum: 0}
                  present_calls: {type: integer, minimum: 0}
                  render_width: {type: integer, minimum: 0}
                  render_height: {type: integer, minimum: 0}
                additionalProperties: false
            font_scale: {type: integer, minimum: 1}
            direct_kms: {type: boolean}
            renderer: {type: string}
            presentation_sync:
              type: string
              enum: [drm-page-flip, drm-page-flip-async, sdl-vsync, scheduler-only]
            pointer:
              type: object
              description: >-
                Compositor pointer state used to correlate pointer trails or
                stale damage with the captured framebuffer.
              required: [valid, x, y, output, previous_x, previous_y, previous_output, dirty]
              properties:
                valid: {type: boolean}
                x: {type: number}
                y: {type: number}
                output: {type: integer}
                previous_x: {type: number}
                previous_y: {type: number}
                previous_output: {type: integer}
                dirty: {type: boolean}
              additionalProperties: false
          additionalProperties: false
        errors:
          type: array
          items: {type: string}
        warnings:
          type: array
          items: {type: string}
      additionalProperties: false
    RuntimeDiagnostics:
      type: object
      required: [snapshot, performance, logs]
      properties:
        snapshot: {$ref: '#/components/schemas/Diagnostics'}
        performance:
          type: object
          required: [uptime_ms, frames, last_frame_gap_ms, max_frame_gap_ms, last_render_ms, max_render_ms, missed_deadlines, frame_rate_max_render_ms, frame_rate_missed_deadlines, frame_rate_window_sequence, last_terminal_ms, max_terminal_ms, terminal_bytes, pointer_cache_hits, pointer_cache_misses, frame_rate_hz, input_events, last_input_dispatch_ms, max_input_dispatch_ms, evdev_mouse_events, evdev_mouse_syncs, evdev_mouse_motion_events, evdev_mouse_wheel_events, evdev_mouse_button_events, evdev_mouse_button_repeats_ignored, evdev_mouse_button_state_coalesced, last_evdev_mouse_event_age_ms, last_evdev_mouse_path, evdev_mouse_devices, evdev_keyboard_events, evdev_keyboard_key_presses, evdev_keyboard_keys_delivered, evdev_keyboard_keys_undelivered, last_evdev_keyboard_event_age_ms, last_evdev_keyboard_path, evdev_keyboard_devices, sdl_mouse_events_discarded, sdl_mouse_events_processed, sdl_mouse_motion_events, sdl_mouse_button_events, sdl_mouse_fallback_events, stream_queue_bytes, stream_queue_peak_bytes, stream_dropped_events, stream_backpressure_disconnects, graphics_cache_hits, graphics_texture_uploads, last_graphics_upload_ms, max_graphics_upload_ms, background_batches, background_quads, pixel_frames_accepted, pixel_frame_errors, pixel_frames_pending, frame_rate_frames, frame_rate_window_ms, frame_rate_age_ms, loop_iterations, terminal_reads, surface_commits, surface_commit_hz, surface_commit_frames, surface_commit_window_ms, surface_commit_window_sequence, surface_commit_age_ms, last_surface_commit_gap_ms, max_surface_commit_gap_ms, frame_commits, present_calls, last_loop_gap_ms, max_loop_gap_ms, loop_gap_window_ms, loop_gap_window_sequence, loop_gap_window_max_ms, last_kms_present_ms, max_kms_present_ms, last_select_ms, max_select_ms, last_sdl_events_ms, max_sdl_events_ms, last_evdev_scan_ms, max_evdev_scan_ms]
          properties:
            uptime_ms: {type: integer, minimum: 0}
            frames: {type: integer, minimum: 0}
            last_frame_gap_ms: {type: number, minimum: 0}
            max_frame_gap_ms: {type: number, minimum: 0}
            last_render_ms: {type: number, minimum: 0}
            max_render_ms: {type: number, minimum: 0}
            missed_deadlines: {type: integer, minimum: 0}
            frame_rate_max_render_ms: {type: number, minimum: 0}
            frame_rate_missed_deadlines: {type: integer, minimum: 0}
            frame_rate_window_sequence: {type: integer, minimum: 0}
            last_terminal_ms: {type: number, minimum: 0}
            max_terminal_ms: {type: number, minimum: 0}
            terminal_bytes: {type: integer, minimum: 0}
            pointer_cache_hits: {type: integer, minimum: 0}
            pointer_cache_misses: {type: integer, minimum: 0}
            frame_rate_hz: {type: number, minimum: 0}
            input_events: {type: integer, minimum: 0}
            last_input_dispatch_ms: {type: number, minimum: 0}
            max_input_dispatch_ms: {type: number, minimum: 0}
            evdev_mouse_events: {type: integer, minimum: 0}
            evdev_mouse_syncs: {type: integer, minimum: 0}
            evdev_mouse_motion_events: {type: integer, minimum: 0}
            evdev_mouse_wheel_events: {type: integer, minimum: 0}
            evdev_mouse_button_events: {type: integer, minimum: 0}
            evdev_mouse_button_repeats_ignored: {type: integer, minimum: 0}
            evdev_mouse_button_state_coalesced: {type: integer, minimum: 0}
            last_evdev_mouse_event_age_ms: {type: integer, minimum: 0}
            last_evdev_mouse_path: {type: string}
            evdev_mouse_devices:
              type: array
              items:
                type: object
                required: [path, fd, events, syncs, motion, wheel, buttons]
                properties:
                  path: {type: string}
                  fd: {type: integer}
                  events: {type: integer, minimum: 0}
                  syncs: {type: integer, minimum: 0}
                  motion: {type: integer, minimum: 0}
                  wheel: {type: integer, minimum: 0}
                  buttons: {type: integer, minimum: 0}
                additionalProperties: false
            evdev_keyboard_events: {type: integer, minimum: 0}
            evdev_keyboard_key_presses: {type: integer, minimum: 0}
            evdev_keyboard_keys_delivered: {type: integer, minimum: 0}
            evdev_keyboard_keys_undelivered: {type: integer, minimum: 0}
            last_evdev_keyboard_event_age_ms: {type: integer, minimum: 0}
            last_evdev_keyboard_path: {type: string}
            evdev_keyboard_devices:
              type: array
              items:
                type: object
                required: [path, fd, events, keys]
                properties:
                  path: {type: string}
                  fd: {type: integer}
                  events: {type: integer, minimum: 0}
                  keys: {type: integer, minimum: 0}
                additionalProperties: false
            sdl_mouse_events_discarded: {type: integer, minimum: 0}
            sdl_mouse_events_processed: {type: integer, minimum: 0}
            sdl_mouse_motion_events: {type: integer, minimum: 0}
            sdl_mouse_button_events: {type: integer, minimum: 0}
            sdl_mouse_fallback_events: {type: integer, minimum: 0}
            stream_queue_bytes: {type: integer, minimum: 0}
            stream_queue_peak_bytes: {type: integer, minimum: 0}
            stream_dropped_events: {type: integer, minimum: 0}
            stream_backpressure_disconnects: {type: integer, minimum: 0}
            graphics_cache_hits: {type: integer, minimum: 0}
            graphics_texture_uploads: {type: integer, minimum: 0}
            last_graphics_upload_ms: {type: number, minimum: 0}
            max_graphics_upload_ms: {type: number, minimum: 0}
            background_batches: {type: integer, minimum: 0}
            background_quads: {type: integer, minimum: 0}
            pixel_frames_accepted: {type: integer, minimum: 0}
            pixel_frame_errors: {type: integer, minimum: 0}
            pixel_frames_pending: {type: integer, minimum: 0}
            frame_rate_frames: {type: integer, minimum: 0}
            frame_rate_window_ms: {type: integer, minimum: 0}
            frame_rate_age_ms: {type: integer, minimum: 0}
            loop_iterations: {type: integer, minimum: 0}
            terminal_reads: {type: integer, minimum: 0}
            surface_commits: {type: integer, minimum: 0}
            surface_commit_hz: {type: number, minimum: 0}
            surface_commit_frames: {type: integer, minimum: 0}
            surface_commit_window_ms: {type: integer, minimum: 0}
            surface_commit_window_sequence: {type: integer, minimum: 0}
            surface_commit_age_ms: {type: integer, minimum: 0}
            last_surface_commit_gap_ms: {type: number, minimum: 0}
            max_surface_commit_gap_ms: {type: number, minimum: 0}
            frame_commits: {type: integer, minimum: 0}
            present_calls: {type: integer, minimum: 0}
            last_loop_gap_ms: {type: number, minimum: 0}
            max_loop_gap_ms: {type: number, minimum: 0}
            loop_gap_window_ms: {type: integer, minimum: 0}
            loop_gap_window_sequence: {type: integer, minimum: 0}
            loop_gap_window_max_ms: {type: number, minimum: 0}
            last_kms_present_ms: {type: number, minimum: 0}
            max_kms_present_ms: {type: number, minimum: 0}
            last_sdl_present_ms: {type: number, minimum: 0}
            max_sdl_present_ms: {type: number, minimum: 0}
            last_select_ms: {type: number, minimum: 0}
            max_select_ms: {type: number, minimum: 0}
            last_sdl_events_ms: {type: number, minimum: 0}
            max_sdl_events_ms: {type: number, minimum: 0}
            last_evdev_scan_ms: {type: number, minimum: 0}
            max_evdev_scan_ms: {type: number, minimum: 0}
          additionalProperties: false
        logs:
          type: array
          items:
            type: object
            required: [sequence, severity, code, detail]
            properties:
              sequence: {type: integer, minimum: 1}
              severity: {type: string, enum: [info, warning, error]}
              code: {type: string}
              detail: {type: string}
            additionalProperties: false
      additionalProperties: false
    EffectState:
      type: object
      required: [revision, enabled, preset, intensity, backend]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        enabled: {type: boolean}
        preset:
          type: string
          enum: [none, scanlines]
        intensity: {type: integer, minimum: 0, maximum: 100}
        backend:
          type: string
          enum: [sdl3, drm-kms, unavailable]
      additionalProperties: false
    EffectUpdate:
      type: object
      required: [revision, enabled, preset, intensity]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        enabled: {type: boolean}
        preset:
          type: string
          enum: [none, scanlines]
        intensity: {type: integer, minimum: 0, maximum: 100}
      additionalProperties: false
    Overlay:
      type: object
      required: [id, revision, display_id, bounds, color, opacity]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        display_id: {$ref: '#/components/schemas/ResourceId'}
        bounds: {$ref: '#/components/schemas/Bounds'}
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        opacity: {type: integer, minimum: 0, maximum: 100}
      additionalProperties: false
    CreateOverlay:
      type: object
      required: [display_id, x, y, width, height, color, opacity]
      properties:
        display_id: {$ref: '#/components/schemas/ResourceId'}
        x: {type: integer}
        y: {type: integer}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        opacity: {type: integer, minimum: 0, maximum: 100}
      additionalProperties: false
    InputDevice:
      type: object
      required: [id, name, kinds, route_ids, capabilities]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
        kinds:
          type: array
          items:
            type: string
            enum: [keyboard, pointer, touch, gamepad, other]
        route_ids:
          type: array
          description: >-
            Canonical input-route identities accepted by UpdateInputRoute for
            this physical source. All discovered sources of a kind feed the
            corresponding aggregate route; no discovered source is ignored.
          items:
            type: string
            enum: [evdev-keyboard, evdev-pointer, evdev-gamepad]
        capabilities:
          type: array
          items: {type: string}
      additionalProperties: false
    InjectedPointerEvent:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [pointer_motion, pointer_button, pointer_wheel]
        x: {type: integer, description: Absolute virtual-desktop X coordinate.}
        y: {type: integer, description: Absolute virtual-desktop Y coordinate.}
        button: {type: integer, minimum: 0, maximum: 2}
        pressed: {type: boolean}
        delta: {type: integer, description: Wheel direction and magnitude.}
      additionalProperties: false
    UpdateInputRoute:
      type: object
      required: [device_id, target_session_id, enabled]
      properties:
        device_id:
          type: string
          enum: [evdev-keyboard, evdev-pointer, evdev-gamepad]
        target_session_id: {$ref: '#/components/schemas/ResourceId'}
        enabled: {type: boolean}
      additionalProperties: false
    InputRoute:
      type: object
      required: [id, device_id, target_session_id, enabled]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        device_id:
          type: string
          enum: [evdev-keyboard, evdev-pointer, evdev-gamepad]
        target_session_id: {$ref: '#/components/schemas/ResourceId'}
        enabled: {type: boolean}
      additionalProperties: false
    Topology:
      type: object
      required: [id, revision, layout, outputs, panes]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        layout:
          type: object
          required: [columns, rows]
          properties:
            columns: {type: integer, minimum: 1, maximum: 2}
            rows: {type: integer, minimum: 1, maximum: 2}
          additionalProperties: false
        outputs:
          type: array
          items:
            type: object
            required: [display_id, bounds]
            properties:
              display_id: {$ref: '#/components/schemas/ResourceId'}
              bounds: {$ref: '#/components/schemas/Bounds'}
              rotation: {type: integer, enum: [0, 90, 180, 270]}
              scale: {type: number, exclusiveMinimum: 0}
            additionalProperties: false
        panes:
          type: array
          items:
            $ref: '#/components/schemas/Pane'
      additionalProperties: false
    TopologyUpdate:
      type: object
      required: [layout]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        layout:
          type: object
          required: [columns, rows]
          properties:
            columns: {type: integer, minimum: 1, maximum: 2}
            rows: {type: integer, minimum: 1, maximum: 2}
          additionalProperties: false
        placements:
          type: array
          description: Complete logical placement for every discovered display. Gaps are represented by coordinate differences.
          items:
            $ref: '#/components/schemas/OutputPlacement'
      additionalProperties: false
    OutputPlacement:
      type: object
      required: [display_id, x, y]
      properties:
        display_id: {$ref: '#/components/schemas/ResourceId'}
        x: {type: integer}
        y: {type: integer}
      additionalProperties: false
    Pane:
      type: object
      required: [id, display_id, bounds, surface_id]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        display_id: {$ref: '#/components/schemas/ResourceId'}
        bounds: {$ref: '#/components/schemas/Bounds'}
        surface_id:
          oneOf:
            - {$ref: '#/components/schemas/ResourceId'}
            - {type: 'null'}
      additionalProperties: false
    CreateTerminalSession:
      type: object
      required: [command]
      properties:
        command: {type: string, minLength: 1}
        user:
          type: string
          minLength: 1
          description: >-
            Optional local account identity for the child process. When Blit
            runs as root, the child is initialized with that account's
            supplementary groups, uid, gid, HOME, USER, and LOGNAME before
            exec. Omitting this field preserves the service identity.
        arguments:
          type: array
          items: {type: string}
        environment:
          type: object
          additionalProperties: {type: string}
        surface:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
          description: >-
            Optional when pane_id or display_id is supplied. In that case Blit
            derives the complete logical cell geometry from the authoritative
            pane or physical display bounds. Supplying surface explicitly is
            required for an unplaced session.
        display_id: {$ref: '#/components/schemas/ResourceId'}
        pane_id: {$ref: '#/components/schemas/ResourceId'}
        surface_mode:
          type: string
          enum: [terminal, external, mirror]
          default: terminal
          description: >-
            terminal lets Blit parse ordinary PTY output into the surface.
            external keeps the PTY for lifecycle and input while an adapter
            owns all surface mutations and revisions. mirror lets Blit parse
            a joined Hibr/hold stream copied from a primary desktop.
      additionalProperties: false
    TerminalInput:
      type: object
      required: [data]
      properties:
        data:
          type: string
          minLength: 1
          maxLength: 768
          description: >-
            UTF-8 text or terminal escape bytes to write to the PTY. JSON
            string escapes, including Unicode escapes such as \u001b, are
            decoded before the bounded PTY write.
        mode:
          type: string
          enum: [raw, paste]
          default: raw
          description: >-
            paste wraps data in bracketed-paste delimiters when the session has
            enabled DEC mode 2004; raw writes data unchanged.
      additionalProperties: false
    TerminalInputReceipt:
      type: object
      required: [session_id, bytes_requested, bytes_written, mode]
      properties:
        session_id: {$ref: '#/components/schemas/ResourceId'}
        bytes_requested: {type: integer, minimum: 1}
        bytes_written: {type: integer, minimum: 1}
        mode: {type: string, enum: [raw, paste, paste-fallback]}
      additionalProperties: false
    UpdateTerminalSession:
      type: object
      properties:
        display_id: {$ref: '#/components/schemas/ResourceId'}
        pane_id: {$ref: '#/components/schemas/ResourceId'}
        surface:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
        input_route:
          description: Bind this session to an existing input-route resource.
          $ref: '#/components/schemas/ResourceId'
        focused:
          type: boolean
          description: Make this session the keyboard-focus target; a primary-button click also focuses its pane.
      additionalProperties: false
    TerminalSession:
      type: object
      required: [id, revision, surface_revision, state, surface_id, title,
                 terminal_capabilities, hibr_attachment, hibr_desktop]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        surface_revision: {$ref: '#/components/schemas/Revision'}
        state:
          type: string
          enum: [starting, running, stopped, failed]
        surface_id: {$ref: '#/components/schemas/ResourceId'}
        title:
          type: string
          description: >-
            Current terminal title from OSC 0, OSC 1, or OSC 2. Empty until
            the PTY emits a title control.
        clipboard:
          type: string
          description: >-
            Most recent OSC 52 clipboard payload in Hibr's canonical
            selection;base64 form. Empty until the PTY sets the clipboard;
            clipboard read queries are never answered.
        notification:
          type: string
          description: >-
            Most recent OSC 9 or OSC 777 notification payload. OSC 9 numeric
            progress reports are not exposed as notifications.
        display_id: {$ref: '#/components/schemas/ResourceId'}
        pane_id: {$ref: '#/components/schemas/ResourceId'}
        process_id: {type: integer, minimum: 1}
        exit_code: {type: integer}
        focused: {type: boolean}
        surface_mode: {type: string, enum: [terminal, external, mirror]}
        cursor: {$ref: '#/components/schemas/Cursor'}
        terminal_capabilities:
          $ref: '#/components/schemas/TerminalCapabilities'
        hibr_attachment:
          $ref: '#/components/schemas/HibrAttachmentDiagnostics'
        hibr_desktop:
          $ref: '#/components/schemas/HibrDesktopBinding'
        graphics:
          type: array
          description: >-
            Bounded Kitty or sixel graphics records observed in this session.
            The field is diagnostic until the protocol capability is advertised.
          items: {$ref: '#/components/schemas/GraphicsImage'}
        graphics_diagnostics:
          $ref: '#/components/schemas/GraphicsDiagnostics'
      additionalProperties: false
    HibrAttachmentDiagnostics:
      type: object
      required: [resume_requested, reassert_attempts, owner_matches, unresolved,
                 owner_registered, owner_pid]
      properties:
        resume_requested: {type: boolean}
        reassert_attempts: {type: integer, minimum: 0}
        owner_matches: {type: integer, minimum: 0}
        unresolved: {type: boolean}
        owner_registered: {type: boolean}
        owner_pid: {type: integer, minimum: 0}
      additionalProperties: false
    HibrDesktopBinding:
      type: object
      required: [role, session]
      properties:
        role:
          type: string
          enum: [none, primary, join]
          description: >-
            Blit's enforced Hibr ownership role. A primary owns the named
            held desktop; join clients attach to that same Hibr session and
            never create a second desktop state owner.
        session:
          type: string
          description: Hibr held-session name, normally `blit`.
      additionalProperties: false
    HibrOwnerRegistration:
      type: object
      required: [pid, token]
      properties:
        pid: {type: integer, minimum: 2}
        token: {type: string, minLength: 1}
      additionalProperties: false
    TerminalCapabilities:
      type: object
      required: [term, cell_pixels, graphics]
      properties:
        term:
          type: string
          description: >-
            Effective TERM value presented to the PTY child. The default
            xterm-kitty advertises Blit's Kitty-capable terminal contract;
            an explicit session environment may override it.
        cell_pixels:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
        graphics:
          type: array
          minItems: 2
          items: {type: string, enum: [kitty, sixel]}
      additionalProperties: false
    GraphicsDiagnostics:
      type: object
      required: [rejected, evicted, last_error]
      properties:
        rejected: {type: integer, minimum: 0}
        evicted: {type: integer, minimum: 0}
        last_error: {type: string}
      additionalProperties: false
    GraphicsImage:
      type: object
      required: [id, protocol, complete, visible, width, height, format, bytes,
                 pixel_crc32, x, y,
                 placement_width, placement_height, z, revision]
      properties:
        id: {type: integer, minimum: 1}
        protocol: {type: string, enum: [kitty, sixel]}
        complete: {type: boolean}
        visible: {type: boolean}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        format: {type: integer, enum: [24, 32]}
        bytes: {type: integer, minimum: 0, maximum: 67108864}
        pixel_crc32:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: >-
            CRC-32 of the decoded samples, for asserting that two
            transmissions of the same picture produced the same picture.
            Dimensions and byte counts agree for images that differ, so they
            cannot serve that purpose. It is a checksum for comparison, not a
            digest for trust. Zero while the payload is still a staged
            container rather than samples.
        x: {type: integer}
        y: {type: integer}
        placement_width: {type: integer, minimum: 0, maximum: 4096}
        placement_height: {type: integer, minimum: 0, maximum: 4096}
        z: {type: integer}
        revision: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    Cursor:
      type: object
      required: [x, y, visible]
      properties:
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        visible: {type: boolean}
        style:
          type: integer
          minimum: 0
          maximum: 6
          description: >-
            VT DECSCUSR style: 0/1 blinking block, 2 steady block,
            3 blinking underline, 4 steady underline, 5 blinking bar,
            or 6 steady bar. Backends may render blinking styles steadily.
      additionalProperties: false
    SurfaceSnapshot:
      type: object
      required: [id, revision, width, height, cursor, cells]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        cursor: {$ref: '#/components/schemas/Cursor'}
        cells:
          type: array
          items:
            type: object
            required: [x, y, width, text]
            properties:
              x: {type: integer, minimum: 0}
              y: {type: integer, minimum: 0}
              width:
                type: integer
                enum: [0, 1, 2]
                description: Physical cell width; zero marks the continuation column of a wide glyph.
              text:
                type: string
                minLength: 1
                description: Complete UTF-8 cell sequence, including combining marks, joiners, and variation selectors.
              link:
                type: string
                description: URI from the active OSC 8 hyperlink, when present.
              style: {$ref: '#/components/schemas/CellStyle'}
            additionalProperties: false
      additionalProperties: false
    SurfaceSummary:
      type: object
      required: [id, revision, width, height, non_empty_cells, codepoint_cells,
                 printable_cells, cursor,
                 graphics_images, frame_open, damage]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        non_empty_cells: {type: integer, minimum: 0}
        codepoint_cells:
          type: integer
          minimum: 0
          description: Cells containing a codepoint, including spaces.
        printable_cells:
          type: integer
          minimum: 0
          description: Cells containing a printable codepoint.
        cursor: {$ref: '#/components/schemas/Cursor'}
        graphics_images: {type: integer, minimum: 0}
        frame_open:
          type: boolean
          description: >-
            True while a multi-request frame is open, which withholds the
            surface from the renderer until a `commit`. A `defer` opens it;
            `commit` and `immediate` both close it.
        damage:
          type: object
          required: [valid, x, y, width, height]
          properties:
            valid: {type: boolean}
            x: {type: integer, minimum: 0}
            y: {type: integer, minimum: 0}
            width: {type: integer, minimum: 0}
            height: {type: integer, minimum: 0}
          additionalProperties: false
      additionalProperties: false
    ScrollbackSnapshot:
      type: object
      required: [id, count, view, lines]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        count: {type: integer, minimum: 0, maximum: 1000}
        view: {type: integer, minimum: 0, maximum: 1000}
        lines:
          type: array
          items:
            type: object
            required: [index, width, text]
            properties:
              index: {type: integer, minimum: 0}
              width: {type: integer, minimum: 1}
              text: {type: string}
            additionalProperties: false
      additionalProperties: false
    CellStyle:
      type: object
      properties:
        foreground:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        background:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        bold: {type: boolean}
        dim: {type: boolean}
        italic: {type: boolean}
        underline: {type: boolean}
        blink: {type: boolean}
        inverse: {type: boolean}
        strike: {type: boolean}
        concealed: {type: boolean}
        underline_color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
      additionalProperties: false
    CellUpdate:
      type: object
      required: [base_revision, cells]
      properties:
        base_revision: {$ref: '#/components/schemas/Revision'}
        cells:
          type: array
          items:
            type: object
            required: [x, y, text]
            properties:
              x: {type: integer, minimum: 0}
              y: {type: integer, minimum: 0}
              text:
                type: string
                minLength: 1
                description: UTF-8 text spanning logical cells; wide glyphs occupy two columns and combining marks, joiners, and variation selectors attach to the preceding glyph.
              style: {$ref: '#/components/schemas/CellStyle'}
            additionalProperties: false
        cursor: {$ref: '#/components/schemas/Cursor'}
        presentation:
          type: string
          enum: [immediate, defer, commit]
          default: immediate
          description: >-
            Controls visual presentation of this update. `immediate` applies
            and presents it normally. `defer` applies the revision but keeps
            it out of the renderer as part of a bounded multi-request frame.
            `commit` applies the final chunk and presents the complete frame.
            A `commit` with no preceding `defer` is a 409 `frame_not_open`, so
            a frame that fits in one request uses `immediate`. Deferred cells
            are applied to the surface immediately; only their presentation
            waits, so a deferred chunk advances the revision like any other
            accepted write.
      additionalProperties: false
    FrameRequest:
      type: object
      required: [base_revision, surface_ids]
      properties:
        base_revision: {$ref: '#/components/schemas/Revision'}
        surface_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResourceId'}
      additionalProperties: false
    MutationReceipt:
      type: object
      required: [revision, accepted]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        accepted: {type: boolean}
      additionalProperties: false
    FrameReceipt:
      type: object
      required: [frame_id, revision, state]
      properties:
        frame_id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        state:
          type: string
          enum: [accepted, presenting, presented, failed]
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        revision: {$ref: '#/components/schemas/Revision'}
        diagnostics:
          type: array
          items: {type: string}
      additionalProperties: true
    StreamSubscribe:
      type: object
      required: [type, subscriptions]
      properties:
        type: {type: string, const: subscribe}
        subscriptions:
          type: array
          items:
            type: string
            enum: [input, terminals, surfaces, frames, hardware, diagnostics]
      additionalProperties: false
    StreamPixelFrameBegin:
      type: object
      required: [type, session_id, image_id, width, height, format]
      properties:
        type: {type: string, const: pixel_frame_begin}
        session_id: {$ref: '#/components/schemas/ResourceId'}
        image_id: {type: integer, minimum: 1}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        format: {type: integer, enum: [24, 32]}
        x: {type: integer, default: 0}
        y: {type: integer, default: 0}
        z: {type: integer, default: 0}
        ack:
          type: boolean
          default: false
          description: Request one presentation receipt for every completed frame.
        chunked:
          type: boolean
          default: false
          description: Send the binary pixels as bounded WebSocket chunks followed by pixel_frame_end.
      additionalProperties: false
    StreamPixelFrameReceipt:
      type: object
      required: [type, state]
      properties:
        type:
          type: string
          enum: [pixel_frame_ready, pixel_frame_present, pixel_frame_error]
        state: {type: string}
        code: {type: string}
      additionalProperties: false
    StreamInputEvent:
      type: object
      required: [type, session_id, device_id, event]
      properties:
        type: {type: string, const: input}
        session_id: {$ref: '#/components/schemas/ResourceId'}
        device_id: {$ref: '#/components/schemas/ResourceId'}
        event:
          type: object
          description: >-
            Every event includes monotonic receipt time_us. For evdev-gamepad,
            kind is gamepad_button or gamepad_axis and the event also includes
            the Linux evdev code and value. Pointer events include coordinates
            and output/cell targeting; keyboard events include modifier and
            repeat state.
          required: [time_us]
          properties:
            time_us: {type: integer, minimum: 0}
          additionalProperties: true
      additionalProperties: false
    StreamTerminalOutput:
      type: object
      required: [type, session_id, data, sequence]
      properties:
        type: {type: string, const: terminal_output}
        session_id: {$ref: '#/components/schemas/ResourceId'}
        data: {type: string}
        sequence: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    StreamSurfaceDelta:
      type: object
      required: [type, surface_id, revision, cursor, sequence]
      properties:
        type: {type: string, const: surface_delta}
        surface_id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        sequence: {$ref: '#/components/schemas/Revision'}
        cursor: {$ref: '#/components/schemas/Cursor'}
        damage:
          type: object
          required: [x, y, width, height]
          properties:
            x: {type: integer, minimum: 0}
            y: {type: integer, minimum: 0}
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
      additionalProperties: false
    StreamFrameEvent:
      type: object
      required: [type, frame, sequence]
      properties:
        type: {type: string, const: frame}
        frame: {$ref: '#/components/schemas/FrameReceipt'}
        sequence: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    StreamDiagnosticEvent:
      type: object
      required: [type, severity, code, detail]
      properties:
        type: {type: string, const: diagnostic}
        severity:
          type: string
          enum: [debug, info, warning, error, critical]
        code: {type: string}
        detail: {type: string}
        resource_id: {$ref: '#/components/schemas/ResourceId'}
      additionalProperties: false
