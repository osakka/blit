openapi: 3.1.0
info:
  title: blit network API
  version: 0.1.0
  description: >-
    Network control, discovery, terminal-session, display, input, and
    diagnostic API for the blit terminal and display service.
servers:
  - url: http://localhost:8080
    description: Development HTTP over TCP
  - url: https://blit.example.invalid
    description: Production HTTPS placeholder
tags:
  - name: server
  - name: hardware
  - name: topology
  - name: terminals
  - name: frames
  - name: effects
  - name: diagnostics
  - name: control
paths:
  /v1/server:
    get:
      tags: [server]
      operationId: getServerDetails
      summary: Get server identity and capabilities
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetails'
        default:
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      tags: [diagnostics]
      operationId: getVersion
      summary: Get the running Blit and API versions
      responses:
        '200':
          description: Version identity
          content:
            application/json:
              schema:
                type: object
                required: [server_version, api_version]
                properties:
                  server_version: {type: string}
                  api_version: {type: string}
                additionalProperties: false
        default:
          $ref: '#/components/responses/Problem'
  /v1/fonts:
    get:
      tags: [terminals]
      operationId: getFontProfiles
      summary: List selectable fonts and the active logical cell size
      responses:
        '200':
          description: Active font configuration and installed profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontProfiles'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [terminals]
      operationId: replaceFontConfiguration
      summary: Select a font profile and/or logical font scale
      description: >-
        Blit recomputes pane geometry and resizes attached PTYs. Hibr is not
        modified. Scale is bounded to 1.0 through 3.0 in 0.1 increments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FontConfiguration'
      responses:
        '200':
          description: Applied font configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FontProfiles'
        default:
          $ref: '#/components/responses/Problem'
  /v1/graphics:
    get:
      tags: [hardware]
      operationId: listGraphicsCards
      summary: List graphics cards and render capabilities
      responses:
        '200':
          description: Graphics inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, graphics_cards]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  graphics_cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphicsCard'
        default:
          $ref: '#/components/responses/Problem'
  /v1/displays:
    get:
      tags: [hardware]
      operationId: listDisplays
      summary: List displays, modes, and presentation state
      responses:
        '200':
          description: Display inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, displays]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  displays:
                    type: array
                    items:
                      $ref: '#/components/schemas/Display'
                  count: {type: integer, minimum: 0}
                  dropped: {type: integer, minimum: 0}
        default:
          $ref: '#/components/responses/Problem'
  /v1/displays/{display_id}:
    parameters:
      - name: display_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    get:
      tags: [hardware]
      operationId: getDisplay
      summary: Read one display
      responses:
        '200':
          description: The display
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [hardware]
      operationId: updateDisplay
      summary: Set a display's rotation or brightness
      description: >-
        Only the properties this display lists in `capabilities` are accepted,
        and anything else is refused with `invalid_display_property` rather
        than ignored. Selecting a mode is deliberately not here: it resizes
        every surface on the display and needs issue #60's resize protocol.

        `rotation` is refused with 409 `display_rotation_in_use` while a
        surface is present on the display, because rotating exchanges the cell
        grid's width and height and a surface's owner is the one that decides
        its size (ADR 0063). `brightness_percent` is refused with 422
        `display_brightness_unsupported` where no backlight is attributed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration:
                  type: object
                  properties:
                    rotation: {type: integer, enum: [0, 90, 180, 270]}
                    brightness_percent:
                      type: integer
                      minimum: 0
                      maximum: 100
                  additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: The updated display
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/audio:
    get:
      tags: [hardware]
      operationId: listAudioDevices
      summary: List audio devices and capabilities
      description: >-
        One item per ALSA PCM per direction, served from the runtime's table
        (ADR 0064). The request performs no enumeration, so it is safe to
        poll; the inventory this replaced made 32 x 32 x 2 `access()` calls on
        the event-loop thread per request. `revision` counts discoveries,
        losses and accepted configuration writes.
      responses:
        '200':
          description: Audio inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, devices]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudioDevice'
                  count: {type: integer, minimum: 0}
                  dropped: {type: integer, minimum: 0}
        default:
          $ref: '#/components/responses/Problem'
  /v1/audio/{device_id}:
    parameters:
      - name: device_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    get:
      tags: [hardware]
      operationId: getAudioDevice
      summary: Read one audio device
      responses:
        '200':
          description: The audio device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevice'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [hardware]
      operationId: updateAudioDevice
      summary: Configure one audio device
      description: >-
        Writes a device's `configuration` and nothing else, with the same
        concurrency rule as the other device classes: an optional `revision`
        in the body, an `If-Match` header, or both, each answered 409 when it
        does not identify the current revision. A property that is not
        writable is refused with 400 and named.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                revision:
                  $ref: '#/components/schemas/Revision'
                configuration:
                  type: object
                  properties:
                    default: {type: boolean}
                  additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: The updated audio device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevice'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/audio/cards:
    get:
      tags: [audio]
      operationId: listAudioCards
      summary: List the audio cards and their mixers
      description: >-
        A mixer belongs to a **card**, not to a PCM. ADR 0064's audio id is
        per PCM because that is what an application opens, and a card with
        four HDMI outputs has one mixer between them -- so a mixer reported
        per PCM would be four copies of one thing and a write through one
        would leave three stale. Every PCM points here with `card_controls`
        and this says which PCMs share it (issue #68).
      responses:
        '200':
          description: The cards and their control elements
          content:
            application/json:
              schema:
                type: object
                required: [revision, cards]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  cards:
                    type: array
                    items: {$ref: '#/components/schemas/AudioCard'}
        default:
          $ref: '#/components/responses/Problem'
  /v1/audio/cards/{card_id}:
    parameters:
      - in: path
        name: card_id
        required: true
        description: >-
          The card's ALSA id, from `/proc/asound/card<N>/id`, which ALSA keeps
          stable across reboots -- unlike the card *number*.
        schema: {type: string}
    get:
      tags: [audio]
      operationId: getAudioCard
      summary: Get one card's mixer
      responses:
        '200':
          description: The card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioCard'}
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [audio]
      operationId: configureAudioCard
      summary: Set a volume, a mute, or a named control
      description: >-
        `volume_percent` and `mute` act on the element the resolution rule
        names, and are refused with `audio_control_ambiguous` where it names
        none -- a card with two playback volumes and no Master is genuinely
        ambiguous, and guessing would adjust the wrong hardware. `controls`
        writes a named element by its own raw value.

        What comes back is what the card holds after the write, not what was
        asked for: an ALSA range is whatever the hardware says, so a
        percentage is converted against the element's own range and the result
        read back. 50% of a 0..87 Master is 44, which reads back as 51%.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                configuration:
                  type: object
                  additionalProperties: false
                  properties:
                    volume_percent: {type: integer, minimum: 0, maximum: 100}
                    mute: {type: boolean}
                    controls:
                      type: object
                      description: >-
                        Element name to its own raw integer value, not a
                        percentage: an enumerated element has values rather
                        than a magnitude, and each element's range is in the
                        card's `controls` list.
                      additionalProperties: {type: integer}
              additionalProperties: false
      responses:
        '200':
          description: The card after the write
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioCard'}
        default:
          $ref: '#/components/responses/Problem'
  /v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get the stored settings document
      description: >-
        Blit's own settings (ADR 0067), keyed by the stable device ids of
        ADR 0064. The document is a resource so that backing a machine's
        settings up, cloning them to another, or resetting them are API
        operations -- which is what keeps the file behind `path` an
        implementation detail of the `version` field rather than a contract.
      responses:
        '200':
          description: The settings document as it stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [settings]
      operationId: replaceSettings
      summary: Replace the stored settings document
      description: >-
        Replaces, it does not merge: the devices are reset to their defaults
        and then every entry the document names is applied, because a merge
        could not express "this and nothing else", which is what restoring a
        backup means. Each entry is validated by the same code a PATCH on that
        device goes through; `applied` and `refused` report the outcome and
        `refusal` names the first entry that did not take. An entry for a
        device that is not present is stored and applied when it appears.
        Refused with `settings_not_persisted` when the server was started
        with `BLIT_SETTINGS=ignore`, because a write that could not stick is
        worse than a refusal.
      parameters:
        - in: header
          name: If-Match
          required: false
          description: The document revision this write was composed against.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: object
                  description: The whole document, in the shape `GET` returns.
              additionalProperties: false
      responses:
        '200':
          description: The document was replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [settings]
      operationId: resetSettings
      summary: Reset every setting to its default and remove the document
      description: >-
        The recoverable half of ADR 0067's first failure shape: a setting can
        be perfectly valid and still lock a machine out -- `enabled: false` on
        its only keyboard -- so undoing it must not require knowing which
        setting did it. This is allowed even under `BLIT_SETTINGS=ignore`,
        where it clears the document that boot is deliberately not reading, so
        that recovery can be finished without a shell.
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Settings reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics:
    get:
      tags: [diagnostics]
      operationId: getDiagnostics
      summary: Get current backend, resource, render, and input diagnostics
      responses:
        '200':
          description: Current diagnostic snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics/runtime:
    get:
      tags: [diagnostics]
      operationId: getRuntimeDiagnostics
      summary: Get diagnostics, performance counters, and bounded runtime logs
      responses:
        '200':
          description: Current diagnostic snapshot and recent runtime events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDiagnostics'
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics/trace:
    get:
      tags: [diagnostics]
      operationId: getDiagnosticTrace
      summary: Get the bounded input, surface, graphics, and render-path trace
      parameters:
        - in: query
          name: kind
          required: false
          description: >-
            Return only events of this kind when supplied. `graphics_payload`
            is one entry per Kitty or sixel payload that reached the terminal
            parser, written after the decode so it records both what arrived
            and what became of it -- which is the only way to tell a producer
            that sent no image from an image Blit discarded (issue #19).
          schema:
            type: string
            enum: [pointer_button, pointer_motion, keyboard_key, surface_update, render_path, graphics_payload]
        - in: query
          name: limit
          required: false
          description: Maximum number of newest matching events to return; defaults to 32 and is capped at 128.
          schema:
            type: integer
            minimum: 1
            maximum: 128
            default: 32
      responses:
        '200':
          description: Recent trace events in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [revision, events]
                properties:
                  revision: {type: integer, minimum: 0}
                  events:
                    type: array
                    items:
                      type: object
                      required: [sequence, time_us, kind, detail]
                      properties:
                        sequence: {type: integer, minimum: 1}
                        time_us: {type: integer, minimum: 0}
                        kind: {type: string}
                        detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/diagnostics/screenshots/{display_id}:
    get:
      tags: [diagnostics]
      operationId: captureDisplayScreenshot
      summary: Capture the current framebuffer for one display
      parameters:
        - $ref: '#/components/parameters/DisplayId'
        - in: query
          name: cached
          required: false
          description: >-
            Observe the already-composed scene without forcing a full redraw.
            Omit this parameter when a deliberate fresh scene rebuild is
            required.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: >-
            Current SDL3 or direct-KMS framebuffer encoded as a BMP image.
            Direct-KMS captures are 32-bit bottom-up BMP images. The response
            carries the state identity the pixels correspond to, sampled at
            the moment the framebuffer is read, so a client can tell a
            rendering fault from a capture whose surface moved underneath it.
          headers:
            X-Blit-Capture-Frame:
              description: Frame counter at the moment the framebuffer was read.
              schema: {type: integer, minimum: 0}
            X-Blit-Capture-Revisions:
              description: >-
                Comma-separated surface-id=revision pairs for every live
                surface, sampled with the pixels. A comparison against a
                surface snapshot is only meaningful while these still match.
              schema: {type: string}
          content:
            image/bmp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update:
    put:
      tags: [control]
      operationId: uploadUpdatePackage
      summary: Upload, verify, install, and restart from a Blit Debian package
      parameters:
        - in: header
          name: X-Blit-Update-Token
          required: true
          schema: {type: string, minLength: 1}
        - in: header
          name: X-Blit-SHA256
          required: true
          schema: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      requestBody:
        required: true
        content:
          application/vnd.debian.binary-package:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Package installed and restart accepted
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: restarting}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update/status:
    get:
      tags: [control]
      operationId: getUpdateStatus
      summary: Get package update state and transfer progress
      responses:
        '200':
          description: Current update state
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string}
                  detail: {type: string}
                  upload:
                    $ref: '#/components/schemas/UpdateUpload'
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update/cancel:
    post:
      tags: [control]
      operationId: cancelUpdateUpload
      summary: Cancel an in-progress package upload
      parameters:
        - in: header
          name: X-Blit-Update-Token
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '202':
          description: Package upload cancelled
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: cancelled}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/update/reset:
    post:
      tags: [control]
      operationId: resetUpdateState
      summary: Clear a failed update state when no upload is active
      parameters:
        - in: header
          name: X-Blit-Update-Token
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '202':
          description: Update state reset and ready for a new upload
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: ready}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/shutdown-key:
    get:
      tags: [control]
      operationId: getShutdownKey
      summary: Read the chord that stops the server from the keyboard
      responses:
        '200':
          description: The configured chord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownKey'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [control]
      operationId: setShutdownKey
      summary: Program the chord that stops the server
      description: >-
        The chord exists for the case where an operator is in front of a
        machine whose screen or input has gone wrong and whose only other
        control channel is this API. It performs the same orderly stop as
        `POST /v1/control/shutdown`, and exits 0 — so a unit with
        `Restart=on-failure` leaves it stopped rather than restarting it.

        It fires on press only, never on release or autorepeat, and every
        modifier it names must be held **on the keyboard the key came from**:
        Control held on one keyboard says nothing about a key pressed on
        another. Holding extra modifiers beyond those named still fires it.

        Fields omitted from the request keep their current value. The chord is
        persisted (ADR 0067), so one moved off a combination the desktop uses
        survives the next release.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                code:
                  type: integer
                  minimum: 1
                  maximum: 767
                  description: The Linux evdev key code. 14 is Backspace.
                modifiers:
                  type: array
                  items:
                    type: string
                    enum: [shift, control, alt, altgr]
                  description: >-
                    `meta` is refused: it is not derived per keyboard, so a
                    chord naming it could never match, and accepting one would
                    leave the operator believing they had a working chord.
              additionalProperties: false
      responses:
        '200':
          description: The updated chord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownKey'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/shutdown:
    post:
      tags: [control]
      operationId: requestShutdown
      summary: Stop Blit and cleanly release its child processes and outputs
      description: >-
        Accepts an asynchronous shutdown request. The response is sent before
        the event loop exits; the process then terminates PTY process groups,
        destroys SDL/KMS outputs, and exits. Authentication applies when the
        server has BLIT_AUTH_TOKEN configured.
      responses:
        '202':
          description: Shutdown accepted
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: stopping}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/control/restart:
    post:
      tags: [control]
      operationId: restartServer
      summary: Request an orderly in-process server restart
      responses:
        '202':
          description: Restart accepted
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: restarting}
                  detail: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/effects:
    get:
      tags: [effects]
      operationId: getEffects
      summary: Get the bounded renderer effect state
      responses:
        '200':
          description: Current effect state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectState'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [effects]
      operationId: updateEffects
      summary: Set the bounded renderer effect state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EffectUpdate'
      responses:
        '200':
          description: Updated effect state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectState'
        default:
          $ref: '#/components/responses/Problem'
  /v1/overlays:
    get:
      tags: [effects]
      operationId: listOverlays
      summary: List bounded graphic overlays
      responses:
        '200':
          description: Current overlays
          content:
            application/json:
              schema:
                type: object
                required: [revision, backend, overlays]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  backend:
                    type: string
                    enum: [sdl3, drm-kms, unavailable]
                  overlays:
                    type: array
                    items: {$ref: '#/components/schemas/Overlay'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [effects]
      operationId: createOverlay
      summary: Create a bounded solid-color graphic overlay
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOverlay'
      responses:
        '201':
          description: Created overlay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overlay'}
        default:
          $ref: '#/components/responses/Problem'
  /v1/overlays/{overlay_id}:
    parameters:
      - name: overlay_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    delete:
      tags: [effects]
      operationId: deleteOverlay
      summary: Delete a graphic overlay
      responses:
        '204': {description: Overlay deleted}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/devices:
    get:
      tags: [hardware]
      operationId: listInputDevices
      summary: List keyboard, pointer, and other input devices
      description: >-
        Served from the runtime's device table (ADR 0064). The response is a
        view of what the server has discovered and polls; the request performs
        no device enumeration, so it is safe to poll. `revision` counts
        discoveries, losses and accepted configuration writes, and a change is
        also announced on the event stream as `device_changed`, delivered to
        `events=input` and `events=hardware` subscribers. `count` is the
        number of serialised devices and `dropped` the number that did not fit
        the response; a client that sees a non-zero `dropped` is seeing an
        incomplete inventory and is told so rather than silently shortchanged.
      responses:
        '200':
          description: Input inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, devices]
                properties:
                  revision:
                    $ref: '#/components/schemas/Revision'
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/InputDevice'
                  count: {type: integer, minimum: 0}
                  dropped: {type: integer, minimum: 0}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/devices/{device_id}:
    parameters:
      - name: device_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    get:
      tags: [hardware]
      operationId: getInputDevice
      summary: Read one input device
      responses:
        '200':
          description: The input device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputDevice'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [hardware]
      operationId: updateInputDevice
      summary: Configure one input device
      description: >-
        Writes a device's `configuration` and nothing else. The concurrency
        rule is the one the rest of Blit uses: an optional `revision` in the
        body, an `If-Match` header, or both, each answered with 409 when it
        does not identify the device's current revision. A property that is
        not writable is refused with 400 and named in the detail rather than
        accepted and ignored; a pointer-only property on a device that is not
        read as a pointer is refused with 422. An accepted write bumps the
        device's revision and the collection's, and is announced on the event
        stream as `device_changed` with `change: "configured"`, delivered to
        `events=input` and `events=hardware` subscribers.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration]
              properties:
                revision:
                  $ref: '#/components/schemas/Revision'
                configuration:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    sensitivity_percent:
                      type: integer
                      minimum: 10
                      maximum: 1000
                    natural_scroll: {type: boolean}
                    keymap:
                      type: object
                      properties:
                        base: {type: string, enum: [us]}
                        keys:
                          type: object
                          additionalProperties:
                            type: array
                            minItems: 4
                            maxItems: 4
                            items: {type: string, maxLength: 4}
                      additionalProperties: false
                    buttons:
                      type: object
                      description: >-
                        Evdev code to button (issue #67). Replaces the whole
                        map; an empty object clears it.
                      additionalProperties:
                        type: string
                        enum: [left, middle, right, none]
                    scroll_step: {type: integer, minimum: 1, maximum: 10}
                    acceleration:
                      type: object
                      required: [profile]
                      additionalProperties: false
                      properties:
                        profile: {type: string, enum: [flat, adaptive]}
                    deadzone_percent: {type: integer, minimum: 0, maximum: 50}
                    invert_axes:
                      type: array
                      maxItems: 16
                      items: {type: integer, minimum: 0}
                    repeat_delay_ms: {type: integer, minimum: 10, maximum: 10000}
                    repeat_rate_hz: {type: integer, minimum: 1, maximum: 255}
                    caps_lock_boot: {type: boolean}
                    num_lock_boot: {type: boolean}
                    modifiers:
                      type: object
                      description: >-
                        Evdev code to role (issue #66). Replaces the whole
                        map; an empty object clears it.
                      additionalProperties:
                        type: string
                        enum: [none, shift, control, alt, altgr, meta,
                               caps_lock, num_lock]
                    route:
                      type: object
                      description: >-
                        Omit target_session_id, with enabled false, to remove
                        the route.
                      required: [enabled]
                      properties:
                        target_session_id:
                          $ref: '#/components/schemas/ResourceId'
                        enabled: {type: boolean}
                      additionalProperties: false
                  additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: The updated input device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputDevice'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/inject:
    post:
      tags: [hardware]
      operationId: injectPointerInput
      summary: Inject a deterministic input event through the normal input path
      description: >-
        Test and API clients may inject pointer motion, button, or wheel
        events, or a key press or release by evdev code. The event is routed
        and rendered by the same canonical path as a physical device -- a key
        goes through the same modifier state machine, encoder, PTY write and
        counters -- so what is exercised is the real path and not a synthetic
        shortcut. This endpoint does not emulate a physical device descriptor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectedPointerEvent'
      responses:
        '202':
          description: Event accepted for routing and presentation
          content:
            application/json:
              schema:
                type: object
                required: [accepted, kind]
                properties:
                  accepted: {type: boolean}
                  kind: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/routes:
    get:
      tags: [hardware]
      operationId: listInputRoutes
      summary: List configured input routes
      responses:
        '200':
          description: Input-route inventory
          content:
            application/json:
              schema:
                type: object
                required: [revision, routes]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  routes:
                    type: array
                    items: {$ref: '#/components/schemas/InputRoute'}
        default:
          $ref: '#/components/responses/Problem'
  /v1/input/routes/{route_id}:
    parameters:
      - name: route_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ResourceId'}
    put:
      tags: [hardware]
      operationId: replaceInputRoute
      summary: Bind an input device source to a terminal session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInputRoute'
      responses:
        '200':
          description: Updated input routes
          content:
            application/json:
              schema:
                type: object
                required: [revision, routes]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  routes:
                    type: array
                    items: {$ref: '#/components/schemas/InputRoute'}
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [hardware]
      operationId: deleteInputRoute
      summary: Remove an input-device route
      responses:
        '204':
          description: Input route deleted
        default:
          $ref: '#/components/responses/Problem'
  /v1/topology:
    get:
      tags: [topology]
      operationId: getTopology
      summary: Get the logical multi-display topology
      responses:
        '200':
          description: Current topology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [topology]
      operationId: replaceTopology
      summary: Replace the desired display topology
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopologyUpdate'
      responses:
        '200':
          description: Applied topology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions:
    post:
      tags: [terminals]
      operationId: createTerminalSession
      summary: Create a PTY-backed terminal session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerminalSession'
      responses:
        '201':
          description: Created terminal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        '403':
          description: The executable is not permitted by the server policy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >-
            The request would create a duplicate Hibr primary or an orphan
            `--join` client.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [terminals]
      operationId: getTerminalSession
      summary: Get terminal-session state
      responses:
        '200':
          description: Terminal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [terminals]
      operationId: updateTerminalSession
      summary: Update terminal placement and input policy
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTerminalSession'
      responses:
        '200':
          description: Updated terminal session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [terminals]
      operationId: deleteTerminalSession
      summary: Stop and release a terminal session and its surface
      responses:
        '204':
          description: Terminal session released
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions/{session_id}/input:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [terminals]
      operationId: sendTerminalInput
      summary: Send bounded raw or bracketed-paste input to a terminal PTY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalInput'
      responses:
        '202':
          description: Input accepted by the PTY write path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalInputReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v1/terminal-sessions/{session_id}/hibr-owner:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [terminals]
      operationId: registerHibrOwner
      summary: Register the Blit-owned Hibr process for geometry reassertion
      description: >-
        Internal adapter handshake. The Blit-launched Hibr adapter submits its
        live PID and the per-session token supplied in its environment. Blit
        validates the token and uses the registered process, plus its bounded
        descendants, as the sole resize/signalling target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HibrOwnerRegistration'
      responses:
        '202':
          description: Hibr owner accepted for resize reassertion
          content:
            application/json:
              schema:
                type: object
                required: [state, detail]
                properties:
                  state: {type: string, const: registered}
                  detail: {type: string}
                additionalProperties: false
        default:
          $ref: '#/components/responses/Problem'
  /v1/surfaces/{surface_id}/cells:
    parameters:
      - $ref: '#/components/parameters/SurfaceId'
    put:
      tags: [terminals]
      operationId: replaceSurfaceCells
      summary: Apply a revisioned text-cell update
      description: >-
        Applies cells and, if present, cursor state, then advances the
        surface revision by one. The revision advances for every accepted
        request, including a deferred chunk and a request whose cells are
        identical to the cells they replace, so a client is responsible for
        not sending writes that change nothing (ADR 0058). `cells` may be
        empty when `cursor` is present: a cursor move with no cell change is
        a legitimate update. A request whose `base_revision` does not match
        the surface is a 409 with the current revision.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CellUpdate'
      responses:
        '200':
          description: Accepted surface revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationReceipt'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [terminals]
      operationId: getSurfaceSnapshot
      summary: Read the current revisioned surface snapshot
      responses:
        '200':
          description: Current text surface state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurfaceSnapshot'
        default:
          $ref: '#/components/responses/Problem'
  /v1/surfaces/{surface_id}/summary:
    parameters:
      - $ref: '#/components/parameters/SurfaceId'
    get:
      tags: [terminals]
      operationId: getSurfaceSummary
      summary: Read compact revision and rendering state for a surface
      description: >-
        Returns bounded diagnostic state without transferring the full cell
        snapshot. Use the cells endpoint for authoritative repair.
      responses:
        '200':
          description: Compact current surface state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurfaceSummary'
        default:
          $ref: '#/components/responses/Problem'
  /v1/surfaces/{surface_id}/scrollback:
    parameters:
      - $ref: '#/components/parameters/SurfaceId'
    get:
      tags: [terminals]
      operationId: getSurfaceScrollback
      summary: Read retained main-screen scrollback lines
      description: >-
        Returns oldest-first lines retained when the main screen scrolls.
        Alternate-screen output is never retained. `view` is the number of
        retained lines viewed back from the live screen; PATCH changes it and
        the same historical view is rendered on the display.
      responses:
        '200':
          description: Retained scrollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollbackSnapshot'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [terminals]
      operationId: setSurfaceScrollbackView
      summary: Set the retained terminal view position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view]
              properties:
                view: {type: integer, minimum: 0, maximum: 1000}
              additionalProperties: false
      responses:
        '200':
          description: Updated scrollback view and retained lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrollbackSnapshot'
        default:
          $ref: '#/components/responses/Problem'
  /v1/frames:
    post:
      tags: [frames]
      operationId: presentFrame
      summary: Request presentation of a coherent frame
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrameRequest'
      responses:
        '202':
          description: Frame accepted for presentation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v1/stream:
    get:
      tags: [diagnostics]
      operationId: openEventStream
      parameters:
        - name: since
          in: query
          required: false
          description: Replay retained broadcast events after this sequence.
          schema: {$ref: '#/components/schemas/Revision'}
      summary: Open the bidirectional blit WebSocket stream
      description: >-
        Clients upgrade this HTTP request to WebSocket. Stream messages use
        the schemas declared in x-blit-stream and components.schemas.
      responses:
        '101':
          description: WebSocket upgrade accepted
        default:
          $ref: '#/components/responses/Problem'
      x-blit-stream:
        protocol: websocket
        direction: bidirectional
        messages:
          - $ref: '#/components/schemas/StreamSubscribe'
          - $ref: '#/components/schemas/StreamInputEvent'
          - $ref: '#/components/schemas/StreamTerminalOutput'
          - $ref: '#/components/schemas/StreamSurfaceDelta'
          - $ref: '#/components/schemas/StreamFrameEvent'
          - $ref: '#/components/schemas/StreamPixelFrameBegin'
          - description: >-
              After pixel_frame_begin is accepted, the client sends one or
              more masked binary WebSocket messages containing tightly packed
              RGB or RGBA pixels. The final message completes the frame.
          - $ref: '#/components/schemas/StreamDiagnosticEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Required when the server is configured with BLIT_AUTH_TOKEN.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Optional expected current resource revision. When supplied, a stale value is rejected with 409.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    SurfaceId:
      name: surface_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
  responses:
    Problem:
      description: Typed API or hardware failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    UpdateUpload:
      type: object
      required: [active, received_bytes, expected_bytes]
      properties:
        active: {type: boolean}
        received_bytes: {type: integer, minimum: 0}
        expected_bytes: {type: integer, minimum: 0}
      additionalProperties: false
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
    Revision:
      type: integer
      format: int64
      minimum: 0
      description: >-
        Monotonic counter identifying a resource's state. For a surface it
        counts accepted writes, not observed changes: one accepted cell
        request advances it by exactly one whatever `presentation` was and
        whether or not the cells carried differ from the cells they replace.
        A client that wants the revision to track visible change must not
        send writes that change nothing. See ADR 0058.
    Bounds:
      type: object
      required: [x, y, width, height]
      properties:
        x: {type: integer}
        y: {type: integer}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
      additionalProperties: false
    FontProfile:
      type: object
      required: [id, path, available]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        path: {type: string}
        available: {type: boolean}
      additionalProperties: false
    FontConfiguration:
      type: object
      minProperties: 1
      properties:
        font_id: {$ref: '#/components/schemas/ResourceId'}
        scale: {type: number, minimum: 1.0, maximum: 3.0, multipleOf: 0.1}
      additionalProperties: false
    FontProfiles:
      type: object
      required: [revision, active, profiles]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        active:
          type: object
          required: [id, path, scale, cell_pixels, glyphs, mappings]
          properties:
            id: {$ref: '#/components/schemas/ResourceId'}
            path: {type: string}
            scale: {type: number, minimum: 1.0, maximum: 3.0, multipleOf: 0.1}
            cell_pixels:
              type: object
              required: [width, height]
              properties:
                width: {type: integer, minimum: 1}
                height: {type: integer, minimum: 1}
              additionalProperties: false
            glyphs:
              type: integer
              minimum: 1
              description: >-
                Bitmaps in the loaded font. With `mappings`, this is the
                font's identity: two artifacts can share a filename and a
                cell size while covering different codepoints, and without
                these a run cannot tell which one it loaded.
            mappings:
              type: integer
              minimum: 1
              description: Unicode codepoints the loaded font maps to a glyph.
          additionalProperties: false
        profiles:
          type: array
          items: {$ref: '#/components/schemas/FontProfile'}
      additionalProperties: false
    ServerDetails:
      type: object
      required: [id, name, api_version, revision, capabilities, display_count, display_backend, resources, listener]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        name: {type: string}
        api_version: {type: string, const: '0.1'}
        revision: {$ref: '#/components/schemas/Revision'}
        capabilities:
          type: array
          items: {type: string}
        display_count: {type: integer, minimum: 0}
        display_backend:
          type: object
          required: [name, ready, error]
          properties:
            name: {type: string, enum: [drm-kms, sdl3, unavailable]}
            ready: {type: boolean}
            error: {type: string}
          additionalProperties: false
        resources:
          type: object
          required: [graphics, displays, audio, audio_cards, input_devices, input_routes, topology, fonts, settings, diagnostics, runtime_diagnostics]
          properties:
            graphics: {type: string}
            displays: {type: string}
            audio: {type: string}
            input_devices: {type: string}
            input_routes: {type: string}
            topology: {type: string}
            fonts: {type: string}
            audio_cards: {type: string}
            settings: {type: string}
            diagnostics: {type: string}
            runtime_diagnostics: {type: string}
          additionalProperties: false
        listener:
          type: object
          description: >-
            The posture this server actually came up with (ADR 0065), reported
            rather than only logged so an operator and a control panel can read
            it. The session API executes a client-supplied command, and the
            service may run privileged, so an unauthenticated network listener
            is remote code execution as whomever Blit runs as. With no token
            and no requested bind address the server binds loopback; with no
            token and an explicitly requested network address it refuses to
            start, unless `BLIT_ALLOW_UNAUTHENTICATED_NETWORK=1` is set -- in
            which case `/v1/diagnostics` also reports
            `unauthenticated_network_listener` among its warnings.
          required: [bind, port, authentication, command_allowlist]
          properties:
            bind: {type: string}
            port: {type: integer, minimum: 1, maximum: 65535}
            authentication:
              type: string
              enum: [required, none]
            command_allowlist:
              type: boolean
              description: >-
                Whether BLIT_COMMAND_ALLOWLIST restricts what a session may
                execute. Note that an allowlist containing a shell -- which a
                desktop deployment wants -- is not a boundary.
          additionalProperties: false
      additionalProperties: false
    GraphicsCard:
      type: object
      required: [id, vendor, device, render_apis, formats]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        vendor: {type: string}
        device: {type: string}
        render_apis:
          type: array
          items: {type: string}
        formats:
          type: array
          items: {type: string}
        capabilities:
          type: object
          additionalProperties: {type: [string, number, boolean]}
      additionalProperties: false
    DisplayMode:
      type: object
      required: [width, height, refresh_hz]
      properties:
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        refresh_hz: {type: number, exclusiveMinimum: 0}
      additionalProperties: false
    Display:
      type: object
      required: [id, class, name, bounds, modes, active_mode,
                 presentation_state, capabilities, state, configuration,
                 revision]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        class:
          type: string
          enum: [display]
        name: {type: string}
        bounds:
          type: object
          description: >-
            The display's rectangle in the desktop's coordinate space, which
            is the *logical* one: at a rotation of 90 or 270 its width and
            height are the active mode's exchanged, because a rotated monitor
            occupies a rotated rectangle. `modes` and `active_mode` stay
            physical, and `state.physical` carries the mode's own size beside
            them. That is the same split `xrandr` reports, and it is what lets
            the cell grid, the pointer hit test and the topology placements all
            work in one space.
          required: [x, y, width, height]
          properties:
            x: {type: integer}
            y: {type: integer}
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
        modes:
          type: array
          items: {$ref: '#/components/schemas/DisplayMode'}
        active_mode:
          oneOf:
            - $ref: '#/components/schemas/DisplayMode'
            - type: 'null'
        presentation_state: {type: string}
        capabilities:
          type: array
          description: >-
            What this backend and this hardware can actually perform, derived
            rather than declared: `configuration` offers exactly these and a
            PATCH accepts exactly these. `mode-report` is always present.
            `rotation` is present on the SDL path, which composes a scene that
            can be drawn rotated; the direct-KMS path composes straight into
            the connector's framebuffer and omits it. `brightness` is present
            only where a backlight is attributed to the display.
          items:
            type: string
            enum: [mode-report, rotation, brightness]
        state:
          type: object
          required: [present, presentation_state, physical]
          properties:
            present: {type: boolean}
            presentation_state: {type: string}
            physical:
              type: object
              description: >-
                The mode the connector is driving. It never rotates, so it is
                what `bounds` is derived from rather than the other way round.
              required: [width, height]
              properties:
                width: {type: integer, minimum: 0}
                height: {type: integer, minimum: 0}
              additionalProperties: false
            power:
              type: string
              enum: [on, standby, suspend, off]
              description: >-
                The connector's DPMS state as the kernel reports it, present
                only where a DRM connector was matched to this display. It is
                reported and not settable, which is why `power` is not a
                capability: on the live host `/sys/class/drm/*/dpms` is mode
                444 and a root write returns EACCES, and the one open fd on
                the card belongs to SDL. Setting it is the rest of issue #69.
            connector:
              type: string
              description: >-
                The DRM connector this display was matched to, by name, e.g.
                `DP-1`. Matching is by name and not by index because SDL
                enumerates only the connectors it drives while the kernel
                enumerates all of them.
            backlight:
              type: string
              description: >-
                The backlight device under /sys/class/backlight attributed to
                this display. A backlight is attributed only when the host has
                exactly one backlight and exactly one display: sysfs does not
                say which panel a backlight drives, and dimming the wrong
                screen is worse than offering nothing.
          additionalProperties: false
        configuration:
          type: object
          description: >-
            The properties this display can actually perform, and only those
            (issue #69). It replaced an empty object, but not the reasoning
            behind it: selecting a mode changes the render output size and
            therefore every surface on the display, and a Hibr desktop's cells
            come from its owner (ADR 0063), so it needs a resize protocol with
            that owner. The modes are reported so a controller can show them;
            `mode` is still refused.

            `rotation` is the angle, clockwise, by which Blit rotates the
            rendered image before presenting it: at 90 what was drawn at the
            top-left of the logical rectangle appears at the top-right of the
            panel. It is stated as a corner rather than as an enum because
            DRM's ROTATE_90 is anticlockwise and RandR calls the same transform
            "right". It is Blit's own render transform, needs no DRM master,
            and is persisted (ADR 0067).

            `brightness_percent` is the backlight's level. It is read from
            `actual_brightness`, which is what the panel is doing, and written
            to `brightness`, which is what was requested -- so a driver that
            ramps reports the old value until it arrives. It is not persisted:
            systemd-backlight already restores it across a boot.
          properties:
            rotation: {type: integer, enum: [0, 90, 180, 270]}
            brightness_percent: {type: integer, minimum: 0, maximum: 100}
          additionalProperties: false
        revision:
          $ref: '#/components/schemas/Revision'
      additionalProperties: false

    AudioDevice:
      type: object
      description: >-
        One ALSA PCM in one direction, not one card (ADR 0064). A card with
        four HDMI outputs is four playback devices, because choosing between
        them is the whole of choosing an output. Served from the runtime's
        table and never enumerated on request.
      required: [id, class, name, node, direction, kinds, formats, identity,
                 capabilities, state, configuration, revision]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: >-
            `audio-<card-id>-pcm<device>-<p|c>`, with the card component taken
            from `/proc/asound/card<N>/id`, which ALSA keeps stable across
            reboots -- unlike the card *number*, which is assignment order and
            moves when a USB card is plugged in earlier.
        class:
          type: string
          enum: [audio]
        name: {type: string}
        node:
          type: string
          description: >-
            The PCM device node. Reported for diagnosis; it carries the card
            number and so is not a stable identifier.
        direction:
          type: string
          enum: [playback, capture]
        kinds:
          type: array
          items:
            type: string
            enum: [playback, capture]
        formats:
          type: array
          description: >-
            As the driver reports them for this direction, read from the
            card's stream description. Empty for a card that publishes no
            stream description -- an HDA card describes itself through
            `codec#N` instead -- rather than asserting a format it has not
            reported. The inventory this replaced hardcoded `s16le` for every
            device.
          items: {type: string}
        channels: {type: integer, minimum: 1}
        sample_rates:
          type: array
          description: >-
            Every rate the driver lists for this direction. ALSA publishes
            them as a comma-separated line, so a single value here means the
            device reported one rate and not that only the first was read.
          items: {type: integer, minimum: 1}
        sample_rates_continuous:
          type: boolean
          description: >-
            True when the driver published a range rather than a list, in
            which case `sample_rates` holds the integers it named -- the
            endpoints -- and not every usable rate between them.
        identity:
          type: object
          required: [card, card_id, device, subname]
          properties:
            card: {type: integer, minimum: 0}
            card_id: {type: string}
            device: {type: integer, minimum: 0}
            subname: {type: string}
          additionalProperties: false
        capabilities:
          type: array
          items: {type: string}
        card_controls:
          type: string
          description: >-
            The path to this PCM's card mixer. The mixer is the card's, not
            this device's: ADR 0064's id is per PCM because that is what an
            application opens, and a card with four HDMI outputs has one mixer
            between them. The card's `shares_controls_with` says which other
            PCMs it belongs to as well (issue #68).
        state:
          type: object
          required: [present, accessible]
          properties:
            present:
              type: boolean
              description: >-
                Whether the PCM's device node is there. The node is the
                authority, not the `/proc/asound` entry, because the device
                node directory is what the hotplug watch observes and nothing
                under `/proc` reports changes to inotify.
            accessible:
              type: boolean
              description: >-
                Whether the server can open the node for reading and writing.
                A present device it cannot open is still listed, with this
                false, so a permission problem reads as a permission problem
                rather than as a missing device.
            control_accessible:
              type: boolean
              description: >-
                Whether the card's control device could be read, which is a
                separate fact: `/dev/snd/controlC*` is `root:audio` and the
                PCM nodes are not, so a server without the `audio` group sees
                PCMs and no mixers.
          additionalProperties: false
        configuration:
          type: object
          description: >-
            Written with PATCH /v1/audio/{device_id}.
          required: [default]
          properties:
            default:
              type: boolean
              description: >-
                Marks this PCM as the default for its direction, clearing the
                flag on the other devices of that direction; playback and
                capture are chosen independently. Blit has no audio engine and
                cannot route a stream, so the choice is honoured by exporting
                `ALSA_CARD`, `ALSA_PCM_CARD`, `ALSA_PCM_DEVICE` and
                `BLIT_AUDIO_PLAYBACK`/`BLIT_AUDIO_CAPTURE` into the
                environment of sessions launched **after** the write. It
                cannot reach a session that is already running, so a
                controller that changes the default and wants it to apply
                relaunches the session. A note on what the variables mean:
                libasound reads `ALSA_CARD` as a card name or number and
                `ALSA_PCM_CARD`/`ALSA_PCM_DEVICE` as the numbers that override
                its `default` PCM, so an application honouring only
                `ALSA_CARD` gets device 0 of the card -- which, for a chosen
                HDMI output other than the first, is not the device that was
                chosen. All three are exported; an application that ignores
                two of them is beyond what Blit can enforce.
                Volume, mute and any other mixer control are not here and are
                not implied: they need libasound, which is a packaging
                decision of its own.
          additionalProperties: false
        revision:
          $ref: '#/components/schemas/Revision'
      additionalProperties: false

    AudioCard:
      type: object
      required: [id, class, card, state, control_count, controls_truncated,
                 shares_controls_with, controls, configuration, revision]
      properties:
        id:
          type: string
          description: The card's ALSA id, stable across reboots.
        class: {type: string, enum: [audio-card]}
        card:
          type: integer
          minimum: 0
          description: >-
            The card number, which is assignment order and moves when a USB
            card is plugged in earlier. Reported for correlation with
            `/dev/snd`, never for identity.
        state:
          type: object
          required: [present, control_accessible]
          properties:
            present: {type: boolean}
            control_accessible:
              type: boolean
              description: >-
                Whether `/dev/snd/controlC<N>` could be read. Separate from a
                PCM's `accessible` because a deployment can have one and not
                the other: the control device is `root:audio` and the PCM
                nodes are not, so a server without the `audio` group sees
                PCMs and no mixers.
          additionalProperties: false
        control_count:
          type: integer
          minimum: 0
          description: How many elements the card reports, in total.
        controls_truncated:
          type: boolean
          description: >-
            True when the card has more elements than the bounded list holds.
            An HDA codec routinely reports over a hundred; a controller is
            told rather than handed a silently shortened list.
        shares_controls_with:
          type: array
          items: {type: string}
          description: >-
            The audio device ids whose PCMs share this mixer. Reported rather
            than implied: without it a controller showing four HDMI outputs
            would present four volume sliders and be surprised when they moved
            together.
        controls:
          type: array
          items:
            type: object
            required: [name, index, type, channels, writable, minimum,
                       maximum, step, values]
            properties:
              name: {type: string}
              index: {type: integer, minimum: 0}
              type:
                type: string
                enum: [boolean, integer, enumerated, bytes, iec958,
                       integer64, unknown]
              channels: {type: integer, minimum: 0}
              writable:
                type: boolean
                description: >-
                  The card's own answer. Writing a read-only element is
                  refused rather than silently ignored.
              minimum: {type: integer}
              maximum: {type: integer}
              step: {type: integer}
              values:
                type: array
                items: {type: integer}
              percent:
                type: integer
                minimum: 0
                maximum: 100
                description: >-
                  The first channel's value as a percentage of this element's
                  own range. Present only for boolean and integer elements: an
                  enumerated or bytes element has values, not a magnitude.
            additionalProperties: false
        configuration:
          type: object
          additionalProperties: false
          description: >-
            The writable part. `volume_percent` and `mute` are present only
            where the resolution rule names an element -- `Master Playback
            Volume` if there is one, else the only `* Playback Volume` if
            there is exactly one, else nothing. Two candidates and no Master
            is ambiguous, and their absence is the answer rather than a guess.

            Control values are **not** persisted in the settings document:
            they are the card's own state and the card keeps them, so storing
            and re-applying them would make Blit fight `alsactl` for ownership
            of something that already survives a reboot (ADR 0067).
          properties:
            volume_percent: {type: integer, minimum: 0, maximum: 100}
            volume_control:
              type: string
              description: Which element `volume_percent` resolved to.
            mute:
              type: boolean
              description: >-
                The inverse of the playback switch, because an ALSA switch is
                on when audible.
            mute_control: {type: string}
            controls:
              type: object
              additionalProperties: {type: integer}
        revision: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    Settings:
      type: object
      required: [revision, path, persisted, document]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        path:
          type: string
          description: >-
            Where the document is kept. Reported for an operator's benefit and
            for backups; it is not a write surface, and its format is free to
            change behind `document.version`.
        persisted:
          type: boolean
          description: >-
            false when the server was started with `BLIT_SETTINGS=ignore`,
            which starts from the defaults and leaves the document untouched.
        applied:
          type: integer
          minimum: 0
          description: PUT only. Entries that were applied.
        refused:
          type: integer
          minimum: 0
          description: >-
            PUT only. Entries that did not apply. A stored entry is kept
            rather than deleted when it is refused: a property that
            contradicts the kinds the kernel reports today is far likelier to
            be a re-probe than a controller's mistake, so it lies dormant and
            applies again when the device reads the way it did (ADR 0067).
        refusal:
          type: string
          description: PUT only. The first entry that did not apply, and why.
        document:
          type: object
          required: [version, input_devices, audio_devices]
          description: >-
            Keyed by the stable ids of ADR 0064, never by node. An
            `input-node-<basename>` id is deliberately absent: that id says in
            itself that it is not stable, so restoring against it could apply
            one device's settings to whatever took its place. A device's
            `route` is absent for the same reason -- it names a `session-N`
            target, and a session id does not survive a restart either. Only
            what differs from the default is written. Unknown keys are
            preserved across a rewrite, so running an older release does not
            eat a newer one's settings.
          properties:
            version: {type: integer, minimum: 1}
            revision:
              type: integer
              minimum: 0
              description: >-
                The document's own revision, stored with it. Every other
                revision in Blit is per-process and ADR 0064 made a restart
                observable through them deliberately -- but this one is the
                `If-Match` a controller writes the whole document against, and
                a counter that restarted at zero would let a stale write from
                before the restart match by accident.
            input_devices:
              type: object
              additionalProperties:
                type: object
                description: The same object a PATCH on that device carries.
            audio_devices:
              type: object
              additionalProperties:
                type: object
    Diagnostics:
      type: object
      required: [revision, health, resources, render, graphics, errors, warnings]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        health:
          type: object
          required: [ready, backend, error]
          properties:
            ready: {type: boolean}
            backend: {type: string, enum: [drm-kms, sdl3, unavailable]}
            error: {type: string}
          additionalProperties: false
        resources:
          type: object
          required: [displays, outputs, sessions, surfaces, streams, input_routes, keyboards, pointers, gamepads]
          properties:
            displays: {type: integer, minimum: 0}
            outputs: {type: integer, minimum: 0}
            sessions: {type: integer, minimum: 0}
            surfaces: {type: integer, minimum: 0}
            streams: {type: integer, minimum: 0}
            input_routes: {type: integer, minimum: 0}
            keyboards: {type: integer, minimum: 0}
            keyboards_peak:
              type: integer
              minimum: 0
              description: >-
                The most keyboards this process has had open at once. A count
                below its peak is what `input_device_missing` reports, because
                the zero test it used to make is defeated by one stray HID
                interface: on the live host a USB hub took the keyboard and
                the mouse away while a microphone's remote-control interface
                kept both counts at one, and `warnings` stayed empty. The peak
                is per-process, so a restart is the deliberate way to say that
                the smaller number is the new normal.
            pointers: {type: integer, minimum: 0}
            pointers_peak: {type: integer, minimum: 0}
            gamepads: {type: integer, minimum: 0}
            gamepads_peak: {type: integer, minimum: 0}
          additionalProperties: false
        render:
          type: object
          required: [pending, interval_ms, effective_interval_ms, mode, outputs, font_scale, direct_kms, renderer, presentation_sync, pointer]
          properties:
            pending: {type: boolean}
            interval_ms: {type: integer, minimum: 1}
            effective_interval_ms: {type: integer, minimum: 1}
            mode: {type: string, enum: [refresh-aware]}
            outputs:
              type: array
              items:
                type: object
                required: [display_id, refresh_hz, refresh_source, effective_interval_ms, target_interval_us, target_interval_ms, missed_deadlines, last_present_ms, max_present_ms, present_calls, render_width, render_height]
                properties:
                  display_id: {type: string}
                  refresh_hz: {type: number, minimum: 1}
                  refresh_source: {type: string, enum: [display-mode, test-override]}
                  effective_interval_ms: {type: integer, minimum: 1}
                  target_interval_us: {type: integer, minimum: 1}
                  target_interval_ms: {type: number, minimum: 0}
                  missed_deadlines: {type: integer, minimum: 0}
                  last_present_ms: {type: number, minimum: 0}
                  max_present_ms: {type: number, minimum: 0}
                  present_calls: {type: integer, minimum: 0}
                  render_width: {type: integer, minimum: 0}
                  render_height: {type: integer, minimum: 0}
                additionalProperties: false
            font_scale: {type: number, minimum: 1.0, maximum: 3.0, multipleOf: 0.1}
            direct_kms: {type: boolean}
            renderer: {type: string}
            presentation_sync:
              type: string
              enum: [drm-page-flip, drm-page-flip-async, sdl-vsync, scheduler-only]
            pointer:
              type: object
              description: >-
                Compositor pointer state used to correlate pointer trails or
                stale damage with the captured framebuffer.
              required: [valid, x, y, output, previous_x, previous_y, previous_output, dirty]
              properties:
                valid: {type: boolean}
                x: {type: number}
                y: {type: number}
                output: {type: integer}
                previous_x: {type: number}
                previous_y: {type: number}
                previous_output: {type: integer}
                dirty: {type: boolean}
              additionalProperties: false
          additionalProperties: false
        graphics:
          type: object
          description: >-
            The enforced graphics bounds. A client has to size an image
            before it sends one, and the only other way to learn the limit is
            to have an image refused; these are the same numbers XTSMGRAPHICS
            answers with. The sixel bound is not a limit of its own -- a
            decoded sixel image is an ordinary graphics image -- so a
            full-size sixel canvas is exactly `max_bytes` (issue #8).
          required: [max_images, max_width, max_height, max_bytes,
                     sixel_max_width, sixel_max_height,
                     sixel_color_registers]
          properties:
            max_images: {type: integer, minimum: 1}
            max_width: {type: integer, minimum: 1}
            max_height: {type: integer, minimum: 1}
            max_bytes: {type: integer, minimum: 1}
            sixel_max_width: {type: integer, minimum: 1}
            sixel_max_height: {type: integer, minimum: 1}
            sixel_color_registers: {type: integer, minimum: 1}
          additionalProperties: false
        errors:
          type: array
          description: >-
            Faults a status check should act on. `backend_error` when the
            display backend failed; `hibr_desktop_unpainted` when a desktop
            registered an owner and never painted (issue #32);
            `output_without_session` when an output has had nothing on it for
            longer than a desktop takes to start **and** the deployment set
            `BLIT_EXPECT_DESKTOP=1` (issue #55). `health.ready` is about the
            display backend and stays separate from all of these.
          items:
            type: string
            enum: [backend_error, hibr_desktop_unpainted,
                   output_without_session]
        warnings:
          type: array
          description: >-
            Conditions worth reporting that may be intentional.
            `display_presentation_failed`; `input_device_missing`;
            `unauthenticated_network_listener` while
            `BLIT_ALLOW_UNAUTHENTICATED_NETWORK=1` is in force (ADR 0065); and
            `output_without_session` whenever an output has nothing on it,
            declared or not -- a display server presenting nothing is worth
            saying out loud, and Blit cannot know on its own whether a given
            output is supposed to be showing something; and
            `settings_document_unreadable` when the stored settings could not
            be read, which never stops a boot (ADR 0067) and so would
            otherwise be invisible.
          items:
            type: string
            enum: [display_presentation_failed, input_device_missing,
                   unauthenticated_network_listener, output_without_session,
                   settings_document_unreadable]
      additionalProperties: false
    RuntimeDiagnostics:
      type: object
      required: [snapshot, performance, logs]
      properties:
        snapshot: {$ref: '#/components/schemas/Diagnostics'}
        performance:
          type: object
          required: [uptime_ms, frames, last_frame_gap_ms, max_frame_gap_ms, last_render_ms, max_render_ms, missed_deadlines, frame_rate_max_render_ms, frame_rate_missed_deadlines, frame_rate_window_sequence, last_terminal_ms, max_terminal_ms, terminal_bytes, pointer_cache_hits, pointer_cache_misses, frame_rate_hz, input_events, last_input_dispatch_ms, max_input_dispatch_ms, evdev_mouse_events, evdev_mouse_syncs, evdev_mouse_motion_events, evdev_mouse_wheel_events, evdev_mouse_button_events, evdev_mouse_button_repeats_ignored, evdev_mouse_button_state_coalesced, last_evdev_mouse_event_age_ms, last_evdev_mouse_path, last_evdev_mouse_device_id, last_evdev_mouse_device_present, evdev_keyboard_events, evdev_keyboard_key_presses, evdev_keyboard_keys_delivered, evdev_keyboard_keys_undelivered, last_evdev_keyboard_event_age_ms, last_evdev_keyboard_path, last_evdev_keyboard_device_id, last_evdev_keyboard_device_present, input_keys_dropped, input_reports_dropped, sdl_mouse_events_discarded, sdl_mouse_events_processed, sdl_mouse_motion_events, sdl_mouse_button_events, sdl_mouse_fallback_events, stream_queue_bytes, stream_queue_peak_bytes, stream_dropped_events, stream_backpressure_disconnects, graphics_payloads, graphics_payloads_kitty, graphics_payloads_sixel, graphics_payloads_rejected, graphics_cache_hits, graphics_texture_uploads, last_graphics_upload_ms, max_graphics_upload_ms, background_batches, background_quads, pixel_frames_accepted, pixel_frame_errors, pixel_frames_pending, frame_rate_frames, frame_rate_window_ms, frame_rate_age_ms, loop_iterations, terminal_reads, surface_commits, surface_commit_hz, surface_commit_frames, surface_commit_window_ms, surface_commit_window_sequence, surface_commit_age_ms, last_surface_commit_gap_ms, max_surface_commit_gap_ms, frame_commits, present_calls, last_loop_gap_ms, max_loop_gap_ms, loop_gap_window_ms, loop_gap_window_sequence, loop_gap_window_max_ms, last_kms_present_ms, max_kms_present_ms, last_select_ms, max_select_ms, last_sdl_present_ms, max_sdl_present_ms, last_sdl_events_ms, max_sdl_events_ms, last_evdev_scan_ms, max_evdev_scan_ms, evdev_scan_opens, evdev_open_requests, evdev_open_requests_dropped, evdev_open_queue_depth, evdev_opener_thread]
          properties:
            uptime_ms: {type: integer, minimum: 0}
            frames: {type: integer, minimum: 0}
            last_frame_gap_ms: {type: number, minimum: 0}
            max_frame_gap_ms: {type: number, minimum: 0}
            last_render_ms: {type: number, minimum: 0}
            max_render_ms: {type: number, minimum: 0}
            missed_deadlines: {type: integer, minimum: 0}
            frame_rate_max_render_ms: {type: number, minimum: 0}
            frame_rate_missed_deadlines: {type: integer, minimum: 0}
            frame_rate_window_sequence: {type: integer, minimum: 0}
            last_terminal_ms: {type: number, minimum: 0}
            max_terminal_ms: {type: number, minimum: 0}
            terminal_bytes: {type: integer, minimum: 0}
            pointer_cache_hits: {type: integer, minimum: 0}
            pointer_cache_misses: {type: integer, minimum: 0}
            frame_rate_hz: {type: number, minimum: 0}
            input_events: {type: integer, minimum: 0}
            last_input_dispatch_ms: {type: number, minimum: 0}
            max_input_dispatch_ms: {type: number, minimum: 0}
            evdev_mouse_events: {type: integer, minimum: 0}
            evdev_mouse_syncs: {type: integer, minimum: 0}
            evdev_mouse_motion_events: {type: integer, minimum: 0}
            evdev_mouse_wheel_events: {type: integer, minimum: 0}
            evdev_mouse_button_events: {type: integer, minimum: 0}
            evdev_mouse_button_repeats_ignored: {type: integer, minimum: 0}
            evdev_mouse_button_state_coalesced: {type: integer, minimum: 0}
            last_evdev_mouse_event_age_ms: {type: integer, minimum: 0}
            last_evdev_mouse_path: {type: string}
            last_evdev_mouse_device_id: {type: string}
            last_evdev_mouse_device_present: {type: boolean}
            evdev_keyboard_events: {type: integer, minimum: 0}
            evdev_keyboard_key_presses: {type: integer, minimum: 0}
            evdev_keyboard_keys_delivered: {type: integer, minimum: 0}
            evdev_keyboard_keys_undelivered: {type: integer, minimum: 0}
            last_evdev_keyboard_event_age_ms: {type: integer, minimum: 0}
            last_evdev_keyboard_path: {type: string}
            last_evdev_keyboard_device_id: {type: string}
            last_evdev_keyboard_device_present: {type: boolean}
            input_keys_dropped:
              type: integer
              minimum: 0
              description: >-
                Key bytes a session's PTY would not take (issue #44). A
                blocked reader is a dropped keystroke, and a dropped keystroke
                that is not counted is indistinguishable from one that was
                never pressed.
            input_reports_dropped:
              type: integer
              minimum: 0
              description: Mouse reports a session's PTY would not take.
            sdl_mouse_events_discarded: {type: integer, minimum: 0}
            sdl_mouse_events_processed: {type: integer, minimum: 0}
            sdl_mouse_motion_events: {type: integer, minimum: 0}
            sdl_mouse_button_events: {type: integer, minimum: 0}
            sdl_mouse_fallback_events: {type: integer, minimum: 0}
            stream_queue_bytes: {type: integer, minimum: 0}
            stream_queue_peak_bytes: {type: integer, minimum: 0}
            stream_dropped_events: {type: integer, minimum: 0}
            stream_backpressure_disconnects: {type: integer, minimum: 0}
            graphics_payloads:
              type: integer
              minimum: 0
              description: >-
                Graphics payloads that reached the terminal parser, counted
                before anything could reject them. Without this, "the producer
                sent no image" and "Blit discarded the image" are the same
                observation from outside: both leave a session with zero
                images and no errors (issue #19). The `graphics_payload` trace
                entries carry the detail; these counters survive their
                eviction.
            graphics_payloads_kitty: {type: integer, minimum: 0}
            graphics_payloads_sixel: {type: integer, minimum: 0}
            graphics_payloads_rejected:
              type: integer
              minimum: 0
              description: >-
                Payloads that reached the parser and were rejected by it. A
                single payload counts once however many images it named.
            graphics_cache_hits: {type: integer, minimum: 0}
            graphics_texture_uploads: {type: integer, minimum: 0}
            last_graphics_upload_ms: {type: number, minimum: 0}
            max_graphics_upload_ms: {type: number, minimum: 0}
            background_batches: {type: integer, minimum: 0}
            background_quads: {type: integer, minimum: 0}
            pixel_frames_accepted: {type: integer, minimum: 0}
            pixel_frame_errors: {type: integer, minimum: 0}
            pixel_frames_pending: {type: integer, minimum: 0}
            frame_rate_frames: {type: integer, minimum: 0}
            frame_rate_window_ms: {type: integer, minimum: 0}
            frame_rate_age_ms: {type: integer, minimum: 0}
            loop_iterations: {type: integer, minimum: 0}
            terminal_reads: {type: integer, minimum: 0}
            surface_commits: {type: integer, minimum: 0}
            surface_commit_hz: {type: number, minimum: 0}
            surface_commit_frames: {type: integer, minimum: 0}
            surface_commit_window_ms: {type: integer, minimum: 0}
            surface_commit_window_sequence: {type: integer, minimum: 0}
            surface_commit_age_ms: {type: integer, minimum: 0}
            last_surface_commit_gap_ms: {type: number, minimum: 0}
            max_surface_commit_gap_ms: {type: number, minimum: 0}
            frame_commits: {type: integer, minimum: 0}
            present_calls: {type: integer, minimum: 0}
            last_loop_gap_ms: {type: number, minimum: 0}
            max_loop_gap_ms: {type: number, minimum: 0}
            loop_gap_window_ms: {type: integer, minimum: 0}
            loop_gap_window_sequence: {type: integer, minimum: 0}
            loop_gap_window_max_ms: {type: number, minimum: 0}
            last_kms_present_ms: {type: number, minimum: 0}
            max_kms_present_ms: {type: number, minimum: 0}
            last_sdl_present_ms: {type: number, minimum: 0}
            max_sdl_present_ms: {type: number, minimum: 0}
            last_select_ms: {type: number, minimum: 0}
            max_select_ms: {type: number, minimum: 0}
            last_sdl_events_ms: {type: number, minimum: 0}
            max_sdl_events_ms: {type: number, minimum: 0}
            last_evdev_scan_ms: {type: number, minimum: 0}
            evdev_open_requests:
              type: integer
              minimum: 0
              description: >-
                Device opens handed to the opener thread. Opening an evdev node
                is the one call on this path that can block for seconds -- the
                live host recorded 3.456s for one -- and there is no
                asynchronous open() for a character device, so it does not
                happen on the event-loop thread (issue #16).
            evdev_open_requests_dropped:
              type: integer
              minimum: 0
              description: >-
                Opens refused because the queue was full, which means a device
                is wedging the opener. Hotplug stops working while that holds,
                and the loop keeps presenting and serving -- that degradation
                is the reason the open was moved rather than merely bounded.
            evdev_open_queue_depth:
              type: integer
              minimum: 0
              description: Paths asked about and not yet answered for.
            evdev_opener_thread:
              type: boolean
              description: >-
                False when the thread could not be created, in which case opens
                run on the event loop as they did before.
            evdev_scan_opens:
              type: integer
              minimum: 0
              description: >-
                open() calls the input-device scan has made, lifetime. The
                scan walks 32 paths and used to open each one once per device
                kind; it now opens each path once to identify it and again
                only for a second kind the same device turns out to be. This
                counter is how that reduction is measured rather than
                asserted.
            max_evdev_scan_ms: {type: number, minimum: 0}
          additionalProperties: false
        logs:
          type: array
          items:
            type: object
            required: [sequence, severity, code, detail]
            properties:
              sequence: {type: integer, minimum: 1}
              severity: {type: string, enum: [info, warning, error]}
              code: {type: string}
              detail: {type: string}
            additionalProperties: false
      additionalProperties: false
    EffectState:
      type: object
      required: [revision, enabled, preset, intensity, backend]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        enabled: {type: boolean}
        preset:
          type: string
          enum: [none, scanlines]
        intensity: {type: integer, minimum: 0, maximum: 100}
        backend:
          type: string
          enum: [sdl3, drm-kms, unavailable]
      additionalProperties: false
    EffectUpdate:
      type: object
      required: [revision, enabled, preset, intensity]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        enabled: {type: boolean}
        preset:
          type: string
          enum: [none, scanlines]
        intensity: {type: integer, minimum: 0, maximum: 100}
      additionalProperties: false
    Overlay:
      type: object
      required: [id, revision, display_id, bounds, color, opacity]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        display_id: {$ref: '#/components/schemas/ResourceId'}
        bounds: {$ref: '#/components/schemas/Bounds'}
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        opacity: {type: integer, minimum: 0, maximum: 100}
      additionalProperties: false
    CreateOverlay:
      type: object
      required: [display_id, x, y, width, height, color, opacity]
      properties:
        display_id: {$ref: '#/components/schemas/ResourceId'}
        x: {type: integer}
        y: {type: integer}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        opacity: {type: integer, minimum: 0, maximum: 100}
      additionalProperties: false
    InputDevice:
      type: object
      required: [id, class, name, node, kinds, route_ids, capabilities,
                 identity, state, configuration, revision]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: >-
            Derived from what the device reports about itself, not from its
            node number (ADR 0064):
            `input-<bustype>-<vendor>-<product>[-<slug>][-<ordinal>]`, with the
            slug taken from the device's serial when it has one and from its
            physical bus position otherwise. It is as stable as udev's own
            by-id naming and no more: a device with no serial that is moved to
            a different port reports a different physical position and
            therefore gets a different id. A device that reports no identity
            at all -- a virtual or kernel-synthesised device -- is named
            `input-node-<basename>`, which says in the id itself that it is
            not stable. Configuration should be saved against this, never
            against `node`.
        class:
          type: string
          enum: [input]
        name: {type: string}
        node:
          type: string
          description: >-
            The device node, for example `/dev/input/event4`. Reported for
            diagnosis only. Node numbers are assigned in discovery order and
            change on replug and on reboot, so this is explicitly not a stable
            identifier.
        kinds:
          type: array
          description: >-
            How the server reads this device. These are exactly the predicates
            the poll loop uses, so a device listed as a keyboard is a device
            read as a keyboard. `other` means the server probed the device and
            reads it under no kind -- it is listed because a controller showing
            a device the server ignores is more useful than one that omits it.
          items:
            type: string
            enum: [keyboard, pointer, touch, gamepad, other]
        route_ids:
          type: array
          description: >-
            Aggregate input-route identities accepted by UpdateInputRoute for
            this physical source. Every discovered source of a kind feeds the
            corresponding aggregate route. A device of kind `other` feeds none
            and reports an empty list.
          items:
            type: string
            enum: [evdev-keyboard, evdev-pointer, evdev-gamepad]
        capabilities:
          type: array
          description: >-
            What evdev reports this device can do. `repeat` is EV_REP: the
            kernel autorepeats for the device, so its delay and rate are
            per-device kernel settings Blit owns through `EVIOCGREP` and
            `EVIOCSREP`. A control panel should hide a repeat control for a
            device without it rather than offer one that will be refused
            (issue #66).
          items:
            type: string
            enum: [rel-x, rel-y, buttons, keys, axes, gamepad-buttons, repeat]
        identity:
          type: object
          description: What the device reports about itself, as read by evdev.
          required: [bustype, vendor, product, version, uniq, phys]
          properties:
            bustype: {type: integer, minimum: 0}
            vendor: {type: integer, minimum: 0}
            product: {type: integer, minimum: 0}
            version: {type: integer, minimum: 0}
            uniq:
              type: string
              description: The device's own serial, empty when it reports none.
            phys:
              type: string
              description: The device's position on its bus, empty when unknown.
          additionalProperties: false
        state:
          type: object
          description: >-
            Live, read-only truth about the device, including its own event
            counters. The counters are per device; before ADR 0064 they
            existed only as lifetime cross-device totals and a diagnostics
            array keyed by a path the inventory did not publish.
          required: [present, open, polled_kinds, last_seen_ms, uptime_ms]
          properties:
            present: {type: boolean}
            open:
              type: boolean
              description: Whether the server currently holds this device open.
            polled_kinds:
              type: integer
              description: >-
                Bit set of the kinds currently open: 1 keyboard, 2 pointer,
                4 gamepad.
            last_seen_ms: {type: integer, minimum: 0}
            uptime_ms: {type: integer, minimum: 0}
            events: {type: integer, minimum: 0}
            keys: {type: integer, minimum: 0}
            pointer_events: {type: integer, minimum: 0}
            pointer_syncs: {type: integer, minimum: 0}
            pointer_motion: {type: integer, minimum: 0}
            pointer_wheel: {type: integer, minimum: 0}
            pointer_buttons: {type: integer, minimum: 0}
          additionalProperties: false
        configuration:
          type: object
          description: >-
            The writable part of the device, and the only writable part.
            Written with PATCH /v1/input/devices/{device_id}. It is held in
            memory: a Blit restart resets it to the defaults and a controller
            re-applies what it wants, with the collection revision dropping
            back toward 1 as the signal that it has to.
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: >-
                false releases every file descriptor the server holds for this
                device and stops it being claimed by later scans, so the
                device is left alone rather than merely ignored. It stays in
                the inventory and can be re-enabled.
            sensitivity_percent:
              type: integer
              minimum: 10
              maximum: 1000
              default: 100
              description: >-
                Scales relative motion from this device. Applies to the evdev
                path and to `pointer_relative` injection; SDL's own mouse
                events do not pass through it.
                Reported, and writable, for a device Blit reads as a pointer
                and for one of no known kind -- a device it probed and reads
                under no kind at all, about which it has made no claim.
                Refused with 422 on a device whose kinds contradict it, by the
                same rule that governs `keymap` and that `POST
                /v1/input/inject` applies to a `device_id`: a controller can
                set exactly what it can see, and an injection can deliver
                exactly what the device could have delivered.
            natural_scroll:
              type: boolean
              default: false
              description: >-
                Pointer devices only. Inverts the wheel direction this device
                reports.
            buttons:
              type: object
              additionalProperties:
                type: string
                enum: [left, middle, right, none]
              description: >-
                A sparse map from evdev code to the button that code produces,
                per device. Left-handed is `{"272":"right","273":"left"}`; a
                side button becomes useful with `{"275":"middle"}`; `none`
                disables a button.

                A map that would make two codes produce the same button is
                refused, and the refusal names both codes. The terminal mouse
                report holds one state per button, so two codes aliased onto
                one of them means pressing both and releasing one reports
                released while the other is still down. The check is on the
                *effective* map, defaults included -- so mapping `272` to
                right and leaving `273` alone is refused, because both would
                then produce right.
            scroll_step:
              type: integer
              minimum: 1
              maximum: 10
              default: 1
              description: >-
                How many wheel reports one notch produces. The difference
                between a usable and an unusable high-resolution wheel.
                Composes with `natural_scroll`, which decides the direction.
            acceleration:
              type: object
              additionalProperties: false
              required: [profile]
              properties:
                profile:
                  type: string
                  enum: [flat, adaptive]
                  default: flat
              description: >-
                `flat` is `sensitivity_percent` and nothing else, which is
                what this always did and is still the default --
                `sensitivity_percent` means exactly what it meant before this
                property existed. `adaptive` multiplies it again by a factor
                that rises with the size of the delta: untouched at or below
                2 counts, tripled at or above 20, linear between.

                The curve is defined on the magnitude of one event's delta and
                not on a speed in counts per second. That makes it exact and
                therefore testable, at the cost of depending on the device's
                report rate -- a 1000 Hz mouse sends small deltas for the hand
                speed that makes a 125 Hz mouse send large ones, so `adaptive`
                feels different on different hardware. The numbers are in
                `src/blit_input_pointer.h` and asserted by
                `tools/tests/pointer_curve_gate.c`.
            deadzone_percent:
              type: integer
              minimum: 0
              maximum: 50
              description: >-
                Gamepad axes only. An absolute value within this percentage of
                half the axis's own reported range reads as zero. A percentage
                of the reported range, so one setting means the same thing on
                a 0..255 stick and a -32768..32767 one.
            invert_axes:
              type: array
              maxItems: 16
              items: {type: integer, minimum: 0}
              description: >-
                Gamepad axes only. The evdev absolute-axis codes whose sign is
                flipped. Applied to a copy of the event before it is
                broadcast, and to `EV_ABS` only -- a button is not an axis,
                and a deadzone on one would silently swallow presses.
            repeat_delay_ms:
              type: integer
              minimum: 10
              maximum: 10000
              description: >-
                How long a key must be held before it starts repeating.
                Reported only for a device whose capabilities include
                `repeat`, and the value reported is what the last read from
                the kernel found -- not what Blit last asked for.
            repeat_rate_hz:
              type: integer
              minimum: 1
              maximum: 255
              description: >-
                How many repeats a second. The kernel holds a period in whole
                milliseconds, so the rate is quantised on the way in and a
                read-back can differ from the request: 30 Hz is a 33 ms
                period, which reads back as 30 Hz, while 7 Hz is 142 ms. That
                is why the read-back is what gets reported, and why
                `repeat_period_ms` is reported beside it.
            repeat_period_ms:
              type: integer
              minimum: 1
              description: >-
                Read-only. The period the kernel actually holds, from which
                `repeat_rate_hz` is derived.
            caps_lock_boot:
              type: boolean
              description: >-
                The Caps Lock state to apply when this keyboard is opened,
                including after a hotplug. Absent means unset, which leaves
                the kernel's own LED state as the authority -- the behaviour
                before this property existed. Blit writes the LED so the lamp
                and the behaviour agree.
            num_lock_boot:
              type: boolean
              description: >-
                The same for Num Lock, which decides whether the keypad types
                digits or selects navigation.
            modifiers:
              type: object
              additionalProperties:
                type: string
                enum: [none, shift, control, alt, altgr, meta, caps_lock,
                       num_lock]
              description: >-
                A sparse map from evdev code to the role that code plays, per
                device. This is how Caps-Lock-as-Control is expressed, and it
                is not expressible as a keymap: a keymap maps a code to the
                *characters* it types, and a modifier is not a character.

                The two compose in one order -- the remap decides what a code
                *is*, the keymap decides what it *types* -- and a code with a
                role never reaches the keymap. `none` swallows the key, which
                is how "disable this key" is said.

                A remapped code does not become the code it was mapped to:
                the held set stays keyed by the physical code, so holding a
                real Control and releasing a remapped Caps Lock leaves
                Control held.
            keymap:
              type: object
              description: >-
                How this keyboard's keys translate to characters: a **sparse
                override** on a built-in table, by evdev code, with four
                levels. It is per device, so two keyboards on one server can
                carry different layouts.
                Sparse rather than complete because a request is bounded and a
                complete table does not fit -- and a parser that accepted the
                prefix of one that did not fit would hand a controller a
                keyboard it believed it had configured. The whole of a layout
                difference is a few dozen keys.
                An item reports the base and which codes are overridden, not
                the levels: a full table would dominate the item, and the
                controller already holds the layout it sent.
                Writable for a device Blit reads as a keyboard and for one of
                no known kind; refused with 422 where the kinds contradict it,
                by the same rule as the pointer properties.
                Dead keys and compose sequences are **not** expressible: those
                need a stateful translator, which is a different feature.
              properties:
                base:
                  type: string
                  enum: [us]
                  description: >-
                    The built-in table the overrides sit on. There is one; it
                    is named so that adding a second does not change the shape.
                keys:
                  type: object
                  description: >-
                    Evdev code, as a decimal string, to the four levels:
                    plain, shift, altgr, shift+altgr. Each level is a UTF-8
                    string of at most one character, or `""` for a level this
                    key does not define -- in which case AltGr falls back to
                    the unmodified level, which is what AltGr does on a US
                    keyboard where it selects nothing. CapsLock inverts Shift
                    when the plain level is a single lower-case letter, and
                    only then. At most 128 codes; more is a 400.
                  additionalProperties:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: {type: string, maxLength: 4}
                override_count:
                  type: integer
                  minimum: 0
                  description: Read-only. How many codes this keymap overrides.
                codes:
                  type: array
                  description: Read-only. The codes this keymap overrides.
                  items: {type: integer, minimum: 1}
              additionalProperties: false
            route:
              type: object
              description: >-
                Where this device's input goes, overriding the aggregate route
                for its kind. Resolution order is: this route when it is
                enabled, then the aggregate evdev-keyboard/evdev-pointer/
                evdev-gamepad route, then the caller's own fallback (the
                focused session, or the surface under the pointer). A route
                that exists but is disabled falls through rather than
                blocking, so disabling it restores the previous behaviour
                instead of dropping the device's input. A route whose target
                session ends is disabled and keeps its target, so a controller
                can still see what it pointed at. Sending a route object with
                `enabled: false` and no `target_session_id` removes the route
                entirely, which is how a device is put back the way it was
                found.
                Routing a pointer sends that device's buttons and reports to
                the target regardless of where the cursor is; the cursor
                itself is global and shared by every pointer, as it is for the
                aggregate routes. The cell coordinates in a routed report are
                those of the surface under the cursor, clamped to the first
                cell when the cursor is over no surface -- so a routed pointer
                reports its target's buttons with the geometry of wherever the
                cursor happens to be. That is what the aggregate routes have
                always done.
              required: [enabled]
              properties:
                target_session_id:
                  $ref: '#/components/schemas/ResourceId'
                enabled: {type: boolean}
              additionalProperties: false
          additionalProperties: false
        revision:
          allOf:
            - $ref: '#/components/schemas/Revision'
          description: >-
            Counts changes to this device: its reported kinds and
            capabilities, its `state.present`, and its configuration. It is
            what a configuring PATCH carries in If-Match, so a PATCH written
            against a device that has since been unplugged conflicts rather
            than being applied to a device that is no longer there.
      additionalProperties: false
    InjectedPointerEvent:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [pointer_motion, pointer_relative, pointer_button,
                 pointer_wheel, key]
        device_id:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: >-
            Optional. Names an input device from /v1/input/devices, so the
            injected event travels the path a real event from that device
            travels, including that device's configuration: a relative motion
            is scaled by its sensitivity_percent and a wheel event honours its
            natural_scroll. Injecting through a disabled device is a 409 and
            delivers nothing. Without it the event is injected with the
            defaults and attributed to the aggregate route, which is what this
            endpoint did before ADR 0064.
        x: {type: integer, description: Absolute virtual-desktop X coordinate.}
        y: {type: integer, description: Absolute virtual-desktop Y coordinate.}
        dx:
          type: integer
          description: >-
            pointer_relative only. A relative X delta, as REL_X carries it.
        dy:
          type: integer
          description: >-
            pointer_relative only. A relative Y delta, as REL_Y carries it.
        button: {type: integer, minimum: 0, maximum: 2}
        pressed: {type: boolean}
        delta: {type: integer, description: Wheel direction and magnitude.}
        code:
          type: integer
          minimum: 1
          maximum: 767
          description: >-
            Key kind only. The Linux evdev key code, as a physical device
            reports it. Modifier codes update the server's modifier state, so a
            modified key is injected as press-modifier, press-key,
            release-key, release-modifier, exactly as a device would send it.
        value:
          type: integer
          minimum: 0
          maximum: 2
          description: >-
            Key kind only. 0 release, 1 press, 2 autorepeat, matching
            input_event.value.
      additionalProperties: false
    UpdateInputRoute:
      type: object
      required: [device_id, target_session_id, enabled]
      properties:
        device_id:
          type: string
          enum: [evdev-keyboard, evdev-pointer, evdev-gamepad]
          description: >-
            An aggregate pseudo-device: every discovered source of that kind
            feeds it. Since ADR 0064 a single device can carry its own route
            under its `configuration`, which wins over this one; these remain
            as the fallback and as the identity the event stream publishes.
        target_session_id: {$ref: '#/components/schemas/ResourceId'}
        enabled: {type: boolean}
      additionalProperties: false
    InputRoute:
      type: object
      required: [id, device_id, target_session_id, enabled]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        device_id:
          type: string
          enum: [evdev-keyboard, evdev-pointer, evdev-gamepad]
        target_session_id: {$ref: '#/components/schemas/ResourceId'}
        enabled: {type: boolean}
      additionalProperties: false
    ShutdownKey:
      type: object
      required: [enabled, code, modifiers]
      properties:
        enabled: {type: boolean}
        code: {type: integer, minimum: 1, maximum: 767}
        modifiers:
          type: array
          items:
            type: string
            enum: [shift, control, alt, altgr]
      additionalProperties: false

    Topology:
      type: object
      required: [id, revision, layout, outputs, panes]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        layout:
          type: object
          required: [columns, rows]
          properties:
            columns: {type: integer, minimum: 1, maximum: 2}
            rows: {type: integer, minimum: 1, maximum: 2}
          additionalProperties: false
        outputs:
          type: array
          items:
            type: object
            required: [display_id, bounds]
            properties:
              display_id: {$ref: '#/components/schemas/ResourceId'}
              bounds: {$ref: '#/components/schemas/Bounds'}
              rotation: {type: integer, enum: [0, 90, 180, 270]}
              scale: {type: number, exclusiveMinimum: 0}
            additionalProperties: false
        panes:
          type: array
          items:
            $ref: '#/components/schemas/Pane'
      additionalProperties: false
    TopologyUpdate:
      type: object
      required: [layout]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        layout:
          type: object
          required: [columns, rows]
          properties:
            columns: {type: integer, minimum: 1, maximum: 2}
            rows: {type: integer, minimum: 1, maximum: 2}
          additionalProperties: false
        placements:
          type: array
          description: Complete logical placement for every discovered display. Gaps are represented by coordinate differences.
          items:
            $ref: '#/components/schemas/OutputPlacement'
      additionalProperties: false
    OutputPlacement:
      type: object
      required: [display_id, x, y]
      properties:
        display_id: {$ref: '#/components/schemas/ResourceId'}
        x: {type: integer}
        y: {type: integer}
      additionalProperties: false
    Pane:
      type: object
      required: [id, display_id, bounds, surface_id]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        display_id: {$ref: '#/components/schemas/ResourceId'}
        bounds: {$ref: '#/components/schemas/Bounds'}
        surface_id:
          oneOf:
            - {$ref: '#/components/schemas/ResourceId'}
            - {type: 'null'}
      additionalProperties: false
    CreateTerminalSession:
      type: object
      required: [command]
      properties:
        command: {type: string, minLength: 1}
        user:
          type: string
          minLength: 1
          description: >-
            Optional local account identity for the child process. When Blit
            runs as root, the child is initialized with that account's
            supplementary groups, uid, gid, HOME, USER, and LOGNAME before
            exec. Omitting this field preserves the service identity.
        arguments:
          type: array
          items: {type: string}
        environment:
          type: object
          additionalProperties: {type: string}
        surface:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
          description: >-
            Optional when pane_id or display_id is supplied. In that case Blit
            derives the complete logical cell geometry from the authoritative
            pane or physical display bounds. Supplying surface explicitly is
            required for an unplaced session.
        display_id: {$ref: '#/components/schemas/ResourceId'}
        pane_id: {$ref: '#/components/schemas/ResourceId'}
        surface_mode:
          type: string
          enum: [terminal, external, mirror]
          default: terminal
          description: >-
            terminal lets Blit parse ordinary PTY output into the surface.
            external keeps the PTY for lifecycle and input while an adapter
            owns all surface mutations and revisions. mirror lets Blit parse
            a joined Hibr/hold stream copied from a primary desktop.
      additionalProperties: false
    TerminalInput:
      type: object
      required: [data]
      properties:
        data:
          type: string
          minLength: 1
          maxLength: 768
          description: >-
            UTF-8 text or terminal escape bytes to write to the PTY. JSON
            string escapes, including Unicode escapes such as \u001b, are
            decoded before the bounded PTY write.
        mode:
          type: string
          enum: [raw, paste]
          default: raw
          description: >-
            paste wraps data in bracketed-paste delimiters when the session has
            enabled DEC mode 2004; raw writes data unchanged.
      additionalProperties: false
    TerminalInputReceipt:
      type: object
      required: [session_id, bytes_requested, bytes_written, mode]
      properties:
        session_id: {$ref: '#/components/schemas/ResourceId'}
        bytes_requested: {type: integer, minimum: 1}
        bytes_written: {type: integer, minimum: 1}
        mode: {type: string, enum: [raw, paste, paste-fallback]}
      additionalProperties: false
    UpdateTerminalSession:
      type: object
      properties:
        display_id: {$ref: '#/components/schemas/ResourceId'}
        pane_id: {$ref: '#/components/schemas/ResourceId'}
        surface:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
        input_route:
          description: Bind this session to an existing input-route resource.
          $ref: '#/components/schemas/ResourceId'
        focused:
          type: boolean
          description: Make this session the keyboard-focus target; a primary-button click also focuses its pane.
      additionalProperties: false
    TerminalSession:
      type: object
      required: [id, revision, surface_revision, state, surface_id, title,
                 terminal_capabilities, hibr_attachment, hibr_desktop]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        surface_revision: {$ref: '#/components/schemas/Revision'}
        state:
          type: string
          enum: [starting, running, stopped, failed]
        surface_id: {$ref: '#/components/schemas/ResourceId'}
        title:
          type: string
          description: >-
            Current terminal title from OSC 0, OSC 1, or OSC 2. Empty until
            the PTY emits a title control.
        clipboard:
          type: string
          description: >-
            Most recent OSC 52 clipboard payload in Hibr's canonical
            selection;base64 form. Empty until the PTY sets the clipboard;
            clipboard read queries are never answered.
        notification:
          type: string
          description: >-
            Most recent OSC 9 or OSC 777 notification payload. OSC 9 numeric
            progress reports are not exposed as notifications.
        display_id: {$ref: '#/components/schemas/ResourceId'}
        pane_id: {$ref: '#/components/schemas/ResourceId'}
        process_id: {type: integer, minimum: 1}
        exit_code: {type: integer}
        focused: {type: boolean}
        surface_mode: {type: string, enum: [terminal, external, mirror]}
        cursor: {$ref: '#/components/schemas/Cursor'}
        terminal_capabilities:
          $ref: '#/components/schemas/TerminalCapabilities'
        hibr_attachment:
          $ref: '#/components/schemas/HibrAttachmentDiagnostics'
        hibr_desktop:
          $ref: '#/components/schemas/HibrDesktopBinding'
        graphics:
          type: array
          description: >-
            Bounded Kitty or sixel graphics records observed in this session.
            The field is diagnostic until the protocol capability is advertised.
          items: {$ref: '#/components/schemas/GraphicsImage'}
        graphics_diagnostics:
          $ref: '#/components/schemas/GraphicsDiagnostics'
      additionalProperties: false
    HibrAttachmentDiagnostics:
      type: object
      required: [resume_requested, reassert_attempts, owner_matches, unresolved,
                 owner_registered, owner_pid]
      properties:
        resume_requested: {type: boolean}
        reassert_attempts: {type: integer, minimum: 0}
        owner_matches: {type: integer, minimum: 0}
        unresolved: {type: boolean}
        owner_registered: {type: boolean}
        owner_pid: {type: integer, minimum: 0}
      additionalProperties: false
    HibrDesktopBinding:
      type: object
      required: [role, session]
      properties:
        role:
          type: string
          enum: [none, primary, join]
          description: >-
            Blit's enforced Hibr ownership role. A primary owns the named
            held desktop; join clients attach to that same Hibr session and
            never create a second desktop state owner.
        session:
          type: string
          description: Hibr held-session name, normally `blit`.
      additionalProperties: false
    HibrOwnerRegistration:
      type: object
      required: [pid, token]
      properties:
        pid: {type: integer, minimum: 2}
        token: {type: string, minLength: 1}
      additionalProperties: false
    TerminalCapabilities:
      type: object
      required: [term, cell_pixels, graphics]
      properties:
        term:
          type: string
          description: >-
            Effective TERM value presented to the PTY child. The default
            xterm-kitty advertises Blit's Kitty-capable terminal contract;
            an explicit session environment may override it.
        cell_pixels:
          type: object
          required: [width, height]
          properties:
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
        graphics:
          type: array
          minItems: 2
          items: {type: string, enum: [kitty, sixel]}
      additionalProperties: false
    GraphicsDiagnostics:
      type: object
      required: [rejected, evicted, last_error]
      properties:
        rejected: {type: integer, minimum: 0}
        evicted: {type: integer, minimum: 0}
        last_error: {type: string}
      additionalProperties: false
    GraphicsImage:
      type: object
      required: [id, protocol, complete, visible, width, height, format, bytes,
                 pixel_crc32, x, y,
                 placement_width, placement_height, z, revision]
      properties:
        id: {type: integer, minimum: 1}
        protocol: {type: string, enum: [kitty, sixel]}
        complete: {type: boolean}
        visible: {type: boolean}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        format: {type: integer, enum: [24, 32]}
        bytes: {type: integer, minimum: 0, maximum: 67108864}
        pixel_crc32:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: >-
            CRC-32 of the decoded samples, for asserting that two
            transmissions of the same picture produced the same picture.
            Dimensions and byte counts agree for images that differ, so they
            cannot serve that purpose. It is a checksum for comparison, not a
            digest for trust. Zero while the payload is still a staged
            container rather than samples.
        x: {type: integer}
        y: {type: integer}
        placement_width: {type: integer, minimum: 0, maximum: 4096}
        placement_height: {type: integer, minimum: 0, maximum: 4096}
        z: {type: integer}
        placements:
          type: array
          maxItems: 8
          description: >-
            Numbered placements of this image (Kitty `p=`), in addition to the
            default placement described by the top-level fields. At most 8.
          items: {$ref: '#/components/schemas/GraphicsPlacement'}
        revision: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    GraphicsPlacement:
      type: object
      required: [id, x, y, width, height, z, source]
      properties:
        id: {type: integer, minimum: 1}
        x: {type: integer, description: Destination pixel x on the surface.}
        y: {type: integer, description: Destination pixel y on the surface.}
        width: {type: integer, minimum: 0, maximum: 4096}
        height: {type: integer, minimum: 0, maximum: 4096}
        z: {type: integer}
        source:
          type: object
          description: >-
            The rectangle of the image that is drawn (Kitty `x y w h`).
            Width and height are zero until resolved against the image size.
          required: [x, y, width, height]
          properties:
            x: {type: integer, minimum: 0}
            y: {type: integer, minimum: 0}
            width: {type: integer, minimum: 0}
            height: {type: integer, minimum: 0}
          additionalProperties: false
      additionalProperties: false
    Cursor:
      type: object
      required: [x, y, visible]
      properties:
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        visible: {type: boolean}
        style:
          type: integer
          minimum: 0
          maximum: 6
          description: >-
            VT DECSCUSR style: 0/1 blinking block, 2 steady block,
            3 blinking underline, 4 steady underline, 5 blinking bar,
            or 6 steady bar. Backends may render blinking styles steadily.
      additionalProperties: false
    SurfaceSnapshot:
      type: object
      required: [id, revision, width, height, cursor, cells]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        cursor: {$ref: '#/components/schemas/Cursor'}
        cells:
          type: array
          items:
            type: object
            required: [x, y, width, text]
            properties:
              x: {type: integer, minimum: 0}
              y: {type: integer, minimum: 0}
              width:
                type: integer
                enum: [0, 1, 2]
                description: Physical cell width; zero marks the continuation column of a wide glyph.
              text:
                type: string
                minLength: 1
                description: Complete UTF-8 cell sequence, including combining marks, joiners, and variation selectors.
              link:
                type: string
                description: URI from the active OSC 8 hyperlink, when present.
              style: {$ref: '#/components/schemas/CellStyle'}
            additionalProperties: false
      additionalProperties: false
    SurfaceSummary:
      type: object
      required: [id, revision, width, height, non_empty_cells, codepoint_cells,
                 printable_cells, cursor,
                 graphics_images, frame_open, damage]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        non_empty_cells: {type: integer, minimum: 0}
        codepoint_cells:
          type: integer
          minimum: 0
          description: Cells containing a codepoint, including spaces.
        printable_cells:
          type: integer
          minimum: 0
          description: Cells containing a printable codepoint.
        cursor: {$ref: '#/components/schemas/Cursor'}
        graphics_images: {type: integer, minimum: 0}
        frame_open:
          type: boolean
          description: >-
            True while a multi-request frame is open, which withholds the
            surface from the renderer until a `commit`. A `defer` opens it;
            `commit` and `immediate` both close it.
        damage:
          type: object
          required: [valid, x, y, width, height]
          properties:
            valid: {type: boolean}
            x: {type: integer, minimum: 0}
            y: {type: integer, minimum: 0}
            width: {type: integer, minimum: 0}
            height: {type: integer, minimum: 0}
          additionalProperties: false
      additionalProperties: false
    ScrollbackSnapshot:
      type: object
      required: [id, count, view, lines]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        count: {type: integer, minimum: 0, maximum: 1000}
        view: {type: integer, minimum: 0, maximum: 1000}
        lines:
          type: array
          items:
            type: object
            required: [index, width, text]
            properties:
              index: {type: integer, minimum: 0}
              width: {type: integer, minimum: 1}
              text: {type: string}
            additionalProperties: false
      additionalProperties: false
    CellStyle:
      type: object
      properties:
        foreground:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        background:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        bold: {type: boolean}
        dim: {type: boolean}
        italic: {type: boolean}
        underline: {type: boolean}
        blink: {type: boolean}
        inverse: {type: boolean}
        strike: {type: boolean}
        concealed: {type: boolean}
        underline_color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
      additionalProperties: false
    CellUpdate:
      type: object
      required: [base_revision, cells]
      properties:
        base_revision: {$ref: '#/components/schemas/Revision'}
        cells:
          type: array
          items:
            type: object
            required: [x, y, text]
            properties:
              x: {type: integer, minimum: 0}
              y: {type: integer, minimum: 0}
              text:
                type: string
                minLength: 1
                description: UTF-8 text spanning logical cells; wide glyphs occupy two columns and combining marks, joiners, and variation selectors attach to the preceding glyph.
              style: {$ref: '#/components/schemas/CellStyle'}
            additionalProperties: false
        cursor: {$ref: '#/components/schemas/Cursor'}
        presentation:
          type: string
          enum: [immediate, defer, commit]
          default: immediate
          description: >-
            Controls visual presentation of this update. `immediate` applies
            and presents it normally. `defer` applies the revision but keeps
            it out of the renderer as part of a bounded multi-request frame.
            `commit` applies the final chunk and presents the complete frame.
            A `commit` with no preceding `defer` is a 409 `frame_not_open`, so
            a frame that fits in one request uses `immediate`. Deferred cells
            are applied to the surface immediately; only their presentation
            waits, so a deferred chunk advances the revision like any other
            accepted write.
      additionalProperties: false
    FrameRequest:
      type: object
      required: [base_revision, surface_ids]
      properties:
        base_revision: {$ref: '#/components/schemas/Revision'}
        surface_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ResourceId'}
      additionalProperties: false
    MutationReceipt:
      type: object
      required: [revision, accepted]
      properties:
        revision: {$ref: '#/components/schemas/Revision'}
        accepted: {type: boolean}
      additionalProperties: false
    FrameReceipt:
      type: object
      required: [frame_id, revision, state]
      properties:
        frame_id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        state:
          type: string
          enum: [accepted, presenting, presented, failed]
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        revision: {$ref: '#/components/schemas/Revision'}
        diagnostics:
          type: array
          items: {type: string}
      additionalProperties: true
    StreamSubscribe:
      type: object
      required: [type, subscriptions]
      properties:
        type: {type: string, const: subscribe}
        subscriptions:
          type: array
          items:
            type: string
            enum: [input, terminals, surfaces, frames, hardware, diagnostics]
      additionalProperties: false
    StreamPixelFrameBegin:
      type: object
      required: [type, session_id, image_id, width, height, format]
      properties:
        type: {type: string, const: pixel_frame_begin}
        session_id: {$ref: '#/components/schemas/ResourceId'}
        image_id: {type: integer, minimum: 1}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        format: {type: integer, enum: [24, 32]}
        x: {type: integer, default: 0}
        y: {type: integer, default: 0}
        z: {type: integer, default: 0}
        ack:
          type: boolean
          default: false
          description: Request one presentation receipt for every completed frame.
        chunked:
          type: boolean
          default: false
          description: Send the binary pixels as bounded WebSocket chunks followed by pixel_frame_end.
      additionalProperties: false
    StreamPixelFrameReceipt:
      type: object
      required: [type, state]
      properties:
        type:
          type: string
          enum: [pixel_frame_ready, pixel_frame_present, pixel_frame_error]
        state: {type: string}
        code: {type: string}
      additionalProperties: false
    StreamInputEvent:
      type: object
      required: [type, session_id, device_id, event]
      properties:
        type: {type: string, const: input}
        session_id: {$ref: '#/components/schemas/ResourceId'}
        device_id: {$ref: '#/components/schemas/ResourceId'}
        event:
          type: object
          description: >-
            Every event includes monotonic receipt time_us. For evdev-gamepad,
            kind is gamepad_button or gamepad_axis and the event also includes
            the Linux evdev code and value. Pointer events include coordinates
            and output/cell targeting; keyboard events include modifier and
            repeat state.
          required: [time_us]
          properties:
            time_us: {type: integer, minimum: 0}
            kind:
              type: string
              description: The input event kind.
            code:
              type: integer
              minimum: 0
              description: Linux evdev code for keyboard and gamepad events.
            pressed:
              type: boolean
              description: Keyboard or button edge state.
            repeat:
              type: boolean
              description: True for a keyboard autorepeat event.
            shift: {type: boolean}
            ctrl: {type: boolean}
            alt: {type: boolean}
            text:
              type: string
              maxLength: 8
              description: >-
                Keyboard press/repeat only, and omitted for a non-text key.
                The printable UTF-8 text resolved by the source device's
                keymap, Shift, CapsLock and AltGr state. Consumers use this
                instead of deriving a character from the physical evdev code;
                code remains authoritative for named non-text keys.
          additionalProperties: true
      additionalProperties: false
    StreamTerminalOutput:
      type: object
      required: [type, session_id, data, sequence]
      properties:
        type: {type: string, const: terminal_output}
        session_id: {$ref: '#/components/schemas/ResourceId'}
        data: {type: string}
        sequence: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    StreamSurfaceDelta:
      type: object
      required: [type, surface_id, revision, cursor, sequence]
      properties:
        type: {type: string, const: surface_delta}
        surface_id: {$ref: '#/components/schemas/ResourceId'}
        revision: {$ref: '#/components/schemas/Revision'}
        sequence: {$ref: '#/components/schemas/Revision'}
        cursor: {$ref: '#/components/schemas/Cursor'}
        damage:
          type: object
          required: [x, y, width, height]
          properties:
            x: {type: integer, minimum: 0}
            y: {type: integer, minimum: 0}
            width: {type: integer, minimum: 1}
            height: {type: integer, minimum: 1}
          additionalProperties: false
      additionalProperties: false
    StreamFrameEvent:
      type: object
      required: [type, frame, sequence]
      properties:
        type: {type: string, const: frame}
        frame: {$ref: '#/components/schemas/FrameReceipt'}
        sequence: {$ref: '#/components/schemas/Revision'}
      additionalProperties: false
    StreamDiagnosticEvent:
      type: object
      required: [type, severity, code, detail]
      properties:
        type: {type: string, const: diagnostic}
        severity:
          type: string
          enum: [debug, info, warning, error, critical]
        code: {type: string}
        detail: {type: string}
        resource_id: {$ref: '#/components/schemas/ResourceId'}
      additionalProperties: false
